<!DOCTYPE html>
<html lang="en">

<style>
  :root {
    --ink: #1f2430; --paper: #fafaf8; --card: #fff;
    --line: #dcdad2; --line-strong: #c3c0b6;
    --accent: #1f3550; --accent-2: #2e6b8f; --muted: #6b6a63; --err: #a3372b;
  }
  * { box-sizing: border-box; }
  body {
    font-family: "Segoe UI", Georgia, "Times New Roman", serif;
    background: var(--paper); color: var(--ink); margin: 0;
    padding: 24px 20px 100px; line-height: 1.45;
  }
  .wrap { max-width: 1280px; margin: 0 auto; }
  .app-header { display: flex; align-items: baseline; justify-content: space-between; gap: 1rem; flex-wrap: wrap; margin-bottom: 1.4rem; }
  .app-header h1 { font-size: 1.7rem; margin: 0 0 .2rem; }
  .back-link { color: var(--muted); text-decoration: none; font-size: .88rem; }
  .back-link:hover { color: var(--accent-2); }

  .toolbar { display: flex; flex-wrap: wrap; gap: .6rem; align-items: center; margin-bottom: 1.2rem; }
  .toolbar select { font-family: inherit; font-size: .9rem; padding: .5rem .6rem; border: 1px solid var(--line-strong); border-radius: 7px; background: #fff; color: var(--ink); }

  .layout { display: grid; grid-template-columns: minmax(300px, 400px) 1fr; gap: 1.4rem; align-items: start; }
  @media (max-width: 900px) { .layout { grid-template-columns: 1fr; } }

  .card { background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 1.1rem 1.2rem; margin-bottom: 1rem; }
  label { display: block; font-weight: 600; font-size: .82rem; margin-bottom: .3rem; }
  .hint { color: var(--muted); font-size: .78rem; margin: -.15rem 0 .6rem; }
  input[type="text"], select {
    width: 100%; font-family: inherit; font-size: .92rem; color: var(--ink);
    background: #fff; border: 1px solid var(--line-strong); border-radius: 6px;
    padding: .5rem .6rem; margin-bottom: .8rem;
  }

  button {
    font-family: inherit; font-size: .92rem; font-weight: 600; cursor: pointer;
    background: var(--accent); color: #fff; border: 1px solid var(--accent);
    border-radius: 7px; padding: .55rem 1rem;
  }
  button:hover { background: var(--accent-2); border-color: var(--accent-2); }
  button.secondary { background: #fff; color: var(--ink); border-color: var(--line-strong); }
  button.secondary:hover { background: #f1f0ea; border-color: var(--muted); color: var(--ink); }
  button.danger { background: #fff; color: var(--err); border-color: var(--err); }
  button.danger:hover { background: var(--err); color: #fff; }
  button.small { padding: .25rem .55rem; font-size: .8rem; }
  button.full { width: 100%; }

  .item-row {
    display: flex; align-items: center; gap: .5rem; padding: .5rem 0;
    border-bottom: 1px dashed var(--line);
  }
  .item-row:last-child { border-bottom: none; }
  .item-row .fields { flex: 1; min-width: 0; }
  .item-row .item-name { font-weight: 700; font-size: .88rem; }
  .item-row .item-expr { font-family: Consolas, monospace; font-size: .85rem; color: var(--accent-2); }
  .item-row .item-note { font-size: .78rem; color: var(--muted); }
  .item-row .btns { display: flex; gap: .3rem; flex-shrink: 0; }

  .add-form { border-top: 1px solid var(--line); margin-top: .8rem; padding-top: .8rem; }
  .add-form .row3 { display: grid; grid-template-columns: 1fr 1fr 1fr auto; gap: .5rem; align-items: end; }
  .add-form label { margin-bottom: .2rem; }

  .preview-wrap { background: #d9d7cd; border-radius: 10px; padding: 1.4rem; overflow: auto; }
  .preview-note { font-size: .8rem; color: var(--muted); margin-bottom: .8rem; }

  .sheet {
    background: #fff; width: 8.5in; min-height: 11in; margin: 0 auto; padding: 0.7in 0.65in;
    box-shadow: 0 2px 10px rgba(0,0,0,.18); max-width: 100%;
  }
  .sheet-title { font-size: 1.5rem; font-weight: 700; margin-bottom: .2rem; text-align: center; }
  .sheet-sub { text-align: center; color: var(--muted); font-size: .85rem; margin-bottom: 1.2rem; border-bottom: 1px solid var(--line); padding-bottom: .6rem; }
  .formulas { column-count: 2; column-gap: 1.6rem; }
  .formula { break-inside: avoid; margin-bottom: .9rem; }
  .formula .fname { font-weight: 700; font-size: .92rem; }
  .formula .fexpr { font-family: Consolas, monospace; font-size: 1.05rem; color: var(--accent); margin: .1rem 0; }
  .formula .fnote { font-size: .78rem; color: var(--muted); font-style: italic; }
  .empty-sheet { color: var(--muted); text-align: center; padding: 3rem 1rem; font-style: italic; }

  footer.note { color: var(--muted); font-size: .82rem; margin-top: 2rem; }

  @media print {
    body * { visibility: hidden; }
    #printArea, #printArea * { visibility: visible; }
    #printArea { display: block !important; position: absolute; left: 0; top: 0; width: 100%; margin: 0; }
    #printArea .sheet { box-shadow: none; }
    @page { size: letter portrait; margin: 0; }
  }
</style>
</head>
<body>
<div class="wrap">

  <div class="app-header">
    <div>
      <a class="back-link" href="../index.html">&larr; Toolkit</a>
      <h1>Formula Reference Sheet Builder</h1>
    </div>
  </div>

  <div class="toolbar" id="toolbar" style="display:none;">
    <label style="margin:0;font-weight:600;font-size:.85rem;">Sheet:</label>
    <select id="sheetSwitch"></select>
    <button class="secondary" id="newSheetBtn">New sheet</button>
    <button class="danger" id="deleteSheetBtn">Delete</button>
  </div>

  <div class="layout">
    <div class="editor">
      <div class="card">
        <label for="sheetName">Sheet name</label>
        <p class="hint">Lets you save more than one reference sheet (e.g. one per unit).</p>
        <input type="text" id="sheetName" placeholder="e.g. Unit 4 Formulas">

        <label for="sheetTitle">Printed title</label>
        <input type="text" id="sheetTitle" placeholder="e.g. Unit 4: Area &amp; Volume Formulas">

        <label for="columnCount">Columns</label>
        <select id="columnCount">
          <option value="1">1 column</option>
          <option value="2" selected>2 columns</option>
          <option value="3">3 columns</option>
        </select>

        <label for="templatePicker">Start from a template</label>
        <select id="templatePicker"></select>
        <button type="button" class="secondary full" id="loadTemplateBtn">Load template (replaces current list)</button>
      </div>

      <div class="card">
        <label style="margin-bottom:.6rem;">Formulas on this sheet</label>
        <div id="itemsList"></div>
        <p class="hint" id="emptyHint" style="display:none;">No formulas yet — load a template above or add one below.</p>

        <div class="add-form">
          <label>Add a formula</label>
          <div class="row3">
            <div><input type="text" id="newName" placeholder="Name"></div>
            <div><input type="text" id="newExpr" placeholder="Expression"></div>
            <div><input type="text" id="newNote" placeholder="Note (optional)"></div>
            <div><button type="button" id="addItemBtn">Add</button></div>
          </div>
        </div>
      </div>

      <button type="button" id="printBtn" class="full">Print</button>
    </div>

    <div class="preview-wrap">
      <p class="preview-note">Live preview &mdash; this is exactly what prints (one page).</p>
      <div id="previewArea"></div>
    </div>
  </div>

  <footer class="note">
    Runs entirely in your browser &mdash; nothing is uploaded.
  </footer>

</div>

<div id="printArea" style="display:none;"></div>

<script>
(function () {
  'use strict';

  var els = {};
  ['toolbar','sheetSwitch','newSheetBtn','deleteSheetBtn',
   'sheetName','sheetTitle','columnCount','templatePicker','loadTemplateBtn',
   'itemsList','emptyHint','newName','newExpr','newNote','addItemBtn',
   'printBtn','previewArea'
  ].forEach(function (id) { els[id] = document.getElementById(id); });

  var state = null; // { name, title, items: [{name, expression, note}] }

  function escapeHtml(s) {
    return String(s || '').replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }

  function save() {
    if (!state) return;
    FormulaSheetStore.saveSheet(state.name, state);
  }

  function refreshSwitcher() {
    var names = FormulaSheetStore.listSheets();
    els.sheetSwitch.innerHTML = '';
    names.forEach(function (n) {
      var opt = document.createElement('option');
      opt.value = n; opt.textContent = n;
      if (state && n === state.name) opt.selected = true;
      els.sheetSwitch.appendChild(opt);
    });
  }

  function buildTemplatePicker() {
    FormulaTemplates.TEMPLATES.forEach(function (t) {
      var opt = document.createElement('option');
      opt.value = t.key; opt.textContent = t.label;
      els.templatePicker.appendChild(opt);
    });
  }

  function renderItemsEditor() {
    els.itemsList.innerHTML = '';
    els.emptyHint.style.display = state.items.length ? 'none' : '';
    state.items.forEach(function (item, i) {
      var row = document.createElement('div');
      row.className = 'item-row';
      var fields = document.createElement('div');
      fields.className = 'fields';
      fields.innerHTML =
        '<div class="item-name">' + escapeHtml(item.name) + '</div>' +
        '<div class="item-expr">' + escapeHtml(item.expression) + '</div>' +
        (item.note ? '<div class="item-note">' + escapeHtml(item.note) + '</div>' : '');
      row.appendChild(fields);

      var btns = document.createElement('div');
      btns.className = 'btns';
      var upBtn = document.createElement('button');
      upBtn.type = 'button'; upBtn.className = 'secondary small'; upBtn.textContent = '↑';
      upBtn.disabled = i === 0;
      upBtn.addEventListener('click', function () {
        state.items.splice(i - 1, 0, state.items.splice(i, 1)[0]);
        renderAll();
      });
      var downBtn = document.createElement('button');
      downBtn.type = 'button'; downBtn.className = 'secondary small'; downBtn.textContent = '↓';
      downBtn.disabled = i === state.items.length - 1;
      downBtn.addEventListener('click', function () {
        state.items.splice(i + 1, 0, state.items.splice(i, 1)[0]);
        renderAll();
      });
      var removeBtn = document.createElement('button');
      removeBtn.type = 'button'; removeBtn.className = 'danger small'; removeBtn.textContent = '×';
      removeBtn.addEventListener('click', function () {
        state.items.splice(i, 1);
        renderAll();
      });
      btns.appendChild(upBtn); btns.appendChild(downBtn); btns.appendChild(removeBtn);
      row.appendChild(btns);
      els.itemsList.appendChild(row);
    });
  }

  function sheetHtml() {
    var itemsHtml = state.items.length
      ? state.items.map(function (item) {
          return '<div class="formula">' +
            '<div class="fname">' + escapeHtml(item.name) + '</div>' +
            '<div class="fexpr">' + escapeHtml(item.expression) + '</div>' +
            (item.note ? '<div class="fnote">' + escapeHtml(item.note) + '</div>' : '') +
          '</div>';
        }).join('')
      : '<div class="empty-sheet">No formulas yet.</div>';
    return (
      '<div class="sheet">' +
        '<div class="sheet-title">' + escapeHtml(state.title || state.name) + '</div>' +
        '<div class="sheet-sub">Name: _______________________&emsp;&emsp;Period: _____</div>' +
        '<div class="formulas" style="column-count:' + (state.columns || 2) + ';">' + itemsHtml + '</div>' +
      '</div>'
    );
  }

  function renderAll() {
    save();
    refreshSwitcher();
    els.toolbar.style.display = '';
    els.sheetName.value = state.name;
    els.sheetTitle.value = state.title;
    els.columnCount.value = state.columns || 2;
    renderItemsEditor();
    els.previewArea.innerHTML = sheetHtml();
  }

  function newSheet(name) {
    state = { name: name, title: '', columns: 2, items: [] };
    FormulaSheetStore.setCurrentName(name);
    renderAll();
  }

  function loadSheetByName(name) {
    var loaded = FormulaSheetStore.loadSheet(name);
    if (!loaded) return;
    state = loaded;
    if (!state.columns) state.columns = 2; // sheets saved before this field existed
    FormulaSheetStore.setCurrentName(name);
    renderAll();
  }

  /* ---------- wiring ---------- */
  els.sheetName.addEventListener('change', function () {
    if (!state) return;
    var oldName = state.name;
    var newName = els.sheetName.value.trim() || oldName;
    if (newName !== oldName) {
      FormulaSheetStore.deleteSheet(oldName);
      state.name = newName;
    }
    renderAll();
  });
  els.sheetTitle.addEventListener('input', function () { if (state) { state.title = els.sheetTitle.value; save(); els.previewArea.innerHTML = sheetHtml(); } });
  els.columnCount.addEventListener('change', function () {
    if (!state) return;
    state.columns = parseInt(els.columnCount.value, 10) || 2;
    save();
    els.previewArea.innerHTML = sheetHtml();
  });

  els.loadTemplateBtn.addEventListener('click', function () {
    if (!state) return;
    if (state.items.length && !confirm('Replace the current formula list with this template?')) return;
    var tmpl = FormulaTemplates.byKey(els.templatePicker.value);
    if (!tmpl) return;
    state.items = tmpl.items.map(function (i) { return { name: i.name, expression: i.expression, note: i.note }; });
    if (!state.title) state.title = tmpl.label;
    renderAll();
  });

  els.addItemBtn.addEventListener('click', function () {
    var name = els.newName.value.trim();
    var expr = els.newExpr.value.trim();
    var note = els.newNote.value.trim();
    if (!name || !expr) { alert('Enter at least a name and an expression.'); return; }
    state.items.push({ name: name, expression: expr, note: note });
    els.newName.value = ''; els.newExpr.value = ''; els.newNote.value = '';
    renderAll();
  });

  els.sheetSwitch.addEventListener('change', function () { loadSheetByName(els.sheetSwitch.value); });

  els.newSheetBtn.addEventListener('click', function () {
    var name = prompt('Name for the new sheet:', 'New Sheet');
    if (!name) return;
    newSheet(name.trim());
  });

  els.deleteSheetBtn.addEventListener('click', function () {
    if (!state) return;
    if (!confirm('Delete "' + state.name + '" completely? This can’t be undone.')) return;
    FormulaSheetStore.deleteSheet(state.name);
    var remaining = FormulaSheetStore.listSheets();
    if (remaining.length) loadSheetByName(remaining[0]);
    else newSheet('New Sheet');
  });

  els.printBtn.addEventListener('click', function () {
    document.getElementById('printArea').innerHTML = sheetHtml();
    window.print();
  });

  /* ---------- boot ---------- */
  buildTemplatePicker();
  var current = FormulaSheetStore.getCurrentName();
  if (current && FormulaSheetStore.loadSheet(current)) {
    loadSheetByName(current);
  } else {
    newSheet('New Sheet');
  }
})();
</script>
<script>
if ('serviceWorker' in navigator) {
  window.addEventListener('load', function () {
    navigator.serviceWorker.register('../sw.js').catch(function () {});
  });
}
</script>
</body>
