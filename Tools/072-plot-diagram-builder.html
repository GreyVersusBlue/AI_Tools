<style>
  * { box-sizing: border-box; }
  body {
    font-family: "Segoe UI", Georgia, "Times New Roman", serif;
    background: var(--paper); color: var(--ink); margin: 0;
    padding: 24px 20px 100px; line-height: 1.45;
  }
  .wrap { max-width: 1200px; margin: 0 auto; }
  .app-header h1 { font-size: 1.7rem; margin: 0 0 .2rem; }
  .app-header .sub { color: var(--muted); font-size: .88rem; margin: 0; }
  .back-link { color: var(--muted); text-decoration: none; font-size: .88rem; }
  .back-link:hover { color: var(--accent-2); }

  .card h2 { font-size: 1rem; margin: 0 0 .7rem; }
  label { display: block; font-weight: 600; font-size: .82rem; margin-bottom: .3rem; }
  input[type="text"], textarea {
    width: 100%; font-family: inherit; font-size: .9rem; color: var(--ink);
    background: #fff; border: 1px solid var(--line-strong); border-radius: 6px;
    padding: .45rem .55rem; margin-bottom: .6rem;
  }
  textarea { resize: vertical; min-height: 3.5rem; }
  .info-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 0 1rem; }
  .elements-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 0 1rem; }

  button {
    font-family: inherit; font-size: .92rem; font-weight: 600; cursor: pointer;
    background: var(--accent); color: #fff; border: 1px solid var(--accent);
    border-radius: 7px; padding: .55rem 1rem;
  }
  button.secondary { background: #fff; color: var(--ink); border-color: var(--line-strong); }
  button.secondary:hover { background: #f1f0ea; border-color: var(--muted); color: var(--ink); }
  button.danger { background: #fff; color: var(--err); border-color: var(--err); }
  button.danger:hover { background: var(--err); color: #fff; }
  select {
    font-family: inherit; font-size: .9rem; color: var(--ink);
    background: #fff; border: 1px solid var(--line-strong); border-radius: 6px;
    padding: .45rem .55rem; width: 100%;
  }
  .saves-row { display: flex; gap: .6rem; align-items: flex-end; flex-wrap: wrap; }
  .saves-row > div:first-child { flex: 1; min-width: 200px; }
  .saves-row label { margin-bottom: .3rem; }

  .mountain-wrap { position: relative; height: 380px; margin: 1rem 0 2rem; }
  .mountain-svg { position: absolute; top: 0; left: 0; width: 100%; height: 100%; }
  .stage-box { position: absolute; width: 180px; }
  .stage-box .stage-label { font-weight: 700; font-size: .82rem; color: var(--accent); margin-bottom: .2rem; text-align: center; }
  .stage-box textarea { min-height: 4.5rem; font-size: .8rem; }
  .stage-box textarea.filled { background: #f4f8f3; border-color: #8fae82; }

  .print-title { font-size: 1.5rem; margin: 0 0 .1rem; text-align: center; }
  .print-author { text-align: center; color: #555; margin: 0 0 1rem; }
  .print-elements { display: grid; grid-template-columns: 1fr 1fr; gap: .3rem 1.5rem; font-size: .88rem; margin-bottom: 1.2rem; }
  .print-elements b { color: var(--accent); }
  .print-mountain-wrap { position: relative; height: 340px; margin-top: .5rem; }
  .print-stage-box { position: absolute; width: 200px; font-size: .82rem; }
  .print-stage-box .stage-label { font-weight: 700; color: var(--accent); }

  /* ── Presentation mode — a large-type, borderless, read-only render of
     the current diagram for projecting live during class discussion.
     Independent CSS overlay (not gated on the Fullscreen API succeeding)
     so it works the same in every browser, including ones that refuse
     fullscreen; requestFullscreen() is layered on top only as a bonus
     that also hides the browser chrome when the browser allows it. This
     mirrors the projector-mode pattern already used by Number Talks
     Board (Tools/024), which hardcodes its own dark stage background
     independent of the page's ink/paper theme for the same reason:
     legibility from the back of a room matters more than theme
     consistency for a projected view. ── */
  #presentStage { display: none; }
  #presentStage.active {
    display: flex; flex-direction: column; align-items: center;
    position: fixed; inset: 0; z-index: 2147483000;
    background: #0c0f16; color: #f4f6fa;
    padding: clamp(1.2rem, 3vw, 3rem) clamp(1.2rem, 4vw, 3.5rem);
    overflow: auto;
  }
  body.presenting { overflow: hidden; }
  .present-exit-btn {
    position: absolute; top: 1rem; right: 1rem;
    background: rgba(255,255,255,.08); color: #f4f6fa; border: 1px solid rgba(255,255,255,.25);
    border-radius: 8px; padding: .5rem .9rem; font-size: .85rem; font-weight: 600; cursor: pointer;
  }
  .present-exit-btn:hover { background: rgba(255,255,255,.18); }
  .present-content { width: min(94vw, 1500px); margin: 0 auto; display: flex; flex-direction: column; align-items: center; }
  .present-title { font-size: clamp(1.6rem, 4vw, 3rem); margin: 0 0 .1rem; text-align: center; }
  .present-author { font-size: clamp(1rem, 1.6vw, 1.4rem); color: #b9c2cf; margin: 0 0 1.2rem; text-align: center; }
  .present-elements {
    display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: .5rem 2rem;
    width: 100%; max-width: 1300px; font-size: clamp(.95rem, 1.5vw, 1.25rem); margin-bottom: clamp(1rem, 2.5vw, 2rem);
  }
  .present-elements b { color: #8fb4d6; font-weight: 700; }
  .present-mountain-wrap { position: relative; width: 100%; max-width: 1500px; aspect-ratio: 1000 / 420; }
  .present-mountain-svg { position: absolute; top: 0; left: 0; width: 100%; height: 100%; }
  .present-stage-box { position: absolute; width: 19%; text-align: center; }
  .present-stage-label {
    font-weight: 700; font-size: clamp(.85rem, 1.6vw, 1.3rem); color: #8fb4d6;
    margin-bottom: .3rem; text-transform: uppercase; letter-spacing: .03em;
  }
  .present-stage-text {
    font-size: clamp(1rem, 1.9vw, 1.6rem); line-height: 1.3; white-space: pre-wrap;
    background: rgba(255,255,255,.06); border-radius: 10px; padding: .6rem .7rem;
  }
  .present-stage-text.empty { color: #6b7688; font-style: italic; }
</style>
</head>
<body>
<div class="wrap">
  <div class="app-header">
    <div>
      <a class="back-link" href="../index.html">&larr; Toolkit</a>
      <h1>Story Elements / Plot Diagram Builder</h1>
      <p class="sub">Build a plot-mountain diagram and story elements summary, then print or project it.</p>
    </div>
    <div>
      <button class="secondary" id="presentBtn">Present</button>
      <button class="secondary" id="printBtn">Print diagram</button>
    </div>
  </div>

  <div class="card">
    <h2>Saved diagrams</h2>
    <div class="saves-row">
      <div>
        <label for="diagramSelect">Current diagram</label>
        <select id="diagramSelect"></select>
      </div>
      <button type="button" class="secondary" id="newDiagramBtn">+ New diagram</button>
      <button type="button" class="secondary" id="renameDiagramBtn">Rename</button>
      <button type="button" class="danger" id="deleteDiagramBtn">Delete</button>
    </div>
  </div>

  <div class="card">
    <div class="info-grid">
      <div><label for="storyTitle">Story title</label><input type="text" id="storyTitle"></div>
      <div><label for="storyAuthor">Author</label><input type="text" id="storyAuthor"></div>
    </div>
  </div>

  <div class="card">
    <h2>Story elements</h2>
    <div class="elements-grid">
      <div><label for="elChar">Characters</label><textarea id="elChar" placeholder="Main character(s) and who they are"></textarea></div>
      <div><label for="elSetting">Setting</label><textarea id="elSetting" placeholder="Where and when the story takes place"></textarea></div>
      <div><label for="elConflict">Conflict</label><textarea id="elConflict" placeholder="The main problem the character faces"></textarea></div>
      <div><label for="elTheme">Theme</label><textarea id="elTheme" placeholder="The bigger idea or lesson of the story"></textarea></div>
    </div>
  </div>

  <div class="card">
    <h2>Plot mountain</h2>
    <div class="mountain-wrap">
      <svg class="mountain-svg" viewBox="0 0 1000 380" preserveAspectRatio="none">
        <polyline points="20,340 260,340 500,40 740,340 980,340" fill="none" stroke="#1f3550" stroke-width="4" stroke-linejoin="round"/>
      </svg>
      <div class="stage-box" style="left:0%;top:82%;">
        <div class="stage-label">Exposition</div>
        <textarea data-stage="exposition" placeholder="Characters, setting, and situation introduced"></textarea>
      </div>
      <div class="stage-box" style="left:12%;top:38%;">
        <div class="stage-label">Rising Action</div>
        <textarea data-stage="rising" placeholder="Events build tension toward the climax"></textarea>
      </div>
      <div class="stage-box" style="left:41%;top:2%;">
        <div class="stage-label">Climax</div>
        <textarea data-stage="climax" placeholder="The turning point of the story"></textarea>
      </div>
      <div class="stage-box" style="left:68%;top:38%;">
        <div class="stage-label">Falling Action</div>
        <textarea data-stage="falling" placeholder="Events after the climax start to resolve"></textarea>
      </div>
      <div class="stage-box" style="left:80%;top:82%;">
        <div class="stage-label">Resolution</div>
        <textarea data-stage="resolution" placeholder="How the story wraps up"></textarea>
      </div>
    </div>
  </div>
</div>

<div id="printArea"></div>

<div id="presentStage" aria-hidden="true">
  <button type="button" class="present-exit-btn" id="presentExitBtn" title="Exit presentation (Esc)">&#10005; Exit presentation</button>
  <div class="present-content" id="presentContent"></div>
</div>

<script>
(function () {
  'use strict';
  var LEGACY_STORE_KEY = 'pdb_diagram_v1';
  var LIST_KEY = 'pdb_list_v1';
  var DATA_PREFIX = 'pdb_data_v1:';
  var CURRENT_KEY = 'pdb_current_v1';

  var els = {};
  ['storyTitle', 'storyAuthor', 'elChar', 'elSetting', 'elConflict', 'elTheme', 'printBtn', 'printArea',
   'diagramSelect', 'newDiagramBtn', 'renameDiagramBtn', 'deleteDiagramBtn',
   'presentBtn', 'presentStage', 'presentContent', 'presentExitBtn'].forEach(function (id) {
    els[id] = document.getElementById(id);
  });
  var stageEls = document.querySelectorAll('[data-stage]');

  function blankState() { return { title: '', author: '', characters: '', setting: '', conflict: '', theme: '', stages: {} }; }
  var state = blankState();
  var currentName = null;

  function safeParse(json, fallback) {
    if (json == null) return fallback;
    try { var v = JSON.parse(json); return v == null ? fallback : v; } catch (e) { return fallback; }
  }
  function listDiagrams() { return safeParse(localStorage.getItem(LIST_KEY), []); }
  function setList(names) { try { localStorage.setItem(LIST_KEY, JSON.stringify(names)); } catch (e) { /* storage full/blocked */ } }
  function loadDiagram(name) { return safeParse(localStorage.getItem(DATA_PREFIX + name), null); }
  function persistDiagram(name, data) {
    var names = listDiagrams();
    if (names.indexOf(name) === -1) { names.push(name); setList(names); }
    try { localStorage.setItem(DATA_PREFIX + name, JSON.stringify(data)); } catch (e) { /* storage full/blocked */ }
  }
  function deleteDiagramData(name) {
    setList(listDiagrams().filter(function (n) { return n !== name; }));
    try { localStorage.removeItem(DATA_PREFIX + name); } catch (e) { /* ignore */ }
  }
  function getCurrentName() { return localStorage.getItem(CURRENT_KEY); }
  function setCurrentName(name) {
    try {
      if (name) localStorage.setItem(CURRENT_KEY, name);
      else localStorage.removeItem(CURRENT_KEY);
    } catch (e) { /* ignore */ }
  }
  function uniqueName(base, existing) {
    var name = base, n = 2;
    while (existing.indexOf(name) !== -1) { name = base + ' (' + n + ')'; n++; }
    return name;
  }

  function migrateLegacyIfNeeded() {
    if (listDiagrams().length) return;
    var legacy = safeParse(localStorage.getItem(LEGACY_STORE_KEY), null);
    if (!legacy || typeof legacy !== 'object') return;
    var hasContent = legacy.title || legacy.author || legacy.characters || legacy.setting ||
      legacy.conflict || legacy.theme || (legacy.stages && Object.keys(legacy.stages).some(function (k) { return legacy.stages[k]; }));
    if (!hasContent) return;
    var name = uniqueName((legacy.title && legacy.title.trim()) || 'My First Diagram', []);
    if (!legacy.stages) legacy.stages = {};
    persistDiagram(name, legacy);
    setCurrentName(name);
  }

  function save() {
    if (!currentName) return;
    persistDiagram(currentName, state);
  }

  function populateFields() {
    els.storyTitle.value = state.title || '';
    els.storyAuthor.value = state.author || '';
    els.elChar.value = state.characters || '';
    els.elSetting.value = state.setting || '';
    els.elConflict.value = state.conflict || '';
    els.elTheme.value = state.theme || '';
    stageEls.forEach(function (ta) {
      var v = state.stages[ta.getAttribute('data-stage')] || '';
      ta.value = v;
      ta.classList.toggle('filled', !!v.trim());
    });
  }

  function renderDiagramSelect() {
    var names = listDiagrams();
    els.diagramSelect.innerHTML = names.map(function (n) {
      return '<option value="' + n.replace(/"/g, '&quot;') + '"' + (n === currentName ? ' selected' : '') + '>' + n + '</option>';
    }).join('');
  }

  function switchToDiagram(name) {
    var data = loadDiagram(name);
    if (!data) return;
    currentName = name;
    state = data;
    if (!state.stages) state.stages = {};
    setCurrentName(name);
    populateFields();
    renderDiagramSelect();
  }

  function createNewDiagram(name) {
    var names = listDiagrams();
    var finalName = uniqueName(name, names);
    var fresh = blankState();
    persistDiagram(finalName, fresh);
    switchToDiagram(finalName);
  }

  els.diagramSelect.addEventListener('change', function () {
    switchToDiagram(els.diagramSelect.value);
  });

  els.newDiagramBtn.addEventListener('click', function () {
    var name = prompt('Name for the new diagram (e.g. the novel or story title):', '');
    if (name === null) return;
    name = name.trim() || 'Untitled Diagram';
    createNewDiagram(name);
  });

  els.renameDiagramBtn.addEventListener('click', function () {
    if (!currentName) return;
    var name = prompt('Rename this diagram:', currentName);
    if (name === null) return;
    name = name.trim();
    if (!name || name === currentName) return;
    var names = listDiagrams().filter(function (n) { return n !== currentName; });
    var finalName = uniqueName(name, names);
    persistDiagram(finalName, state);
    deleteDiagramData(currentName);
    currentName = finalName;
    setCurrentName(finalName);
    renderDiagramSelect();
  });

  els.deleteDiagramBtn.addEventListener('click', function () {
    if (!currentName) return;
    if (!confirm('Delete "' + currentName + '"? This can’t be undone.')) return;
    deleteDiagramData(currentName);
    var remaining = listDiagrams();
    if (remaining.length) {
      switchToDiagram(remaining[0]);
    } else {
      createNewDiagram('My Diagram');
    }
  });

  function escapeHtml(s) {
    return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }

  els.storyTitle.addEventListener('input', function () { state.title = els.storyTitle.value; save(); });
  els.storyAuthor.addEventListener('input', function () { state.author = els.storyAuthor.value; save(); });
  els.elChar.addEventListener('input', function () { state.characters = els.elChar.value; save(); });
  els.elSetting.addEventListener('input', function () { state.setting = els.elSetting.value; save(); });
  els.elConflict.addEventListener('input', function () { state.conflict = els.elConflict.value; save(); });
  els.elTheme.addEventListener('input', function () { state.theme = els.elTheme.value; save(); });

  stageEls.forEach(function (ta) {
    ta.addEventListener('input', function () {
      state.stages[ta.getAttribute('data-stage')] = ta.value;
      ta.classList.toggle('filled', !!ta.value.trim());
      save();
    });
  });

  var STAGE_LABELS = { exposition: 'Exposition', rising: 'Rising Action', climax: 'Climax', falling: 'Falling Action', resolution: 'Resolution' };
  var STAGE_POS = { exposition: { left: '0%', top: '82%' }, rising: { left: '12%', top: '38%' }, climax: { left: '41%', top: '2%' }, falling: { left: '68%', top: '38%' }, resolution: { left: '80%', top: '82%' } };

  els.printBtn.addEventListener('click', function () {
    var title = state.title.trim() || 'Plot Diagram';
    var author = state.author.trim() ? 'by ' + escapeHtml(state.author.trim()) : '';
    var EM_DASH = '—';
    var elementsHtml = '<div class="print-elements">' +
      '<div><b>Characters:</b> ' + escapeHtml(state.characters || EM_DASH) + '</div>' +
      '<div><b>Setting:</b> ' + escapeHtml(state.setting || EM_DASH) + '</div>' +
      '<div><b>Conflict:</b> ' + escapeHtml(state.conflict || EM_DASH) + '</div>' +
      '<div><b>Theme:</b> ' + escapeHtml(state.theme || EM_DASH) + '</div>' +
      '</div>';
    var stagesHtml = Object.keys(STAGE_LABELS).map(function (key) {
      var pos = STAGE_POS[key];
      return '<div class="print-stage-box" style="left:' + pos.left + ';top:' + pos.top + ';">' +
        '<div class="stage-label">' + STAGE_LABELS[key] + '</div><div>' + escapeHtml(state.stages[key] || EM_DASH) + '</div></div>';
    }).join('');
    els.printArea.innerHTML = '<h1 class="print-title">' + escapeHtml(title) + '</h1>' +
      (author ? '<p class="print-author">' + author + '</p>' : '') +
      elementsHtml +
      '<div class="print-mountain-wrap"><svg style="position:absolute;top:0;left:0;width:100%;height:100%;" viewBox="0 0 1000 340" preserveAspectRatio="none">' +
      '<polyline points="20,300 260,300 500,20 740,300 980,300" fill="none" stroke="#1f3550" stroke-width="4" stroke-linejoin="round"/></svg>' +
      stagesHtml + '</div>';
    window.print();
  });

  /* ---------- presentation mode ----------
     A large-type, borderless, read-only render of the current diagram for
     projecting live during a class discussion. Built from the same state
     the print view uses, so it can never drift out of sync with what's
     actually in the form. The overlay is shown via a CSS class regardless
     of whether the Fullscreen API is available; requestFullscreen() is
     layered on top as a bonus (hides the browser chrome too) where the
     browser allows it, but the read-only view works either way. */
  function renderPresentContent() {
    var title = state.title.trim() || 'Plot Diagram';
    var author = state.author.trim() ? 'by ' + escapeHtml(state.author.trim()) : '';
    var EM_DASH = '—';
    var elementsHtml = '<div class="present-elements">' +
      '<div><b>Characters:</b> ' + escapeHtml(state.characters || EM_DASH) + '</div>' +
      '<div><b>Setting:</b> ' + escapeHtml(state.setting || EM_DASH) + '</div>' +
      '<div><b>Conflict:</b> ' + escapeHtml(state.conflict || EM_DASH) + '</div>' +
      '<div><b>Theme:</b> ' + escapeHtml(state.theme || EM_DASH) + '</div>' +
      '</div>';
    var stagesHtml = Object.keys(STAGE_LABELS).map(function (key) {
      var pos = STAGE_POS[key];
      var raw = state.stages[key] || '';
      var cls = raw.trim() ? 'present-stage-text' : 'present-stage-text empty';
      return '<div class="present-stage-box" style="left:' + pos.left + ';top:' + pos.top + ';">' +
        '<div class="present-stage-label">' + STAGE_LABELS[key] + '</div>' +
        '<div class="' + cls + '">' + escapeHtml(raw || EM_DASH) + '</div></div>';
    }).join('');
    els.presentContent.innerHTML = '<h1 class="present-title">' + escapeHtml(title) + '</h1>' +
      (author ? '<p class="present-author">' + author + '</p>' : '') +
      elementsHtml +
      '<div class="present-mountain-wrap"><svg class="present-mountain-svg" viewBox="0 0 1000 380" preserveAspectRatio="none">' +
      '<polyline points="20,340 260,340 500,40 740,340 980,340" fill="none" stroke="#f4f6fa" stroke-width="4" stroke-linejoin="round"/></svg>' +
      stagesHtml + '</div>';
  }

  function enterPresent() {
    renderPresentContent();
    els.presentStage.classList.add('active');
    els.presentStage.setAttribute('aria-hidden', 'false');
    document.body.classList.add('presenting');
    var el = els.presentStage;
    if (el.requestFullscreen) {
      el.requestFullscreen().catch(function () { /* overlay is already showing regardless */ });
    } else if (el.webkitRequestFullscreen) {
      el.webkitRequestFullscreen();
    }
    els.presentExitBtn.focus();
  }

  function exitPresent() {
    if (document.fullscreenElement === els.presentStage && document.exitFullscreen) {
      document.exitFullscreen().catch(function () { /* ignore */ });
    } else if (document.webkitFullscreenElement === els.presentStage && document.webkitExitFullscreen) {
      document.webkitExitFullscreen();
    }
    els.presentStage.classList.remove('active');
    els.presentStage.setAttribute('aria-hidden', 'true');
    document.body.classList.remove('presenting');
    els.presentBtn.focus();
  }

  els.presentBtn.addEventListener('click', enterPresent);
  els.presentExitBtn.addEventListener('click', exitPresent);

  document.addEventListener('fullscreenchange', function () {
    // Covers the browser's own Esc/F11 exit of a real fullscreen session:
    // drop the overlay too so it doesn't get stranded on-screen.
    if (!document.fullscreenElement && els.presentStage.classList.contains('active')) {
      els.presentStage.classList.remove('active');
      els.presentStage.setAttribute('aria-hidden', 'true');
      document.body.classList.remove('presenting');
    }
  });

  document.addEventListener('keydown', function (e) {
    if (e.key === 'Escape' && els.presentStage.classList.contains('active')) {
      exitPresent();
    }
  });

  /* ---------- boot ---------- */
  migrateLegacyIfNeeded();
  var names = listDiagrams();
  var startName = getCurrentName();
  if (!startName || names.indexOf(startName) === -1) startName = names[0] || null;
  if (startName) {
    switchToDiagram(startName);
  } else {
    createNewDiagram('My Diagram');
  }
})();
</script>
