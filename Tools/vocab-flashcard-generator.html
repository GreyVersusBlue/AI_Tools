<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">

<title>Vocabulary Flashcard &amp; Word Wall Generator</title>

<script src="vocab-flashcard-generator/vfg-layout.js"></script>

<style>
  :root {
    --ink: #1f2430; --paper: #fafaf8; --card: #fff;
    --line: #dcdad2; --line-strong: #c3c0b6;
    --accent: #1f3550; --accent-2: #2e6b8f; --muted: #6b6a63; --err: #a3372b;
  }
  * { box-sizing: border-box; }
  body {
    font-family: "Segoe UI", Georgia, "Times New Roman", serif;
    background: var(--paper); color: var(--ink); margin: 0;
    padding: 24px 20px 100px; line-height: 1.45;
  }
  .wrap { max-width: 1280px; margin: 0 auto; }
  .app-header { display: flex; align-items: baseline; justify-content: space-between; gap: 1rem; flex-wrap: wrap; margin-bottom: 1.4rem; }
  .app-header h1 { font-size: 1.7rem; margin: 0 0 .2rem; }
  .back-link { color: var(--muted); text-decoration: none; font-size: .88rem; }
  .back-link:hover { color: var(--accent-2); }

  .toolbar { display: flex; flex-wrap: wrap; gap: .6rem; align-items: center; margin-bottom: 1.2rem; }
  .toolbar select { font-family: inherit; font-size: .9rem; padding: .5rem .6rem; border: 1px solid var(--line-strong); border-radius: 7px; background: #fff; color: var(--ink); }

  .layout { display: grid; grid-template-columns: minmax(300px, 380px) 1fr; gap: 1.4rem; align-items: start; }
  @media (max-width: 900px) { .layout { grid-template-columns: 1fr; } }

  .card { background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 1.1rem 1.2rem; margin-bottom: 1rem; }
  label { display: block; font-weight: 600; font-size: .82rem; margin-bottom: .3rem; }
  .hint { color: var(--muted); font-size: .78rem; margin: -.15rem 0 .6rem; }
  input[type="text"], select, textarea {
    width: 100%; font-family: inherit; font-size: .92rem; color: var(--ink);
    background: #fff; border: 1px solid var(--line-strong); border-radius: 6px;
    padding: .5rem .6rem; margin-bottom: .8rem;
  }
  textarea { min-height: 9rem; resize: vertical; font-family: Consolas, monospace; font-size: .85rem; }
  .row2 { display: grid; grid-template-columns: 1fr 1fr; gap: .7rem; }

  .mode-tabs { display: flex; gap: .4rem; margin-bottom: .9rem; }
  .mode-tab { flex: 1; text-align: center; padding: .5rem; border: 1px solid var(--line-strong); border-radius: 7px; background: #fff; cursor: pointer; font-weight: 700; font-size: .85rem; color: var(--muted); }
  .mode-tab.active { color: #fff; background: var(--accent); border-color: var(--accent); }

  button {
    font-family: inherit; font-size: .92rem; font-weight: 600; cursor: pointer;
    background: var(--accent); color: #fff; border: 1px solid var(--accent);
    border-radius: 7px; padding: .6rem 1.1rem; width: 100%; margin-bottom: .5rem;
  }
  button:hover { background: var(--accent-2); border-color: var(--accent-2); }
  button.secondary { background: #fff; color: var(--ink); border-color: var(--line-strong); }
  button.secondary:hover { background: #f1f0ea; border-color: var(--muted); color: var(--ink); }
  button.danger { background: #fff; color: var(--err); border-color: var(--err); }
  button.danger:hover { background: var(--err); color: #fff; }

  .preview-wrap { background: #d9d7cd; border-radius: 10px; padding: 1.4rem; overflow: auto; }
  .preview-note { font-size: .8rem; color: var(--muted); margin-bottom: .8rem; }
  .print-note { font-size: .82rem; color: var(--accent-2); background: #eaf1f6; border: 1px solid #c9dce6; border-radius: 6px; padding: .6rem .8rem; margin-bottom: 1rem; }

  .sheet-view { display: flex; flex-wrap: wrap; gap: .3rem; margin-bottom: 1rem; }
  .sheet-view button.secondary { width: auto; margin: 0; }

  .page {
    background: #fff; width: 8.5in; margin: 0 auto 1rem; padding: 0.4in;
    box-shadow: 0 2px 10px rgba(0,0,0,.18); max-width: 100%;
  }
  .grid { display: grid; gap: 0.15in; }
  .flash-card {
    border: 1px dashed #999; display: flex; flex-direction: column; align-items: center; justify-content: center;
    text-align: center; padding: 0.1in; overflow: hidden;
  }
  .flash-card.blank { border-style: dotted; opacity: .3; }
  .flash-card .term { font-weight: 700; font-size: 1.1rem; }
  .flash-card .def { font-size: .82rem; color: var(--muted); margin-top: .3rem; }

  .wordwall-card {
    border: 1px dashed #999; display: flex; flex-direction: column; align-items: center; justify-content: center;
    text-align: center; padding: 0.3in;
  }
  .wordwall-card .term { font-weight: 800; font-size: 2.4rem; line-height: 1.1; }
  .wordwall-card .def { font-size: 1rem; color: var(--muted); margin-top: .6rem; }

  footer.note { color: var(--muted); font-size: .82rem; margin-top: 2rem; }

  @media print {
    body * { visibility: hidden; }
    #printArea, #printArea * { visibility: visible; }
    #printArea { display: block !important; position: absolute; left: 0; top: 0; width: 100%; margin: 0; }
    #printArea .page { box-shadow: none; page-break-after: always; margin: 0; }
    #printArea .page:last-child { page-break-after: auto; }
    @page { size: letter portrait; margin: 0.2in; }
  }
</style>
</head>
<body>
<div class="wrap">

  <div class="app-header">
    <div>
      <a class="back-link" href="../index.html">&larr; Toolkit</a>
      <h1>Vocabulary Flashcard &amp; Word Wall Generator</h1>
    </div>
  </div>

  <div class="toolbar" id="toolbar" style="display:none;">
    <label style="margin:0;font-weight:600;font-size:.85rem;">List:</label>
    <select id="listSwitch"></select>
    <button class="secondary" style="width:auto;" id="newListBtn">New list</button>
    <button class="danger" style="width:auto;" id="deleteListBtn">Delete</button>
  </div>

  <div class="layout">
    <div class="editor">
      <div class="card">
        <label for="listName">List name</label>
        <input type="text" id="listName" placeholder="e.g. Unit 4 Vocabulary">

        <label for="wordInput">Words (one per line, "term: definition")</label>
        <p class="hint">Example: Photosynthesis: process plants use to make food</p>
        <textarea id="wordInput" placeholder="Photosynthesis: process plants use to make food&#10;Mitosis: cell division"></textarea>
      </div>

      <div class="card">
        <div class="mode-tabs">
          <div class="mode-tab active" data-mode="flashcards">Flashcards</div>
          <div class="mode-tab" data-mode="wordwall">Word wall cards</div>
        </div>

        <div id="flashOptions">
          <div class="row2">
            <div><label for="flashCols">Columns</label><input type="text" id="flashCols" value="2"></div>
            <div><label for="flashRows">Rows</label><input type="text" id="flashRows" value="4"></div>
          </div>
        </div>

        <div id="wallOptions" style="display:none;">
          <label for="wallPerPage">Cards per page</label>
          <select id="wallPerPage">
            <option value="1">1 (full page)</option>
            <option value="2" selected>2</option>
            <option value="4">4</option>
          </select>
          <div class="row2">
            <label style="display:flex;align-items:center;gap:.4rem;font-weight:600;font-size:.85rem;">
              <input type="checkbox" id="wallShowDef" style="width:auto;margin:0;" checked> Show definition
            </label>
          </div>
        </div>

        <button type="button" id="printBtn">Print</button>
      </div>
    </div>

    <div class="preview-wrap">
      <p class="preview-note" id="previewNote">Live preview.</p>
      <div id="printNote" class="print-note" style="display:none;"></div>
      <div class="sheet-view" id="sheetView"></div>
      <div id="previewArea"></div>
    </div>
  </div>

  <footer class="note">
    Runs entirely in your browser &mdash; nothing is uploaded.
  </footer>

</div>

<div id="printArea" style="display:none;"></div>

<script>
(function () {
  'use strict';

  var els = {};
  ['toolbar','listSwitch','newListBtn','deleteListBtn','listName','wordInput',
   'flashOptions','wallOptions','flashCols','flashRows','wallPerPage','wallShowDef',
   'printBtn','previewArea','previewNote','printNote','sheetView'
  ].forEach(function (id) { els[id] = document.getElementById(id); });

  var state = null; // { name, words: "raw textarea text", mode, flashCols, flashRows, wallPerPage, wallShowDef }
  var currentPreviewIndex = 0;
  var currentPreviewSide = 'front';

  function escapeHtml(s) {
    return String(s || '').replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }

  function save() { if (state) VocabStore.saveSet(state.name, state); }

  function refreshSwitcher() {
    var names = VocabStore.listSets();
    els.listSwitch.innerHTML = '';
    names.forEach(function (n) {
      var opt = document.createElement('option');
      opt.value = n; opt.textContent = n;
      if (state && n === state.name) opt.selected = true;
      els.listSwitch.appendChild(opt);
    });
  }

  function readFormIntoState() {
    state.words = els.wordInput.value;
    state.flashCols = Math.max(1, parseInt(els.flashCols.value, 10) || 2);
    state.flashRows = Math.max(1, parseInt(els.flashRows.value, 10) || 4);
    state.wallPerPage = parseInt(els.wallPerPage.value, 10) || 2;
    state.wallShowDef = els.wallShowDef.checked;
  }

  function flashCardHtml(item) {
    if (!item) return '<div class="flash-card blank"></div>';
    return '<div class="flash-card"><div class="term">' + escapeHtml(item.term) + '</div></div>';
  }
  function defCardHtml(item) {
    if (!item) return '<div class="flash-card blank"></div>';
    return '<div class="flash-card"><div class="def">' + escapeHtml(item.definition) + '</div></div>';
  }

  function buildFlashPages(items) {
    var cols = state.flashCols, rows = state.flashRows, perPage = cols * rows;
    var pages = VocabLayout.paginate(items, perPage);
    var fronts = [], backs = [];
    pages.forEach(function (page) {
      var padded = page.slice();
      while (padded.length < perPage) padded.push(null);
      var mirrored = VocabLayout.mirrorPageRows(padded, cols);
      fronts.push(
        '<div class="page"><div class="grid" style="grid-template-columns:repeat(' + cols + ',1fr);grid-template-rows:repeat(' + rows + ',1fr);">' +
          padded.map(flashCardHtml).join('') + '</div></div>'
      );
      backs.push(
        '<div class="page"><div class="grid" style="grid-template-columns:repeat(' + cols + ',1fr);grid-template-rows:repeat(' + rows + ',1fr);">' +
          mirrored.map(defCardHtml).join('') + '</div></div>'
      );
    });
    return { fronts: fronts, backs: backs, pageCount: pages.length };
  }

  function wallCardHtml(item) {
    if (!item) return '<div class="wordwall-card"></div>';
    return '<div class="wordwall-card"><div class="term">' + escapeHtml(item.term) + '</div>' +
      (state.wallShowDef && item.definition ? '<div class="def">' + escapeHtml(item.definition) + '</div>' : '') + '</div>';
  }

  function buildWallPages(items) {
    var perPage = state.wallPerPage;
    var pages = VocabLayout.paginate(items, perPage);
    var cols = perPage === 1 ? 1 : (perPage === 2 ? 1 : 2);
    var rows = perPage === 1 ? 1 : (perPage === 2 ? 2 : 2);
    return pages.map(function (page) {
      var padded = page.slice();
      while (padded.length < perPage) padded.push(null);
      return '<div class="page"><div class="grid" style="grid-template-columns:repeat(' + cols + ',1fr);grid-template-rows:repeat(' + rows + ',1fr);min-height:9.5in;">' +
        padded.map(wallCardHtml).join('') + '</div></div>';
    });
  }

  function renderPreview() {
    readFormIntoState();
    save();
    refreshSwitcher();

    var items = VocabLayout.parseWordList(state.words);
    els.sheetView.innerHTML = '';

    if (!items.length) {
      els.previewArea.innerHTML = '<p style="text-align:center;color:var(--muted);padding:3rem;">Add some words to preview.</p>';
      els.previewNote.textContent = 'No words yet.';
      els.printNote.style.display = 'none';
      return;
    }

    if (state.mode === 'flashcards') {
      var built = buildFlashPages(items);
      els.printNote.style.display = '';
      els.printNote.textContent = 'Printing produces all FRONT pages first, then all BACK (definition) pages, ' +
        'each row mirrored to line up if you flip the front stack over (long edge) and run it back through the printer.';
      currentPreviewIndex = Math.min(currentPreviewIndex, built.pageCount - 1);
      for (var p = 0; p < built.pageCount; p++) {
        (function (idx) {
          var b = document.createElement('button');
          b.type = 'button'; b.className = 'secondary';
          b.textContent = 'Page ' + (idx + 1);
          b.addEventListener('click', function () { currentPreviewIndex = idx; renderPreview(); });
          els.sheetView.appendChild(b);
        })(p);
      }
      var sideFront = document.createElement('button');
      sideFront.type = 'button'; sideFront.className = 'secondary';
      sideFront.textContent = currentPreviewSide === 'front' ? '[Front]' : 'Front';
      sideFront.addEventListener('click', function () { currentPreviewSide = 'front'; renderPreview(); });
      var sideBack = document.createElement('button');
      sideBack.type = 'button'; sideBack.className = 'secondary';
      sideBack.textContent = currentPreviewSide === 'back' ? '[Back]' : 'Back';
      sideBack.addEventListener('click', function () { currentPreviewSide = 'back'; renderPreview(); });
      els.sheetView.appendChild(sideFront);
      els.sheetView.appendChild(sideBack);

      els.previewArea.innerHTML = (currentPreviewSide === 'front' ? built.fronts[currentPreviewIndex] : built.backs[currentPreviewIndex]) || '';
      els.previewNote.textContent = items.length + ' words, ' + built.pageCount + ' page(s) per side.';
    } else {
      els.printNote.style.display = 'none';
      var wallPages = buildWallPages(items);
      currentPreviewIndex = Math.min(currentPreviewIndex, wallPages.length - 1);
      wallPages.forEach(function (_, idx) {
        var b = document.createElement('button');
        b.type = 'button'; b.className = 'secondary';
        b.textContent = 'Page ' + (idx + 1);
        b.addEventListener('click', function () { currentPreviewIndex = idx; renderPreview(); });
        els.sheetView.appendChild(b);
      });
      els.previewArea.innerHTML = wallPages[currentPreviewIndex] || '';
      els.previewNote.textContent = items.length + ' words, ' + wallPages.length + ' page(s), single-sided.';
    }
  }

  function buildPrintArea() {
    var items = VocabLayout.parseWordList(state.words);
    var html;
    if (state.mode === 'flashcards') {
      var built = buildFlashPages(items);
      html = built.fronts.join('') + built.backs.join('');
    } else {
      html = buildWallPages(items).join('');
    }
    document.getElementById('printArea').innerHTML = html;
  }

  /* ---------- lifecycle ---------- */
  function newList(name) {
    state = { name: name, words: '', mode: 'flashcards', flashCols: 2, flashRows: 4, wallPerPage: 2, wallShowDef: true };
    VocabStore.setCurrentName(name);
    applyStateToForm();
    refreshSwitcher();
    els.toolbar.style.display = '';
    renderPreview();
  }

  function loadListByName(name) {
    var loaded = VocabStore.loadSet(name);
    if (!loaded) return;
    state = loaded;
    VocabStore.setCurrentName(name);
    applyStateToForm();
    refreshSwitcher();
    renderPreview();
  }

  function applyStateToForm() {
    els.listName.value = state.name;
    els.wordInput.value = state.words;
    els.flashCols.value = state.flashCols;
    els.flashRows.value = state.flashRows;
    els.wallPerPage.value = state.wallPerPage;
    els.wallShowDef.checked = state.wallShowDef;
    document.querySelectorAll('.mode-tab').forEach(function (t) { t.classList.toggle('active', t.dataset.mode === state.mode); });
    els.flashOptions.style.display = state.mode === 'flashcards' ? '' : 'none';
    els.wallOptions.style.display = state.mode === 'wordwall' ? '' : 'none';
  }

  /* ---------- wiring ---------- */
  els.listName.addEventListener('change', function () {
    if (!state) return;
    var oldName = state.name;
    var newName = els.listName.value.trim() || oldName;
    if (newName !== oldName) { VocabStore.deleteSet(oldName); state.name = newName; }
    renderPreview(); refreshSwitcher();
  });

  els.wordInput.addEventListener('input', renderPreview);
  els.flashCols.addEventListener('input', renderPreview);
  els.flashRows.addEventListener('input', renderPreview);
  els.wallPerPage.addEventListener('change', renderPreview);
  els.wallShowDef.addEventListener('change', renderPreview);

  document.querySelectorAll('.mode-tab').forEach(function (tab) {
    tab.addEventListener('click', function () {
      document.querySelectorAll('.mode-tab').forEach(function (t) { t.classList.remove('active'); });
      tab.classList.add('active');
      state.mode = tab.dataset.mode;
      els.flashOptions.style.display = state.mode === 'flashcards' ? '' : 'none';
      els.wallOptions.style.display = state.mode === 'wordwall' ? '' : 'none';
      currentPreviewIndex = 0;
      renderPreview();
    });
  });

  els.listSwitch.addEventListener('change', function () { loadListByName(els.listSwitch.value); });
  els.newListBtn.addEventListener('click', function () {
    var name = prompt('Name for the new list:', 'New List');
    if (!name) return;
    newList(name.trim());
  });
  els.deleteListBtn.addEventListener('click', function () {
    if (!state) return;
    if (!confirm('Delete "' + state.name + '" completely? This can’t be undone.')) return;
    VocabStore.deleteSet(state.name);
    var remaining = VocabStore.listSets();
    if (remaining.length) loadListByName(remaining[0]);
    else newList('New List');
  });

  els.printBtn.addEventListener('click', function () {
    buildPrintArea();
    window.print();
  });

  /* ---------- boot ---------- */
  var current = VocabStore.getCurrentName();
  if (current && VocabStore.loadSet(current)) {
    loadListByName(current);
  } else {
    newList('New List');
  }
})();
</script>
</body>
</html>
