<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Story Elements / Plot Diagram Builder</title>
<meta name="description" content="Build a plot-mountain diagram (exposition through resolution) for a novel or story with your own class, then print or project it as a shared reference.">

<meta property="og:site_name" content="AsPerMyLessonPlan.com">
<meta property="og:url" content="https://www.aspermylessonplan.com/Tools/plot-diagram-builder.html">
<meta property="og:title" content="Story Elements / Plot Diagram Builder — AsPerMyLessonPlan.com">
<meta property="og:description" content="Build a plot-mountain diagram (exposition through resolution) for a novel or story with your own class, then print or project it as a shared reference.">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="Story Elements / Plot Diagram Builder — AsPerMyLessonPlan.com">
<meta name="twitter:description" content="Build a plot-mountain diagram (exposition through resolution) for a novel or story with your own class, then print or project it as a shared reference.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%23F6F7F9'/%3E%3Cpath d='M4 24l8-14 4 6 4-10 8 18z' fill='none' stroke='%231f3550' stroke-width='2' stroke-linejoin='round'/%3E%3C/svg%3E">
<style>
  :root {
    --ink: #1f2430; --paper: #fafaf8; --card: #fff;
    --line: #dcdad2; --line-strong: #c3c0b6;
    --accent: #1f3550; --accent-2: #2e6b8f; --muted: #6b6a63; --err: #a3372b;
  }
  * { box-sizing: border-box; }
  body {
    font-family: "Segoe UI", Georgia, "Times New Roman", serif;
    background: var(--paper); color: var(--ink); margin: 0;
    padding: 24px 20px 100px; line-height: 1.45;
  }
  .wrap { max-width: 1200px; margin: 0 auto; }
  .app-header { display: flex; align-items: baseline; justify-content: space-between; gap: 1rem; flex-wrap: wrap; margin-bottom: 1.4rem; }
  .app-header h1 { font-size: 1.7rem; margin: 0 0 .2rem; }
  .app-header .sub { color: var(--muted); font-size: .88rem; margin: 0; }
  .back-link { color: var(--muted); text-decoration: none; font-size: .88rem; }
  .back-link:hover { color: var(--accent-2); }

  .card { background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 1.1rem 1.2rem; margin-bottom: 1rem; }
  .card h2 { font-size: 1rem; margin: 0 0 .7rem; }
  label { display: block; font-weight: 600; font-size: .82rem; margin-bottom: .3rem; }
  input[type="text"], textarea {
    width: 100%; font-family: inherit; font-size: .9rem; color: var(--ink);
    background: #fff; border: 1px solid var(--line-strong); border-radius: 6px;
    padding: .45rem .55rem; margin-bottom: .6rem;
  }
  textarea { resize: vertical; min-height: 3.5rem; }
  .info-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 0 1rem; }
  .elements-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 0 1rem; }

  button {
    font-family: inherit; font-size: .92rem; font-weight: 600; cursor: pointer;
    background: var(--accent); color: #fff; border: 1px solid var(--accent);
    border-radius: 7px; padding: .55rem 1rem;
  }
  button.secondary { background: #fff; color: var(--ink); border-color: var(--line-strong); }
  button.secondary:hover { background: #f1f0ea; border-color: var(--muted); color: var(--ink); }

  .mountain-wrap { position: relative; height: 380px; margin: 1rem 0 2rem; }
  .mountain-svg { position: absolute; top: 0; left: 0; width: 100%; height: 100%; }
  .stage-box { position: absolute; width: 180px; }
  .stage-box .stage-label { font-weight: 700; font-size: .82rem; color: var(--accent); margin-bottom: .2rem; text-align: center; }
  .stage-box textarea { min-height: 4.5rem; font-size: .8rem; }

  #printArea { display: none; }
  @media print {
    body * { visibility: hidden; }
    #printArea, #printArea * { visibility: visible; }
    #printArea { display: block; position: absolute; top: 0; left: 0; width: 100%; padding: 0; margin: 0; }
  }
  .print-title { font-size: 1.5rem; margin: 0 0 .1rem; text-align: center; }
  .print-author { text-align: center; color: #555; margin: 0 0 1rem; }
  .print-elements { display: grid; grid-template-columns: 1fr 1fr; gap: .3rem 1.5rem; font-size: .88rem; margin-bottom: 1.2rem; }
  .print-elements b { color: var(--accent); }
  .print-mountain-wrap { position: relative; height: 340px; margin-top: .5rem; }
  .print-stage-box { position: absolute; width: 200px; font-size: .82rem; }
  .print-stage-box .stage-label { font-weight: 700; color: var(--accent); }
</style>
</head>
<body>
<div class="wrap">
  <div class="app-header">
    <div>
      <a class="back-link" href="../index.html">&larr; Toolkit</a>
      <h1>Story Elements / Plot Diagram Builder</h1>
      <p class="sub">Build a plot-mountain diagram and story elements summary, then print or project it.</p>
    </div>
    <div>
      <button class="secondary" id="printBtn">Print diagram</button>
    </div>
  </div>

  <div class="card">
    <div class="info-grid">
      <div><label for="storyTitle">Story title</label><input type="text" id="storyTitle"></div>
      <div><label for="storyAuthor">Author</label><input type="text" id="storyAuthor"></div>
    </div>
  </div>

  <div class="card">
    <h2>Story elements</h2>
    <div class="elements-grid">
      <div><label for="elChar">Characters</label><textarea id="elChar" placeholder="Main character(s) and who they are"></textarea></div>
      <div><label for="elSetting">Setting</label><textarea id="elSetting" placeholder="Where and when the story takes place"></textarea></div>
      <div><label for="elConflict">Conflict</label><textarea id="elConflict" placeholder="The main problem the character faces"></textarea></div>
      <div><label for="elTheme">Theme</label><textarea id="elTheme" placeholder="The bigger idea or lesson of the story"></textarea></div>
    </div>
  </div>

  <div class="card">
    <h2>Plot mountain</h2>
    <div class="mountain-wrap">
      <svg class="mountain-svg" viewBox="0 0 1000 380" preserveAspectRatio="none">
        <polyline points="20,340 260,340 500,40 740,340 980,340" fill="none" stroke="#1f3550" stroke-width="4" stroke-linejoin="round"/>
      </svg>
      <div class="stage-box" style="left:0%;top:82%;">
        <div class="stage-label">Exposition</div>
        <textarea data-stage="exposition" placeholder="Characters, setting, and situation introduced"></textarea>
      </div>
      <div class="stage-box" style="left:12%;top:38%;">
        <div class="stage-label">Rising Action</div>
        <textarea data-stage="rising" placeholder="Events build tension toward the climax"></textarea>
      </div>
      <div class="stage-box" style="left:41%;top:2%;">
        <div class="stage-label">Climax</div>
        <textarea data-stage="climax" placeholder="The turning point of the story"></textarea>
      </div>
      <div class="stage-box" style="left:68%;top:38%;">
        <div class="stage-label">Falling Action</div>
        <textarea data-stage="falling" placeholder="Events after the climax start to resolve"></textarea>
      </div>
      <div class="stage-box" style="left:80%;top:82%;">
        <div class="stage-label">Resolution</div>
        <textarea data-stage="resolution" placeholder="How the story wraps up"></textarea>
      </div>
    </div>
  </div>
</div>

<div id="printArea"></div>

<script>
(function () {
  'use strict';
  var STORE_KEY = 'pdb_diagram_v1';

  var els = {};
  ['storyTitle', 'storyAuthor', 'elChar', 'elSetting', 'elConflict', 'elTheme', 'printBtn', 'printArea'].forEach(function (id) {
    els[id] = document.getElementById(id);
  });
  var stageEls = document.querySelectorAll('[data-stage]');

  var state = { title: '', author: '', characters: '', setting: '', conflict: '', theme: '', stages: {} };

  function load() {
    try {
      var saved = JSON.parse(localStorage.getItem(STORE_KEY) || 'null');
      if (saved && typeof saved === 'object') state = saved;
    } catch (e) { /* ignore */ }
    if (!state.stages) state.stages = {};
  }
  function save() {
    try { localStorage.setItem(STORE_KEY, JSON.stringify(state)); } catch (e) { /* storage full/blocked */ }
  }

  function escapeHtml(s) {
    return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }

  els.storyTitle.addEventListener('input', function () { state.title = els.storyTitle.value; save(); });
  els.storyAuthor.addEventListener('input', function () { state.author = els.storyAuthor.value; save(); });
  els.elChar.addEventListener('input', function () { state.characters = els.elChar.value; save(); });
  els.elSetting.addEventListener('input', function () { state.setting = els.elSetting.value; save(); });
  els.elConflict.addEventListener('input', function () { state.conflict = els.elConflict.value; save(); });
  els.elTheme.addEventListener('input', function () { state.theme = els.elTheme.value; save(); });

  stageEls.forEach(function (ta) {
    ta.addEventListener('input', function () {
      state.stages[ta.getAttribute('data-stage')] = ta.value;
      save();
    });
  });

  var STAGE_LABELS = { exposition: 'Exposition', rising: 'Rising Action', climax: 'Climax', falling: 'Falling Action', resolution: 'Resolution' };
  var STAGE_POS = { exposition: { left: '0%', top: '82%' }, rising: { left: '12%', top: '38%' }, climax: { left: '41%', top: '2%' }, falling: { left: '68%', top: '38%' }, resolution: { left: '80%', top: '82%' } };

  els.printBtn.addEventListener('click', function () {
    var title = state.title.trim() || 'Plot Diagram';
    var author = state.author.trim() ? 'by ' + escapeHtml(state.author.trim()) : '';
    var elementsHtml = '<div class="print-elements">' +
      '<div><b>Characters:</b> ' + escapeHtml(state.characters || '&mdash;') + '</div>' +
      '<div><b>Setting:</b> ' + escapeHtml(state.setting || '&mdash;') + '</div>' +
      '<div><b>Conflict:</b> ' + escapeHtml(state.conflict || '&mdash;') + '</div>' +
      '<div><b>Theme:</b> ' + escapeHtml(state.theme || '&mdash;') + '</div>' +
      '</div>';
    var stagesHtml = Object.keys(STAGE_LABELS).map(function (key) {
      var pos = STAGE_POS[key];
      return '<div class="print-stage-box" style="left:' + pos.left + ';top:' + pos.top + ';">' +
        '<div class="stage-label">' + STAGE_LABELS[key] + '</div><div>' + escapeHtml(state.stages[key] || '&mdash;') + '</div></div>';
    }).join('');
    els.printArea.innerHTML = '<h1 class="print-title">' + escapeHtml(title) + '</h1>' +
      (author ? '<p class="print-author">' + author + '</p>' : '') +
      elementsHtml +
      '<div class="print-mountain-wrap"><svg style="position:absolute;top:0;left:0;width:100%;height:100%;" viewBox="0 0 1000 340" preserveAspectRatio="none">' +
      '<polyline points="20,300 260,300 500,20 740,300 980,300" fill="none" stroke="#1f3550" stroke-width="4" stroke-linejoin="round"/></svg>' +
      stagesHtml + '</div>';
    window.print();
  });

  /* ---------- boot ---------- */
  load();
  els.storyTitle.value = state.title;
  els.storyAuthor.value = state.author;
  els.elChar.value = state.characters;
  els.elSetting.value = state.setting;
  els.elConflict.value = state.conflict;
  els.elTheme.value = state.theme;
  stageEls.forEach(function (ta) { ta.value = state.stages[ta.getAttribute('data-stage')] || ''; });
})();
</script>
<script>
if ('serviceWorker' in navigator) {
  window.addEventListener('load', function () {
    navigator.serviceWorker.register('../sw.js').catch(function () {});
  });
}
</script>
</body>
</html>
