<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">

<title>Art Critique Worksheet Generator</title>
<meta name="description" content="A structured describe/analyze/interpret/judge critique worksheet for student artwork or a gallery walk, with editable prompts per step and a printable half-sheet per student.">

<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%23F6F7F9'/%3E%3Ccircle cx='16' cy='16' r='9' fill='none' stroke='%231f3550' stroke-width='2'/%3E%3Ccircle cx='16' cy='16' r='2.4' fill='%231f3550'/%3E%3C/svg%3E">
<script src="../_shared/a11y.js"></script>

<style>
  * { box-sizing: border-box; }
  body {
    font-family: "Segoe UI", Georgia, "Times New Roman", serif;
    background: var(--paper); color: var(--ink); margin: 0;
    padding: 24px 20px 100px; line-height: 1.45;
  }
  .wrap { max-width: 1200px; margin: 0 auto; }
  .app-header { display: flex; align-items: baseline; justify-content: space-between; gap: 1rem; flex-wrap: wrap; margin-bottom: 1.4rem; }
  .app-header h1 { font-size: 1.7rem; margin: 0 0 .2rem; }
  .app-header .sub { color: var(--muted); font-size: .88rem; margin: 0; }
  .back-link { color: var(--muted); text-decoration: none; font-size: .88rem; }
  .back-link:hover { color: var(--accent-2); }

  .card { background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 1.1rem 1.2rem; margin-bottom: 1rem; }
  .card h2 { font-size: 1rem; margin: 0 0 .7rem; }
  label { display: block; font-weight: 600; font-size: .82rem; margin-bottom: .3rem; }
  .hint { color: var(--muted); font-size: .78rem; margin: -.15rem 0 .6rem; }
  input[type="text"], input[type="number"], textarea {
    width: 100%; font-family: inherit; font-size: .9rem; color: var(--ink);
    background: #fff; border: 1px solid var(--line-strong); border-radius: 6px;
    padding: .45rem .55rem; margin-bottom: .6rem;
  }
  textarea { resize: vertical; min-height: 2.4rem; }

  button {
    font-family: inherit; font-size: .92rem; font-weight: 600; cursor: pointer;
    background: var(--accent); color: #fff; border: 1px solid var(--accent);
    border-radius: 7px; padding: .55rem 1rem;
  }
  button:hover { background: var(--accent-2); border-color: var(--accent-2); }
  button.secondary { background: #fff; color: var(--ink); border-color: var(--line-strong); }
  button.secondary:hover { background: #f1f0ea; border-color: var(--muted); color: var(--ink); }
  button.danger { background: #fff; color: var(--err); border-color: var(--err); }
  button.danger:hover { background: var(--err); color: #fff; }
  button.small { padding: .2rem .5rem; font-size: .76rem; }
  .btnrow { display: flex; gap: .5rem; flex-wrap: wrap; }

  .info-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 0 1rem; }

  .step-block { border: 1px solid var(--line); border-radius: 8px; padding: .9rem 1rem; margin-bottom: .9rem; }
  .step-block h3 { font-size: 1.05rem; margin: 0 0 .1rem; color: var(--accent); }
  .step-block .step-num { display: inline-block; width: 1.4rem; height: 1.4rem; border-radius: 50%; background: var(--accent); color: #fff; text-align: center; line-height: 1.4rem; font-size: .8rem; margin-right: .4rem; }
  .sub-row { display: flex; align-items: center; gap: .5rem; padding: .2rem 0; }
  .sub-row input { margin-bottom: 0; }

  #printArea { display: none; }
  .half-sheet { border: 1px dashed var(--line-strong); border-radius: 8px; padding: 1rem 1.2rem; margin-bottom: 1rem; }
  .half-sheet h2 { margin: 0 0 .1rem; font-size: 1.2rem; }
  .half-sheet .names { font-size: .82rem; color: var(--muted); margin-bottom: .6rem; }
  .half-sheet .hs-step { margin-bottom: .5rem; }
  .half-sheet .hs-step h4 { margin: 0 0 .1rem; font-size: .9rem; color: var(--accent-2); }
  .half-sheet .hs-step .prompt { font-size: .84rem; margin: 0 0 .15rem; }
  .half-sheet .hs-line { border-bottom: 1px solid var(--line-strong); display: block; height: 1rem; }

  @media print {
    body * { visibility: hidden; }
    #printArea, #printArea * { visibility: visible; }
    #printArea { display: block; position: absolute; top: 0; left: 0; width: 100%; padding: 0; margin: 0; }
    .half-sheet { border: none; min-height: 47vh; page-break-inside: avoid; border-bottom: 1px dashed #999; }
    .half-sheet:nth-child(2n) { page-break-after: always; border-bottom: none; }
  }
</style>
</head>
<body>
<div class="wrap">
  <div class="app-header">
    <div>
      <a class="back-link" href="../index.html">&larr; Toolkit</a>
      <h1>Art Critique Worksheet Generator</h1>
      <p class="sub">A describe &rarr; analyze &rarr; interpret &rarr; judge critique worksheet for artwork or a gallery walk.</p>
    </div>
    <div class="btnrow">
      <button class="secondary" id="printBtn">Print worksheets</button>
    </div>
  </div>

  <div class="card">
    <div class="info-grid">
      <div>
        <label for="worksheetSwitch">Saved worksheet</label>
        <select id="worksheetSwitch"></select>
      </div>
      <div>
        <label for="worksheetName">Worksheet name (for saving/switching)</label>
        <input type="text" id="worksheetName" placeholder="e.g. Sculpture Unit Critique">
      </div>
    </div>
    <div class="btnrow" style="margin-bottom:.6rem;">
      <button type="button" class="secondary small" id="newWorksheetBtn">+ New worksheet</button>
      <button type="button" class="secondary small" id="duplicateWorksheetBtn">Duplicate</button>
      <button type="button" class="danger small" id="deleteWorksheetBtn">Delete</button>
    </div>
    <div class="info-grid">
      <div>
        <label for="activityName">Activity / gallery walk name</label>
        <input type="text" id="activityName" placeholder="e.g. Self-Portrait Gallery Walk">
      </div>
      <div>
        <label for="copyCount">How many copies to print</label>
        <input type="number" id="copyCount" value="10" min="1" max="60">
      </div>
    </div>
  </div>

  <div id="stepsWrap"></div>
</div>

<div id="printArea"></div>

<script>
(function () {
  'use strict';
  var LEGACY_KEY = 'acw_worksheet_v1';
  var LIST_KEY = 'acw_worksheets_list_v1';
  var DATA_PREFIX = 'acw_worksheet_data_v1:';
  var CURRENT_KEY = 'acw_worksheet_current_v1';

  var DEFAULT_STEPS = [
    { key: 'describe', label: 'Describe', prompt: 'What do you see? List the colors, shapes, materials, and subject matter.',
      subs: ['What is the medium (paint, sculpture, photography, etc.)?', 'What objects or subjects are shown?'] },
    { key: 'analyze', label: 'Analyze', prompt: 'How is the artwork organized? Think about composition, balance, and use of color, line, or texture.',
      subs: ['Where does your eye go first, and why?', 'How does the artist use color or contrast?'] },
    { key: 'interpret', label: 'Interpret', prompt: 'What do you think the artist is trying to say or make you feel?',
      subs: ['What mood or emotion does this piece create?', 'What might the title or subject suggest about its meaning?'] },
    { key: 'judge', label: 'Judge', prompt: 'Do you think this artwork is successful? Why or why not?',
      subs: ['What is the strongest part of this piece?', 'What is one suggestion you would give the artist?'] }
  ];

  var els = {};
  ['activityName', 'copyCount', 'stepsWrap', 'printBtn', 'printArea',
   'worksheetSwitch', 'worksheetName', 'newWorksheetBtn', 'duplicateWorksheetBtn', 'deleteWorksheetBtn'
  ].forEach(function (id) { els[id] = document.getElementById(id); });

  var state = { name: 'New Worksheet', activityName: '', copyCount: 10, steps: [] };

  function uid() { return 's' + Date.now().toString(36) + Math.random().toString(36).slice(2, 6); }
  function escapeHtml(s) {
    return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }
  function escapeAttr(s) { return String(s == null ? '' : s).replace(/"/g, '&quot;'); }

  function defaultSteps() {
    return DEFAULT_STEPS.map(function (s) {
      return { key: s.key, label: s.label, prompt: s.prompt, subs: s.subs.map(function (t) { return { id: uid(), text: t }; }) };
    });
  }

  /* ---------- named-worksheet store ---------- */
  function listNames() {
    try { return JSON.parse(localStorage.getItem(LIST_KEY) || '[]'); } catch (e) { return []; }
  }
  function saveNamed(name, data) {
    var names = listNames();
    if (names.indexOf(name) === -1) { names.push(name); localStorage.setItem(LIST_KEY, JSON.stringify(names)); }
    localStorage.setItem(DATA_PREFIX + name, JSON.stringify(data));
    localStorage.setItem(CURRENT_KEY, name);
  }
  function loadNamed(name) {
    try { return JSON.parse(localStorage.getItem(DATA_PREFIX + name) || 'null'); } catch (e) { return null; }
  }
  function deleteNamed(name) {
    var names = listNames().filter(function (n) { return n !== name; });
    localStorage.setItem(LIST_KEY, JSON.stringify(names));
    localStorage.removeItem(DATA_PREFIX + name);
    if (localStorage.getItem(CURRENT_KEY) === name) localStorage.removeItem(CURRENT_KEY);
  }
  function uniqueName(base) {
    var names = listNames();
    if (names.indexOf(base) === -1) return base;
    var i = 2;
    while (names.indexOf(base + ' (' + i + ')') !== -1) i++;
    return base + ' (' + i + ')';
  }

  function migrateLegacyIfNeeded() {
    if (listNames().length) return;
    var legacy = null;
    try { legacy = JSON.parse(localStorage.getItem(LEGACY_KEY) || 'null'); } catch (e) { /* ignore */ }
    if (legacy && Array.isArray(legacy.steps) && legacy.steps.length) {
      legacy.name = legacy.activityName ? legacy.activityName : 'My Worksheet';
      saveNamed(legacy.name, legacy);
    }
  }

  function load() {
    migrateLegacyIfNeeded();
    var currentName = localStorage.getItem(CURRENT_KEY);
    var loaded = currentName ? loadNamed(currentName) : null;
    if (!loaded) {
      var names = listNames();
      loaded = names.length ? loadNamed(names[0]) : null;
    }
    if (loaded && Array.isArray(loaded.steps) && loaded.steps.length) {
      state = loaded;
      if (!state.name) state.name = 'My Worksheet';
    } else {
      state = { name: uniqueName('New Worksheet'), activityName: '', copyCount: 10, steps: [] };
    }
    if (!state.steps.length) state.steps = defaultSteps();
    save();
  }
  function save() {
    try { saveNamed(state.name, state); } catch (e) { /* storage full/blocked */ }
  }

  function renderWorksheetSwitch() {
    var names = listNames();
    els.worksheetSwitch.innerHTML = names.map(function (n) {
      return '<option value="' + escapeAttr(n) + '"' + (n === state.name ? ' selected' : '') + '>' + escapeHtml(n) + '</option>';
    }).join('');
  }

  function switchTo(name) {
    var loaded = loadNamed(name);
    if (!loaded) return;
    state = loaded;
    if (!state.steps.length) state.steps = defaultSteps();
    localStorage.setItem(CURRENT_KEY, name);
    renderAll();
  }

  function renderAll() {
    els.worksheetName.value = state.name;
    els.activityName.value = state.activityName;
    els.copyCount.value = state.copyCount;
    renderWorksheetSwitch();
    renderSteps();
  }

  function renderSteps() {
    els.stepsWrap.innerHTML = state.steps.map(function (step, i) {
      var subs = step.subs.map(function (sub) {
        return '<div class="sub-row" data-step="' + step.key + '"><input type="text" data-sub="' + sub.id + '" value="' + escapeAttr(sub.text) + '">' +
          '<button type="button" class="danger small" data-del-sub="' + sub.id + '" data-del-step="' + step.key + '">&times;</button></div>';
      }).join('');
      return '<div class="card step-block" data-step-key="' + step.key + '">' +
        '<h3><span class="step-num">' + (i + 1) + '</span>' + escapeHtml(step.label) + '</h3>' +
        '<label>Main prompt</label>' +
        '<textarea data-prompt="' + step.key + '">' + escapeHtml(step.prompt) + '</textarea>' +
        '<label>Follow-up questions</label>' + subs +
        '<button type="button" class="secondary small" data-add-sub="' + step.key + '">+ Add follow-up question</button>' +
        '</div>';
    }).join('');
  }

  function findStep(key) { return state.steps.find(function (s) { return s.key === key; }); }

  els.stepsWrap.addEventListener('input', function (ev) {
    var promptKey = ev.target.getAttribute('data-prompt');
    var subId = ev.target.getAttribute('data-sub');
    if (promptKey) {
      var step = findStep(promptKey);
      if (step) step.prompt = ev.target.value;
      save();
    } else if (subId) {
      var block = ev.target.closest('.step-block');
      var key = block.getAttribute('data-step-key');
      var step2 = findStep(key);
      var sub = step2 && step2.subs.find(function (s) { return s.id === subId; });
      if (sub) sub.text = ev.target.value;
      save();
    }
  });

  els.stepsWrap.addEventListener('click', function (ev) {
    var addKey = ev.target.getAttribute('data-add-sub');
    var delSubId = ev.target.getAttribute('data-del-sub');
    if (addKey) {
      var step = findStep(addKey);
      if (step) step.subs.push({ id: uid(), text: '' });
      save(); renderSteps();
    } else if (delSubId) {
      var delStepKey = ev.target.getAttribute('data-del-step');
      var step2 = findStep(delStepKey);
      if (step2) step2.subs = step2.subs.filter(function (s) { return s.id !== delSubId; });
      save(); renderSteps();
    }
  });

  els.activityName.addEventListener('input', function () { state.activityName = els.activityName.value; save(); });
  els.copyCount.addEventListener('input', function () { state.copyCount = parseInt(els.copyCount.value, 10) || 1; save(); });

  els.worksheetName.addEventListener('change', function () {
    var oldName = state.name;
    var newName = els.worksheetName.value.trim() || oldName;
    if (newName !== oldName) {
      deleteNamed(oldName);
      state.name = uniqueName(newName);
    }
    save();
    renderWorksheetSwitch();
    els.worksheetName.value = state.name;
  });

  els.worksheetSwitch.addEventListener('change', function () { switchTo(els.worksheetSwitch.value); });

  els.newWorksheetBtn.addEventListener('click', function () {
    var name = prompt('Name for the new worksheet:', 'New Worksheet');
    if (!name) return;
    state = { name: uniqueName(name.trim()), activityName: '', copyCount: 10, steps: defaultSteps() };
    save();
    renderAll();
  });

  els.duplicateWorksheetBtn.addEventListener('click', function () {
    var clone = JSON.parse(JSON.stringify(state));
    clone.name = uniqueName(state.name + ' (copy)');
    state = clone;
    save();
    renderAll();
  });

  els.deleteWorksheetBtn.addEventListener('click', function () {
    if (!confirm('Delete "' + state.name + '" completely? This can’t be undone.')) return;
    deleteNamed(state.name);
    var names = listNames();
    if (names.length) {
      switchTo(names[0]);
    } else {
      state = { name: 'New Worksheet', activityName: '', copyCount: 10, steps: defaultSteps() };
      save();
      renderAll();
    }
  });

  function halfSheetHtml() {
    var title = state.activityName.trim() ? escapeHtml(state.activityName.trim()) : 'Art Critique Worksheet';
    var steps = state.steps.map(function (step, i) {
      var subs = step.subs.filter(function (s) { return s.text.trim(); }).map(function (s) {
        return '<div style="font-size:.8rem;margin:.15rem 0 0 .8rem;">&bull; ' + escapeHtml(s.text) + '<span class="hs-line"></span></div>';
      }).join('');
      return '<div class="hs-step"><h4>' + (i + 1) + '. ' + escapeHtml(step.label) + '</h4>' +
        '<p class="prompt">' + escapeHtml(step.prompt) + '</p><span class="hs-line"></span>' + subs + '</div>';
    }).join('');
    return '<div class="half-sheet"><h2>' + title + '</h2>' +
      '<div class="names">Artwork title: _______________________ &nbsp; Reviewer: _______________________</div>' +
      steps + '</div>';
  }

  els.printBtn.addEventListener('click', function () {
    var count = Math.max(1, Math.min(60, state.copyCount || 10));
    var html = '';
    for (var i = 0; i < count; i++) html += halfSheetHtml();
    els.printArea.innerHTML = html;
    window.print();
  });

  /* ---------- boot ---------- */
  load();
  renderAll();
})();
</script>
<script src="../_shared/sw-register.js" defer></script>
</body>
</html>
