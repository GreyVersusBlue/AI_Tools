<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Lab Report Template Builder</title>
<meta name="description" content="Build a reusable lab report template — hypothesis, materials, procedure, data table, and conclusion prompts — from a topic starter or from scratch, and print a fillable packet for each lab.">
<meta property="og:type" content="website">
<meta property="og:site_name" content="AsPerMyLessonPlan.com">
<meta property="og:url" content="https://www.aspermylessonplan.com/Tools/065-lab-report-template-builder.html">
<meta property="og:title" content="Lab Report Template Builder — AsPerMyLessonPlan.com">
<meta property="og:description" content="Build a reusable lab report template — hypothesis, materials, procedure, data table, and conclusion prompts — from a topic starter or from scratch, and print a fillable packet for each lab.">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="Lab Report Template Builder — AsPerMyLessonPlan.com">
<meta name="twitter:description" content="Build a reusable lab report template — hypothesis, materials, procedure, data table, and conclusion prompts — from a topic starter or from scratch, and print a fillable packet for each lab.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%23F6F7F9'/%3E%3Cpath d='M13 5v8l-6 11a2 2 0 002 3h10a2 2 0 002-3l-6-11V5' fill='none' stroke='%231f3550' stroke-width='2' stroke-linejoin='round'/%3E%3Cpath d='M11 5h6' stroke='%231f3550' stroke-width='2'/%3E%3C/svg%3E">
<style>
  :root {
    --ink: #1f2430; --paper: #fafaf8; --card: #fff;
    --line: #dcdad2; --line-strong: #c3c0b6;
    --accent: #1f3550; --accent-2: #2e6b8f; --muted: #6b6a63; --err: #a3372b;
  }
  * { box-sizing: border-box; }
  body {
    font-family: "Segoe UI", Georgia, "Times New Roman", serif;
    background: var(--paper); color: var(--ink); margin: 0;
    padding: 24px 20px 100px; line-height: 1.45;
  }
  .wrap { max-width: 1280px; margin: 0 auto; }
  .app-header { display: flex; align-items: baseline; justify-content: space-between; gap: 1rem; flex-wrap: wrap; margin-bottom: 1.4rem; }
  .app-header h1 { font-size: 1.7rem; margin: 0 0 .2rem; }
  .app-header .sub { color: var(--muted); font-size: .88rem; margin: 0; }
  .back-link { color: var(--muted); text-decoration: none; font-size: .88rem; }
  .back-link:hover { color: var(--accent-2); }

  .layout { display: grid; grid-template-columns: minmax(300px, 380px) 1fr; gap: 1.4rem; align-items: start; }
  @media (max-width: 900px) { .layout { grid-template-columns: 1fr; } }

  .card { background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 1.1rem 1.2rem; margin-bottom: 1rem; }
  .card h2 { font-size: 1rem; margin: 0 0 .7rem; }
  label { display: block; font-weight: 600; font-size: .82rem; margin-bottom: .3rem; }
  .hint { color: var(--muted); font-size: .78rem; margin: -.15rem 0 .6rem; }
  input[type="text"], input[type="number"], select, textarea {
    width: 100%; font-family: inherit; font-size: .9rem; color: var(--ink);
    background: #fff; border: 1px solid var(--line-strong); border-radius: 6px;
    padding: .45rem .55rem; margin-bottom: .6rem;
  }
  textarea { resize: vertical; min-height: 2.4rem; }

  button {
    font-family: inherit; font-size: .92rem; font-weight: 600; cursor: pointer;
    background: var(--accent); color: #fff; border: 1px solid var(--accent);
    border-radius: 7px; padding: .55rem 1rem;
  }
  button:hover { background: var(--accent-2); border-color: var(--accent-2); }
  button.secondary { background: #fff; color: var(--ink); border-color: var(--line-strong); }
  button.secondary:hover { background: #f1f0ea; border-color: var(--muted); color: var(--ink); }
  button.danger { background: #fff; color: var(--err); border-color: var(--err); }
  button.danger:hover { background: var(--err); color: #fff; }
  button.small { padding: .2rem .5rem; font-size: .76rem; }
  button.full { width: 100%; }
  .btnrow { display: flex; gap: .5rem; flex-wrap: wrap; }

  .list-row { display: flex; align-items: center; gap: .5rem; padding: .25rem 0; }
  .list-row input[type="text"] { margin-bottom: 0; }
  section.builder { border: 1px solid var(--line); border-radius: 8px; padding: .8rem .9rem; margin-bottom: .8rem; }
  section.builder h3 { font-size: .95rem; margin: 0 0 .5rem; color: var(--accent); }
  .add-btn { margin-top: .2rem; }

  #printArea { display: none; }
  .lab-title { font-size: 1.4rem; margin: 0 0 .1rem; }
  .lab-sub { color: #555; font-size: .82rem; margin: 0 0 1rem; }
  .lab-section { margin-bottom: 1rem; }
  .lab-section h3 { font-size: 1rem; margin: 0 0 .3rem; border-bottom: 1.5px solid #333; padding-bottom: .15rem; }
  .fill-line { display: block; border-bottom: 1px solid #999; height: 1.3rem; margin: .2rem 0; }
  .checklist-item { font-size: .9rem; margin-bottom: .2rem; }
  .checkbox { display: inline-block; width: .8rem; height: .8rem; border: 1px solid #333; margin-right: .4rem; vertical-align: middle; }
  .step-item { font-size: .9rem; margin-bottom: .5rem; }
  table.data-table { width: 100%; border-collapse: collapse; margin-top: .4rem; }
  table.data-table th, table.data-table td { border: 1px solid #999; padding: .5rem .5rem; text-align: left; font-size: .86rem; }
  table.data-table th { background: #eee; }
  table.data-table td { height: 1.6rem; }

  @media print {
    body * { visibility: hidden; }
    #printArea, #printArea * { visibility: visible; }
    #printArea { display: block; position: absolute; top: 0; left: 0; width: 100%; padding: 0; margin: 0; }
  }
</style>
</head>
<body>
<div class="wrap">
  <div class="app-header">
    <div>
      <a class="back-link" href="../index.html">&larr; Toolkit</a>
      <h1>Lab Report Template Builder</h1>
      <p class="sub">Build a reusable lab report template, then print a fillable packet for each lab.</p>
    </div>
    <div class="btnrow">
      <button class="secondary" id="printBtn">Print packet</button>
    </div>
  </div>

  <div class="layout">
    <div>
      <div class="card">
        <h2>Start from a template</h2>
        <select id="templateSelect">
          <option value="generic">Generic Science Lab</option>
          <option value="chemistry">Chemistry Reaction Lab</option>
          <option value="biology">Biology Observation Lab</option>
          <option value="physics">Physics Measurement Lab</option>
        </select>
        <button class="secondary full" id="loadTemplateBtn">Load template (replaces current)</button>
      </div>
      <div class="card">
        <h2>Lab info</h2>
        <label for="labTitle">Lab title</label>
        <input type="text" id="labTitle" placeholder="e.g. Acid-Base Reactions">
        <label for="objective">Objective / purpose</label>
        <textarea id="objective" placeholder="What is this lab trying to find out?"></textarea>
      </div>
      <div class="card">
        <h2>Data table</h2>
        <label for="dataRows">Blank rows for data</label>
        <input type="number" id="dataRows" value="5" min="1" max="20">
        <label>Columns</label>
        <div id="columnsWrap"></div>
        <button class="secondary small add-btn" id="addColumnBtn">+ Add column</button>
      </div>
    </div>

    <div>
      <section class="builder">
        <h3>Hypothesis prompt</h3>
        <textarea id="hypothesisPrompt" placeholder="e.g. If ____, then ____, because ____."></textarea>
      </section>

      <section class="builder">
        <h3>Materials</h3>
        <div id="materialsWrap"></div>
        <button class="secondary small add-btn" id="addMaterialBtn">+ Add material</button>
      </section>

      <section class="builder">
        <h3>Procedure steps</h3>
        <div id="procedureWrap"></div>
        <button class="secondary small add-btn" id="addStepBtn">+ Add step</button>
      </section>

      <section class="builder">
        <h3>Observations prompt</h3>
        <textarea id="observationsPrompt" placeholder="What did you notice during the lab?"></textarea>
      </section>

      <section class="builder">
        <h3>Conclusion questions</h3>
        <div id="conclusionWrap"></div>
        <button class="secondary small add-btn" id="addQuestionBtn">+ Add question</button>
      </section>
    </div>
  </div>
</div>

<div id="printArea"></div>

<script>
(function () {
  'use strict';
  var STORE_KEY = 'lrt_template_v1';

  var TEMPLATES = {
    generic: {
      title: '', objective: '',
      hypothesisPrompt: 'If ____, then ____, because ____.',
      materials: ['Safety goggles', 'Lab notebook', 'Data table (below)'],
      procedure: ['Read through the entire procedure before starting.', 'Gather all materials listed above.', 'Follow each step in order and record data as you go.', 'Clean up your station when finished.'],
      columns: ['Trial', 'Observation'],
      observationsPrompt: 'What did you notice during the lab? Record anything unexpected.',
      conclusion: ['Was your hypothesis supported by the data? Explain.', 'What sources of error might have affected your results?', 'What would you do differently if you repeated this lab?']
    },
    chemistry: {
      title: '', objective: 'To observe and describe a chemical reaction and identify signs that a reaction occurred.',
      hypothesisPrompt: 'If ____ is combined with ____, then ____ will occur, because ____.',
      materials: ['Safety goggles', 'Gloves', 'Test tubes', 'Reactant A', 'Reactant B', 'Stopwatch'],
      procedure: ['Put on safety goggles and gloves.', 'Measure out the first reactant and record its appearance.', 'Add the second reactant and start the stopwatch.', 'Record any signs of a chemical reaction (color change, gas, temperature change, precipitate).', 'Record the time when the reaction appears to stop.'],
      columns: ['Trial', 'Sign of Reaction', 'Time (sec)'],
      observationsPrompt: 'Describe what you saw, smelled, or felt happen during the reaction.',
      conclusion: ['Was your hypothesis supported? Explain using your data.', 'What evidence showed that a chemical reaction took place?', 'What safety precautions were most important in this lab, and why?']
    },
    biology: {
      title: '', objective: 'To observe and record characteristics of a living organism or biological process.',
      hypothesisPrompt: 'If ____, then ____ will happen to the organism, because ____.',
      materials: ['Hand lens or microscope', 'Lab notebook', 'Specimen or sample', 'Ruler'],
      procedure: ['Set up your workspace and gather your specimen.', 'Observe the specimen closely and record its features.', 'Measure any relevant dimensions and record them in the data table.', 'Repeat observations at each checkpoint.', 'Return or dispose of the specimen as instructed.'],
      columns: ['Time / Checkpoint', 'Observation', 'Measurement'],
      observationsPrompt: 'Describe any changes you observed over the course of the lab.',
      conclusion: ['Was your hypothesis supported by what you observed? Explain.', 'What patterns did you notice in your data?', 'What could explain any unexpected results?']
    },
    physics: {
      title: '', objective: 'To measure a physical quantity and analyze how it changes under different conditions.',
      hypothesisPrompt: 'If ____ is increased, then ____ will ____, because ____.',
      materials: ['Meter stick or measuring tool', 'Stopwatch', 'Test object', 'Lab notebook'],
      procedure: ['Set up the measuring equipment as directed.', 'Perform the first trial and record the measurement.', 'Repeat for each additional trial, changing one variable at a time.', 'Calculate an average from your trials if instructed.'],
      columns: ['Trial', 'Variable Changed', 'Measurement'],
      observationsPrompt: 'Note anything that might have affected the accuracy of your measurements.',
      conclusion: ['Was your hypothesis supported by the data? Explain.', 'How did changing the variable affect your measurements?', 'What sources of measurement error were present in this lab?']
    }
  };

  var els = {};
  ['templateSelect', 'loadTemplateBtn', 'labTitle', 'objective', 'dataRows', 'columnsWrap', 'addColumnBtn',
   'hypothesisPrompt', 'materialsWrap', 'addMaterialBtn', 'procedureWrap', 'addStepBtn',
   'observationsPrompt', 'conclusionWrap', 'addQuestionBtn', 'printBtn', 'printArea'].forEach(function (id) {
    els[id] = document.getElementById(id);
  });

  var state = null;

  function uid() { return 'x' + Date.now().toString(36) + Math.random().toString(36).slice(2, 6); }
  function escapeHtml(s) {
    return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }
  function escapeAttr(s) { return String(s == null ? '' : s).replace(/"/g, '&quot;'); }

  function fromTemplate(key) {
    var t = TEMPLATES[key];
    state = {
      title: t.title, objective: t.objective, hypothesisPrompt: t.hypothesisPrompt,
      materials: t.materials.map(function (v) { return { id: uid(), text: v }; }),
      procedure: t.procedure.map(function (v) { return { id: uid(), text: v }; }),
      columns: t.columns.map(function (v) { return { id: uid(), text: v }; }),
      dataRows: 5,
      observationsPrompt: t.observationsPrompt,
      conclusion: t.conclusion.map(function (v) { return { id: uid(), text: v }; })
    };
  }

  function load() {
    try {
      var saved = JSON.parse(localStorage.getItem(STORE_KEY) || 'null');
      if (saved && Array.isArray(saved.materials)) state = saved;
    } catch (e) { /* ignore */ }
  }
  function save() {
    try { localStorage.setItem(STORE_KEY, JSON.stringify(state)); } catch (e) { /* storage full/blocked */ }
  }

  function renderList(wrapEl, list, placeholder) {
    wrapEl.innerHTML = list.map(function (item) {
      return '<div class="list-row" data-id="' + item.id + '">' +
        '<input type="text" value="' + escapeAttr(item.text) + '" placeholder="' + escapeAttr(placeholder) + '">' +
        '<button type="button" class="danger small" data-del="' + item.id + '">&times;</button>' +
        '</div>';
    }).join('');
  }

  function renderAll() {
    els.labTitle.value = state.title || '';
    els.objective.value = state.objective || '';
    els.hypothesisPrompt.value = state.hypothesisPrompt || '';
    els.observationsPrompt.value = state.observationsPrompt || '';
    els.dataRows.value = state.dataRows || 5;
    renderList(els.materialsWrap, state.materials, 'e.g. Safety goggles');
    renderList(els.procedureWrap, state.procedure, 'e.g. Measure the sample');
    renderList(els.columnsWrap, state.columns, 'e.g. Trial');
    renderList(els.conclusionWrap, state.conclusion, 'e.g. Was your hypothesis supported?');
  }

  function bindListEvents(wrapEl, listKey) {
    wrapEl.addEventListener('input', function (ev) {
      var row = ev.target.closest('.list-row');
      if (!row) return;
      var id = row.getAttribute('data-id');
      var item = state[listKey].find(function (i) { return i.id === id; });
      if (item) item.text = ev.target.value;
      save();
    });
    wrapEl.addEventListener('click', function (ev) {
      var id = ev.target.getAttribute('data-del');
      if (!id) return;
      state[listKey] = state[listKey].filter(function (i) { return i.id !== id; });
      save();
      renderList(wrapEl, state[listKey], '');
    });
  }

  els.loadTemplateBtn.addEventListener('click', function () {
    if (state && (state.materials.length || state.procedure.length) && !confirm('Replace the current template with this one?')) return;
    fromTemplate(els.templateSelect.value);
    save();
    renderAll();
  });

  ['labTitle', 'objective', 'hypothesisPrompt', 'observationsPrompt'].forEach(function (id) {
    var field = { labTitle: 'title', objective: 'objective', hypothesisPrompt: 'hypothesisPrompt', observationsPrompt: 'observationsPrompt' }[id];
    els[id].addEventListener('input', function () { state[field] = els[id].value; save(); });
  });
  els.dataRows.addEventListener('input', function () { state.dataRows = Math.max(1, Math.min(20, parseInt(els.dataRows.value, 10) || 5)); save(); });

  els.addMaterialBtn.addEventListener('click', function () { state.materials.push({ id: uid(), text: '' }); save(); renderList(els.materialsWrap, state.materials, 'e.g. Safety goggles'); });
  els.addStepBtn.addEventListener('click', function () { state.procedure.push({ id: uid(), text: '' }); save(); renderList(els.procedureWrap, state.procedure, 'e.g. Measure the sample'); });
  els.addColumnBtn.addEventListener('click', function () { state.columns.push({ id: uid(), text: '' }); save(); renderList(els.columnsWrap, state.columns, 'e.g. Trial'); });
  els.addQuestionBtn.addEventListener('click', function () { state.conclusion.push({ id: uid(), text: '' }); save(); renderList(els.conclusionWrap, state.conclusion, 'e.g. Was your hypothesis supported?'); });

  bindListEvents(els.materialsWrap, 'materials');
  bindListEvents(els.procedureWrap, 'procedure');
  bindListEvents(els.columnsWrap, 'columns');
  bindListEvents(els.conclusionWrap, 'conclusion');

  function packetHtml() {
    var title = state.title.trim() ? escapeHtml(state.title.trim()) : 'Lab Report';
    var materials = state.materials.map(function (m) { return '<div class="checklist-item"><span class="checkbox"></span>' + escapeHtml(m.text) + '</div>'; }).join('');
    var procedure = state.procedure.map(function (p, i) { return '<div class="step-item">' + (i + 1) + '. ' + escapeHtml(p.text) + '</div>'; }).join('');
    var cols = state.columns.map(function (c) { return '<th>' + escapeHtml(c.text) + '</th>'; }).join('');
    var rowsHtml = '';
    var rowCount = Math.max(1, Math.min(20, state.dataRows || 5));
    for (var r = 0; r < rowCount; r++) {
      rowsHtml += '<tr>' + state.columns.map(function () { return '<td></td>'; }).join('') + '</tr>';
    }
    var conclusion = state.conclusion.map(function (q) {
      return '<p style="font-size:.9rem;margin:.3rem 0 .1rem;">' + escapeHtml(q.text) + '</p><span class="fill-line"></span><span class="fill-line"></span>';
    }).join('');
    return '<h1 class="lab-title">' + title + '</h1>' +
      '<p class="lab-sub">Name: __________________________ &nbsp; Date: __________ &nbsp; Period: ______</p>' +
      '<div class="lab-section"><h3>Objective</h3><p style="font-size:.9rem;">' + escapeHtml(state.objective || '&mdash;') + '</p></div>' +
      '<div class="lab-section"><h3>Hypothesis</h3><p style="font-size:.9rem;">' + escapeHtml(state.hypothesisPrompt) + '</p><span class="fill-line"></span><span class="fill-line"></span></div>' +
      '<div class="lab-section"><h3>Materials</h3>' + materials + '</div>' +
      '<div class="lab-section"><h3>Procedure</h3>' + procedure + '</div>' +
      '<div class="lab-section"><h3>Data</h3><table class="data-table"><thead><tr>' + cols + '</tr></thead><tbody>' + rowsHtml + '</tbody></table></div>' +
      '<div class="lab-section"><h3>Observations</h3><p style="font-size:.9rem;">' + escapeHtml(state.observationsPrompt) + '</p><span class="fill-line"></span><span class="fill-line"></span></div>' +
      '<div class="lab-section"><h3>Conclusion</h3>' + conclusion + '</div>';
  }

  els.printBtn.addEventListener('click', function () {
    els.printArea.innerHTML = packetHtml();
    window.print();
  });

  /* ---------- boot ---------- */
  load();
  if (!state) fromTemplate('generic');
  renderAll();
})();
</script>
<script>
if ('serviceWorker' in navigator) {
  window.addEventListener('load', function () {
    navigator.serviceWorker.register('../sw.js').catch(function () {});
  });
}
</script>
</body>
</html>
