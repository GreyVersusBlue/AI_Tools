#app-browser {
  display:none; /* shown by toggleApp() */
  font-family:'Public Sans',system-ui,sans-serif;
  color:#283831; margin:0; padding:30px 18px 90px; font-size:16px; line-height:1.5;
  background:linear-gradient(180deg,#eef3ee 0%,#f4f7f4 240px,#f4f7f4 100%);
  min-height:100vh; box-sizing:border-box;
  --br-forest:#0c4b31; --br-forest-2:#155f3e; --br-forest-deep:#08381f;
  --br-gold:#f3c63f; --br-gold-soft:#d9ca98; --br-gold-line:#ece2c5;
  --br-cream:#fcfaf2; --br-paper:#f6f8f5; --br-ink:#283831; --br-muted:#62756a;
  --br-line:#e8eee9; --br-shadow:0 12px 34px -16px rgba(8,56,31,.30);
  --br-ela:#2563eb; --br-math:#c2520f; --br-sci:#0d7c69; --br-ss:#7c3aa8; --br-scsi:#71641f;
}
#app-browser *{box-sizing:border-box}
#app-browser .br-wrap{max-width:1040px;margin:0 auto}
#app-browser .mast{
  background:linear-gradient(165deg,var(--br-forest) 0%,var(--br-forest-deep) 100%);
  color:#fff;border-radius:16px 16px 0 0;padding:30px 36px;
  display:flex;align-items:center;gap:16px;border-bottom:4px solid var(--br-gold);
}
#app-browser .mast .seal{width:50px;height:50px;border-radius:50%;flex:none;
  background:radial-gradient(circle at 36% 32%,var(--br-gold),#c9a426);
  display:grid;place-items:center;font-family:'Fraunces',serif;font-weight:600;color:var(--br-forest-deep);
  font-size:21px;box-shadow:inset 0 0 0 3px rgba(255,255,255,.25);}
#app-browser .mast h1{font-family:'Fraunces',serif;font-weight:600;margin:0;font-size:27px;line-height:1.05}
#app-browser .mast .sub{margin:4px 0 0;color:var(--br-gold);font-weight:600;font-size:12px;letter-spacing:2px;text-transform:uppercase}
#app-browser .mast{justify-content:flex-start}
#app-browser .br-back-btn{
  margin-left:auto;display:inline-flex;align-items:center;gap:7px;
  font-family:'DM Sans',system-ui,sans-serif;font-size:13px;font-weight:700;
  color:var(--br-forest-deep);background:var(--br-gold);
  border:none;border-radius:9px;padding:9px 16px;cursor:pointer;
  letter-spacing:.3px;white-space:nowrap;flex-shrink:0;
  box-shadow:0 2px 8px rgba(0,0,0,.18);
  transition:background .18s,transform .12s,box-shadow .18s;
}
#app-browser .br-back-btn:hover{background:#f7d050;box-shadow:0 4px 14px rgba(0,0,0,.22);transform:translateY(-1px)}
#app-browser .br-back-btn:active{transform:translateY(0);box-shadow:0 1px 4px rgba(0,0,0,.18)}
#app-browser .panel{background:#fff;border:1px solid var(--br-gold-soft);border-top:none;border-radius:0 0 16px 16px;box-shadow:var(--br-shadow)}
#app-browser .toolbar{padding:20px 30px;background:var(--br-cream);border-bottom:1px solid var(--br-gold-line);
  display:flex;flex-wrap:wrap;gap:14px 20px;align-items:flex-end}
#app-browser .mode{display:inline-flex;background:#fff;border:1px solid var(--br-gold-soft);border-radius:11px;padding:3px}
#app-browser .mode button{font:inherit;font-weight:600;font-size:14px;border:none;background:none;color:var(--br-muted);
  padding:9px 18px;border-radius:8px;cursor:pointer;transition:.18s}
#app-browser .mode button.on{background:var(--br-forest);color:#fff}
#app-browser .br-field{display:flex;flex-direction:column;gap:6px;min-width:250px;flex:1}
#app-browser .br-field label{font-size:13px;font-weight:700;color:var(--br-forest)}
#app-browser .searchbox{position:relative}
#app-browser .searchbox input{width:100%;font:inherit;font-size:16px;font-weight:500;padding:12px 15px;border-radius:10px;
  border:1px solid var(--br-gold-soft);background:#fff;color:var(--br-forest);outline:none;transition:.18s}
#app-browser .searchbox input::placeholder{color:#9aa89f;font-weight:400}
#app-browser .searchbox input:focus{border-color:var(--br-forest);box-shadow:0 0 0 3px rgba(12,75,49,.13)}
#app-browser .br-menu{position:absolute;z-index:9000;top:calc(100% + 6px);left:0;right:0;background:#fff;
  border:1px solid var(--br-gold-soft);border-radius:12px;
  box-shadow:0 20px 46px -18px rgba(8,56,31,.45);max-height:min(60vh,360px);overflow:auto;display:none}
#app-browser .br-menu.show{display:block}
#app-browser .br-menu .grp{font-size:11px;font-weight:700;letter-spacing:.6px;text-transform:uppercase;
  color:var(--br-muted);padding:12px 16px 5px;position:sticky;top:0;background:#fff}
#app-browser .br-menu .opt{padding:11px 16px;cursor:pointer;display:flex;align-items:center;gap:11px;font-size:15.5px;font-weight:500}
#app-browser .br-menu .opt:hover,#app-browser .br-menu .opt.active{background:var(--br-paper)}
#app-browser .br-menu .opt .tag{font-size:12.5px;color:var(--br-muted);margin-left:auto}
#app-browser .br-dot{width:10px;height:10px;border-radius:50%;flex:none}
#app-browser .btn-print{font:inherit;font-weight:600;font-size:13.5px;border:1px solid var(--br-gold-soft);background:#fff;
  color:var(--br-forest);padding:11px 17px;border-radius:10px;cursor:pointer;transition:.18s}
#app-browser .btn-print:hover{background:var(--br-forest);color:#fff;border-color:var(--br-forest)}
#app-browser .btn-dl{font:inherit;font-weight:600;font-size:13.5px;border:1px solid var(--br-forest);background:var(--br-forest);
  color:#fff;padding:11px 17px;border-radius:10px;cursor:pointer;transition:.18s;flex:none}
#app-browser .btn-dl:hover{background:var(--br-forest-2);border-color:var(--br-forest-2)}
@media(max-width:620px){#app-browser .btn-dl{width:100%}}
/* ── R62: copy-link / share buttons + staleness banner ── */
#app-browser .idhead-actions{margin-left:auto;display:flex;flex-wrap:wrap;gap:10px}
#app-browser .btn-copy{font:inherit;font-weight:600;font-size:13.5px;border:1px solid var(--br-gold-soft);background:#fff;
  color:var(--br-forest);padding:11px 17px;border-radius:10px;cursor:pointer;transition:.18s;flex:none}
#app-browser .btn-copy:hover{background:var(--br-forest);color:#fff;border-color:var(--br-forest)}
#app-browser .btn-copy:disabled{opacity:.65;cursor:default}
@media(max-width:620px){#app-browser .idhead-actions{margin-left:0;width:100%}
  #app-browser .idhead-actions>*{width:100%}}
#app-browser .stale-banner{display:none;margin:0 0 16px;padding:14px 20px;border-radius:0 0 10px 10px;
  background:#fbe4c8;border:2px solid #c96a1f;border-top:none;color:#7a3c0e;font-size:14.5px;font-weight:700;line-height:1.5;text-align:center}
#app-browser .stale-banner.show{display:block}
#app-browser .stale-banner::before{content:"⚠ "}

const brTDept = n => BR_TEACHERS[n] ? BR_TEACHERS[n].dept : (Object.keys(BR_DEPT)[0] || 'ELA');
const brDShort = d => {
  if (BR_LEGACY_SHORT[d] && BR_DEPT[d]) return BR_LEGACY_SHORT[d];
  const entry = BR_DEPT[d];
  if (entry && entry.name) return entry.name.length <= 12 ? entry.name : d;
  return d;
};
const brOrderOf = d => (d in BR_ORDER) ? BR_ORDER[d] : 999;
let BR_TEACHERS = PUBLISHED_DATA.teachers, BR_SECTIONS = PUBLISHED_DATA.sections,
    BR_ROOM2TEACHER = PUBLISHED_DATA.room2teacher, BR_MODCOUNT = PUBLISHED_DATA.modCount,
    BR_MOD_LABEL = PUBLISHED_DATA.modLabel;
let BR_GROUPROOMS = PUBLISHED_DATA.groupRooms || {}, BR_BELL = PUBLISHED_DATA.bell,
    BR_GEOM = PUBLISHED_DATA.geometry;
/* Teacher/room/section names come straight from typed input in the visualizer
   this file was published from, so they can contain characters (', ", <, &)
   that would otherwise break out of an onclick="...('...')" attribute or
   corrupt surrounding markup — e.g. any teacher literally named "O'Brien". */
function brEscHtml(s) {
  return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
}
function brJsAttr(s) {
  return String(s).replace(/\\/g, '\\\\').replace(/'/g, "\\'")
    .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
}

/* ── R62: direct links to one teacher/group ── */
function brBuildLinkURL(kind, key) {
  const url = new URL(location.origin + location.pathname);
  url.search = '';
  url.searchParams.set(kind, key);
  return url.toString();
}
function brFlashBtn(btn, label, ms) {
  if (!btn) return;
  if (!btn.dataset.origLabel) btn.dataset.origLabel = btn.textContent;
  btn.textContent = label;
  btn.disabled = true;
  clearTimeout(btn._brFlashT);
  btn._brFlashT = setTimeout(() => { btn.textContent = btn.dataset.origLabel; btn.disabled = false; }, ms || 1700);
}
function brCopyFallback(text) {
  try {
    const ta = document.createElement('textarea');
    ta.value = text; ta.setAttribute('readonly', '');
    ta.style.position = 'fixed'; ta.style.top = '-1000px'; ta.style.opacity = '0';
    document.body.appendChild(ta); ta.select();
    const ok = document.execCommand('copy');
    ta.remove();
    return ok;
  } catch (e) { return false; }
}
function brCopyLink(kind, key, btn) {
  const url = brBuildLinkURL(kind, key);
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(url)
      .then(() => brFlashBtn(btn, 'Link copied!'))
      .catch(() => brFlashBtn(btn, brCopyFallback(url) ? 'Link copied!' : 'Copy failed'));
  } else {
    brFlashBtn(btn, brCopyFallback(url) ? 'Link copied!' : 'Copy failed');
  }
}
function brShareLink(kind, key) {
  if (typeof navigator.share !== 'function') return;
  const url = brBuildLinkURL(kind, key);
  const title = kind === 'teacher' ? (key + ' — Teacher Schedule') : ('Class ' + key + ' — Schedule');
  navigator.share({ title, url }).catch(() => {});
}
function brShareButtonsHTML(kind, key) {
  const attr = brJsAttr(key);
  const shareBtn = (typeof navigator.share === 'function')
    ? `<button class="btn-copy" onclick="brShareLink('${kind}','${attr}')">Share…</button>`
    : '';
  return `<button class="btn-copy" onclick="brCopyLink('${kind}','${attr}',this)">Copy link</button>${shareBtn}`;
}
function brFindKeyCI(map, want) {
  if (!want) return null;
  if (Object.prototype.hasOwnProperty.call(map, want)) return want;
  const lower = want.toLowerCase();
  return Object.keys(map).find(k => k.toLowerCase() === lower) || null;
}
function brApplyDeepLink() {
  let params;
  try { params = new URLSearchParams(location.search); } catch (e) { return; }
  const tp = params.get('teacher');
  if (tp) {
    const key = brFindKeyCI(BR_TEACHERS, tp);
    if (key) { brJumpTeacher(key); return; }
  }
  const gp = params.get('group');
  if (gp) {
    const key = brFindKeyCI(BR_SECTIONS, gp);
    if (key) { brJumpGroup(key); return; }
  }
}

/* ── R62: "may be stale" banner, driven by PUBLISHED_DATA.publishedOn (see
   BR_STALE_DAYS above). If a future export of this file has no publishedOn
   field, this quietly does nothing rather than throwing. ── */
function brFormatDateLong(d) {
  try { return d.toLocaleDateString(undefined, { year: 'numeric', month: 'long', day: 'numeric' }); }
  catch (e) { return d.toISOString().slice(0, 10); }
}
function brCheckStaleness() {
  const el = document.getElementById('br-stale-banner');
  if (!el) return;
  const raw = PUBLISHED_DATA && PUBLISHED_DATA.publishedOn;
  if (!raw) return;
  const pub = new Date(/^\d{4}-\d{2}-\d{2}$/.test(raw) ? raw + 'T00:00:00' : raw);
  if (isNaN(pub.getTime())) return;
  const days = Math.floor((Date.now() - pub.getTime()) / 86400000);
  if (days <= BR_STALE_DAYS) return;
  el.textContent = 'This schedule was published on ' + brFormatDateLong(pub) + ' — ' + days + ' days ago. '
    + 'It may be out of date — check with the office or ask for a fresh export if anything looks off.';
  el.classList.add('show');
}

/* ── Personal notes overlay ────────────────────────────────────────────────
   The published schedule says what a period IS. It cannot say that 4th is
   bus duty this quarter, that 6th is when the IEP meetings land, or that
   2nd is the one to protect. Those are the things a teacher writes on their
   printed copy in pen, and they are per-person, so they live here on the
   device rather than in the published data.

   Keyed by teacher + day + period. Notes are attached to whichever
   schedule is on screen, which also makes "Mrs. Almer covers my class B-day
   5th" a note you can leave on Mrs. Almer's page — the whole tool is a
   browser of other people's schedules and the notes are local either way. */
const BR_NOTES_KEY = 'br_personal_notes_v1';

function brLoadNotes() {
  try {
    const parsed = JSON.parse(localStorage.getItem(BR_NOTES_KEY) || '{}');
    return (parsed && typeof parsed === 'object' && !Array.isArray(parsed)) ? parsed : {};
  } catch (e) { return {}; }
}
function brNoteFor(teacher, day, i) {
  const all = brLoadNotes();
  return (all[teacher] && all[teacher][day] && all[teacher][day][i]) || '';
}
/** Writes one note. An emptied note is deleted rather than stored as '', and
    a teacher or day left with nothing is pruned — otherwise a year of
    clearing notes leaves a storage blob full of empty objects. */
function brSetNote(teacher, day, i, text) {
  const all = brLoadNotes();
  const value = String(text || '').trim();
  if (value) {
    if (!all[teacher]) all[teacher] = {};
    if (!all[teacher][day]) all[teacher][day] = {};
    all[teacher][day][i] = value;
  } else if (all[teacher] && all[teacher][day]) {
    delete all[teacher][day][i];
    if (!Object.keys(all[teacher][day]).length) delete all[teacher][day];
    if (!Object.keys(all[teacher]).length) delete all[teacher];
  }
  try { localStorage.setItem(BR_NOTES_KEY, JSON.stringify(all)); }
  catch (e) { /* storage full/blocked — the note just won't persist */ }
}

function brDayRows(arr, room, day, teacher) {
  let out='';
  const bell = BR_BELL ? (day==='B' ? BR_BELL.B : BR_BELL.A) : null;
  for (let i=0; i<BR_MODCOUNT; i++) {
    const sec=arr[i]; const plan=!sec||sec==='Planning';
    const time = bell ? (bell[i]||'') : '';
    const cell=plan
      ? `<div class="cell">Planning / Intervention</div>`
      : `<div class="cell"><div class="sec">Class ${sec}</div><div class="who">Room ${room}</div></div>`;
    const note = teacher ? brNoteFor(teacher, day, i) : null;
    const noteCell = teacher
      ? `<div class="note"><input type="text" class="br-note${note?' has-note':''}" maxlength="60"
           data-note-teacher="${brEscHtml(teacher)}" data-note-day="${day}" data-note-i="${i}"
           aria-label="Your note for ${BR_MOD_LABEL} ${i+1} on ${day} day"
           placeholder="note…" value="${brEscHtml(note)}"></div>`
      : '';
    out += `<div class="blockrow${plan?' plan':''}"><div class="bk"><span class="n">${i+1}</span><span class="t">${BR_MOD_LABEL}</span>${time?`<span class="bt">${time}</span>`:''}</div>${cell}${noteCell}</div>`;
  }
  return out;
}

/* Delegated, and on `change` rather than `input`: the teacher panel rebuilds
   itself with innerHTML on almost every interaction, so re-rendering per
   keystroke would take the caret with it. `change` fires on blur or Enter,
   by which point the field is finished with. */
document.addEventListener('change', function (ev) {
  const el = ev.target;
  if (!el || !el.classList || !el.classList.contains('br-note')) return;
  brSetNote(el.dataset.noteTeacher, el.dataset.noteDay, el.dataset.noteI, el.value);
  el.classList.toggle('has-note', !!el.value.trim());
});

/* ── R61: download a teacher's day as a PNG, drawn on an off-screen canvas ── */
function brSlug(s) {
  return String(s).normalize('NFKD').replace(/[̀-ͯ]/g, '')
    .toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-+|-+$/g, '') || 'teacher';
}
function brFitText(ctx, text, maxW) {
  text = String(text);
  if (ctx.measureText(text).width <= maxW) return text;
  let s = text;
  while (s.length > 1 && ctx.measureText(s + '…').width > maxW) s = s.slice(0, -1);
  return s.length ? s + '…' : '…';
}
function brDrawDayBlock(ctx, x, y, w, label, arr, room, day) {
  const rowH = 62, headH = 38, periodW = 78, pad = 14;
  ctx.fillStyle = day === 'B' ? '#4d5f3f' : '#0c4b31';
  ctx.fillRect(x, y, w, headH);
  ctx.fillStyle = '#ffffff';
  ctx.font = '700 15px "Public Sans", Arial, sans-serif';
  ctx.textAlign = 'left'; ctx.textBaseline = 'middle';
  ctx.fillText(brFitText(ctx, label, w - pad * 2), x + pad, y + headH / 2 + 1);
  let ry = y + headH;
  const bell = BR_BELL ? (day === 'B' ? BR_BELL.B : BR_BELL.A) : null;
  for (let i = 0; i < BR_MODCOUNT; i++) {
    const sec = arr[i], plan = !sec || sec === 'Planning';
    const time = bell ? (bell[i] || '') : '';
    ctx.fillStyle = plan ? '#fdfaef' : (i % 2 ? '#ffffff' : '#fbfcfa');
    ctx.fillRect(x, ry, w, rowH);
    ctx.strokeStyle = '#e8eee9'; ctx.lineWidth = 1;
    ctx.strokeRect(x + .5, ry + .5, w - 1, rowH - 1);
    ctx.strokeRect(x + .5, ry + .5, periodW - 1, rowH - 1);
    ctx.textAlign = 'center'; ctx.textBaseline = 'alphabetic';
    ctx.fillStyle = '#0c4b31';
    ctx.font = '700 20px Georgia, "Times New Roman", serif';
    ctx.fillText(String(i + 1), x + periodW / 2, ry + 28);
    ctx.font = '700 9px "Public Sans", Arial, sans-serif';
    ctx.fillStyle = '#62756a';
    ctx.fillText(brFitText(ctx, BR_MOD_LABEL.toUpperCase(), periodW - 6), x + periodW / 2, ry + 40);
    if (time) {
      ctx.font = '600 9px "Public Sans", Arial, sans-serif';
      ctx.fillText(brFitText(ctx, time, periodW - 6), x + periodW / 2, ry + 52);
    }
    ctx.textAlign = 'left';
    const cx = x + periodW + pad, cw = w - periodW - pad * 2;
    if (plan) {
      ctx.fillStyle = '#9a8430';
      ctx.font = 'italic 700 15px "Public Sans", Arial, sans-serif';
      ctx.fillText(brFitText(ctx, 'Planning / Intervention', cw), cx, ry + rowH / 2 + 5);
    } else {
      ctx.fillStyle = '#283831';
      ctx.font = '700 16px "Public Sans", Arial, sans-serif';
      ctx.fillText(brFitText(ctx, 'Class ' + sec, cw), cx, ry + 27);
      ctx.fillStyle = '#62756a';
      ctx.font = '400 13px "Public Sans", Arial, sans-serif';
      ctx.fillText(brFitText(ctx, 'Room ' + room, cw), cx, ry + 46);
    }
    ry += rowH;
  }
}
function brDownloadTeacherSchedule(n) {
  const t = BR_TEACHERS[n]; if (!t) return;
  const split = JSON.stringify(t.A) !== JSON.stringify(t.B);
  const deptLabel = (BR_DEPT[t.dept] || {}).name || t.dept;
  const scale = 2, pad = 32, gap = 20, headH = 118, dayHeadH = 38, rowH = 62;
  const colW = split ? 380 : 780;
  const width = pad * 2 + colW * (split ? 2 : 1) + (split ? gap : 0);
  const height = headH + 14 + dayHeadH + BR_MODCOUNT * rowH + 24;

  const canvas = document.createElement('canvas');
  canvas.width = width * scale; canvas.height = height * scale;
  const ctx = canvas.getContext('2d');
  ctx.scale(scale, scale);

  ctx.fillStyle = '#f6f8f5';
  ctx.fillRect(0, 0, width, height);

  ctx.fillStyle = '#0c4b31';
  ctx.fillRect(0, 0, width, headH);
  ctx.textAlign = 'left'; ctx.textBaseline = 'alphabetic';
  ctx.fillStyle = '#f3c63f';
  ctx.font = '700 12px "Public Sans", Arial, sans-serif';
  ctx.fillText('TEACHER SCHEDULE', pad, 30);
  ctx.fillStyle = '#ffffff';
  ctx.font = '700 30px Georgia, "Times New Roman", serif';
  ctx.fillText(brFitText(ctx, n, width - pad * 2), pad, 66);
  ctx.fillStyle = '#eaf3ec';
  ctx.font = '600 14.5px "Public Sans", Arial, sans-serif';
  const sub = `${deptLabel} · Room ${t.room} · Planning is ${BR_MOD_LABEL} ${t.plan}`;
  ctx.fillText(brFitText(ctx, sub, width - pad * 2), pad, 92);

  const cy = headH + 14;
  brDrawDayBlock(ctx, pad, cy, colW, split ? 'A Day' : 'Every day (A & B the same)', t.A, t.room, 'A');
  if (split) brDrawDayBlock(ctx, pad + colW + gap, cy, colW, 'B Day', t.B, t.room, 'B');

  canvas.toBlob(blob => {
    if (!blob) return;
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = brSlug(n) + '-schedule.png';
    document.body.appendChild(a);
    a.click();
    a.remove();

/* ── "Who's Free Now" — the most-asked office question, one tap. Bell times
   are plain "H:MM–H:MM" strings with no AM/PM marker (see PUBLISHED_DATA.bell),
   so any hour below 8 is assumed PM — true for any real school day. There's
   no A/B-day-of-week calendar in this file, so the day itself stays a manual
   toggle rather than being guessed. ── */
let brFreeDay = 'A', brFreePeriod = -1;
function brParseBellTime(s) {
  const m = /^(\d{1,2}):(\d{2})/.exec(String(s || '').trim());
  if (!m) return null;
  let h = parseInt(m[1], 10);
  const min = parseInt(m[2], 10);
  if (h < 8) h += 12;
  return h * 60 + min;
}
function brParseBellRange(rangeStr) {
  const parts = String(rangeStr || '').split(/[–—-]/);
  if (parts.length < 2) return null;
  const start = brParseBellTime(parts[0]), end = brParseBellTime(parts[1]);
  return (start == null || end == null) ? null : { start, end };
}
function brCurrentPeriodIdx(day) {
  const arr = BR_BELL ? (day === 'B' ? BR_BELL.B : BR_BELL.A) : null;
  if (!arr) return -1;
  const now = new Date(), nowMin = now.getHours() * 60 + now.getMinutes();
  for (let i = 0; i < arr.length; i++) {
    const r = brParseBellRange(arr[i]);
    if (r && nowMin >= r.start && nowMin < r.end) return i;
  }
  return -1;
}
function brFreeTeachersFor(day, idx) {
  if (idx < 0) return [];
  return Object.keys(BR_TEACHERS).filter(n => {
    const sec = (day === 'B' ? BR_TEACHERS[n].B : BR_TEACHERS[n].A)[idx];
    return !sec || sec === 'Planning';
  }).sort((a, b) => (brOrderOf(brTDept(a)) - brOrderOf(brTDept(b))) || a.localeCompare(b));
}
function brFreeHTML() {
  const bell = BR_BELL ? (brFreeDay === 'B' ? BR_BELL.B : BR_BELL.A) : null;
  const dayToggle = `<div class="daychips"><button class="${brFreeDay==='A'?'on':''}" onclick="brSetFreeDay('A')">A Day</button><button class="${brFreeDay==='B'?'on':''}" onclick="brSetFreeDay('B')">B Day</button></div>`;
  const periodBtns = Array.from({ length: BR_MODCOUNT }, (_, i) => {
    const time = bell ? (bell[i] || '') : '';
    return `<button class="gchip${i===brFreePeriod?' active':''}" onclick="brSetFreePeriod(${i})">${brEscHtml(BR_MOD_LABEL)} ${i+1}${time?' · '+brEscHtml(time):''}</button>`;
  }).join('');
  let body;
  if (brFreePeriod < 0) {
    body = `<p class="hint">Pick a ${brEscHtml(BR_MOD_LABEL)} above${bell?' — or check back once it lines up with the current time':', since no bell times are in this file to guess "right now" automatically'}.</p>`;
  } else {
    const free = brFreeTeachersFor(brFreeDay, brFreePeriod);
    body = free.length
      ? `<p class="factline"><b>${free.length}</b> teacher${free.length!==1?'s':''} free ${brEscHtml(BR_MOD_LABEL)} ${brFreePeriod+1} on ${brFreeDay} day.</p>
         <p class="hint">Tap a card to open that teacher's full schedule.</p>
         <div class="team">${free.map(n => { const t=BR_TEACHERS[n]; const c=brDColor(t.dept); const dLabel=(BR_DEPT[t.dept]||{}).name||t.dept;
           return `<button class="tcard" style="border-left-color:${c}" onclick="brJumpTeacher('${brJsAttr(n)}')">
             <div class="nm">${brEscHtml(n)}</div><div class="sj" style="color:${c}">${brEscHtml(dLabel)}</div>
             <div class="rm">Room ${brEscHtml(t.room)}</div></button>`; }).join('')}</div>`
      : `<p class="factline">No one is free ${brEscHtml(BR_MOD_LABEL)} ${brFreePeriod+1} on ${brFreeDay} day.</p>`;
  }
  return `<div class="idhead">
     <div class="ibadge" style="background:#0c4b31">?</div>
     <div><h2>Who's Free Right Now</h2><div class="role" style="color:#62756a">Pick a day and ${brEscHtml((BR_MOD_LABEL||'').toLowerCase())}</div></div>
   </div>
   ${dayToggle}
   <div class="classrow" style="margin-bottom:16px;">${periodBtns}</div>
   ${body}`;
}

function brGeoFindRoom(rn) {
  if (!rn || !BR_GEOM || !Array.isArray(BR_GEOM.floors)) return null;
  for (let i = 0; i < BR_GEOM.floors.length; i++) {
    const fg = BR_GEOM.floors[i];
    if ((fg.rooms || []).some(r => r.rn === rn)) return { floorIdx: i, floor: fg };
  }
  return null;
}

function brGeoFloorSVG(fg, opts) {
  opts = opts || {};
  const px = opts.px || 26, W = fg.cols * px, H = fg.rows * px;
  const hi = opts.highlights || {};              /* { roomNumber: badgeLabel|true } */
  const clickable = opts.clickable !== false;
  let s = `<rect x="-4" y="-4" width="${W+8}" height="${H+8}" rx="10" fill="#fbfcfa" stroke="#e3eae4" stroke-width="1.5"/>`;
  for (const [c, r] of (fg.hall || []))
    s += `<rect x="${c*px}" y="${r*px}" width="${px}" height="${px}" fill="#eef2ee"/>`;
  for (const [c, r] of (fg.stair || []))
    s += `<rect x="${c*px}" y="${r*px}" width="${px}" height="${px}" fill="#d9e4da"/>`
       + `<text x="${c*px+px/2}" y="${r*px+px*0.7}" text-anchor="middle" font-size="${px*0.5}" font-family="Public Sans,sans-serif" font-weight="700" fill="#4c6355">S</text>`;
  const rings = [], badges = [];
  for (const room of (fg.rooms || [])) {
    const named = !!room.rn;
    const col = (named && room.dept) ? brDColor(room.dept) : '#9aa89f';
    const isHi = named && (room.rn in hi);
    const teacher = named ? BR_ROOM2TEACHER[room.rn] : null;
    const canClick = clickable && !!teacher;
    let cellsSvg = '', minC = Infinity, minR = Infinity, maxC = -1, maxR = -1;
    for (const [c, r] of room.cells) {
      cellsSvg += `<rect x="${c*px+1}" y="${r*px+1}" width="${px-2}" height="${px-2}" rx="3" fill="${col}" fill-opacity="${isHi?0.38:(named?0.16:0.08)}"/>`;
      if (c < minC) minC = c; if (r < minR) minR = r;
      if (c > maxC) maxC = c; if (r > maxR) maxR = r;
    }
    const bx = minC*px, by = minR*px, bw = (maxC-minC+1)*px, bh = (maxR-minR+1)*px;
    const fs = named ? Math.max(8, Math.min(px*0.42, (bw-6)/Math.max(1, room.rn.length)*1.65)) : 0;
    const label = named
      ? `<text x="${bx+bw/2}" y="${by+bh/2+fs*0.36}" text-anchor="middle" font-size="${fs}" font-family="Public Sans,sans-serif" font-weight="600" fill="#3c4a42">${brEscHtml(room.rn)}</text>`
      : '';
    const click = canClick ? ` onclick="brJumpTeacher('${brJsAttr(teacher)}')"` : '';
    s += `<g class="geo-room${canClick?' live':''}"${click}>${cellsSvg}${label}${canClick?`<title>${brEscHtml(teacher)} · ${brEscHtml(room.rn)}</title>`:''}</g>`;
    if (isHi) {
      rings.push(`<rect x="${bx-2.5}" y="${by-2.5}" width="${bw+5}" height="${bh+5}" rx="6" fill="none" stroke="${col}" stroke-width="3"/>`);
      const badge = hi[room.rn];
      if (badge && badge !== true) {
        const btxt = String(badge);
        const bwid = Math.max(34, btxt.length*px*0.27 + 14);
        const byTop = (by - px*0.78 < -px) ? (by + bh + 4) : (by - px*0.78);
        badges.push(`<g><rect x="${bx+bw/2-bwid/2}" y="${byTop}" width="${bwid}" height="${px*0.62}" rx="${px*0.31}" fill="${col}"/>`
                  + `<text x="${bx+bw/2}" y="${byTop+px*0.44}" text-anchor="middle" font-size="${px*0.36}" font-family="Public Sans,sans-serif" font-weight="700" fill="#fff">${btxt}</text></g>`);
      }
    }
  }
  s += rings.join('') + badges.join('');
  const vbW = W + 16;
  return `<svg class="geoplan" viewBox="-8 -${px+6} ${vbW} ${H+px+18}" style="width:100%;--geo-w:${vbW}px" xmlns="http://www.w3.org/2000/svg">${s}</svg>`;
}
