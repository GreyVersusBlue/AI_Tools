<meta charset="UTF-8">

<style>
  :root {
    --ink: #1f2430; --paper: #fafaf8; --card: #fff;
    --line: #dcdad2; --line-strong: #c3c0b6;
    --accent: #1f3550; --accent-2: #2e6b8f; --muted: #6b6a63;
  }
  * { box-sizing: border-box; }
  body {
    font-family: "Segoe UI", Georgia, "Times New Roman", serif;
    background: var(--paper); color: var(--ink); margin: 0;
    padding: 24px 20px 100px; line-height: 1.45;
  }
  .wrap { max-width: 1280px; margin: 0 auto; }
  .app-header { display: flex; align-items: baseline; justify-content: space-between; gap: 1rem; flex-wrap: wrap; margin-bottom: 1.4rem; }
  .app-header h1 { font-size: 1.7rem; margin: 0 0 .2rem; }
  .back-link { color: var(--muted); text-decoration: none; font-size: .88rem; }
  .back-link:hover { color: var(--accent-2); }

  .layout { display: grid; grid-template-columns: minmax(280px, 340px) 1fr; gap: 1.4rem; align-items: start; }
  @media (max-width: 900px) { .layout { grid-template-columns: 1fr; } }

  .card { background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 1.1rem 1.2rem; margin-bottom: 1rem; }
  label { display: block; font-weight: 600; font-size: .82rem; margin-bottom: .3rem; }
  input[type="text"], input[type="number"], select {
    width: 100%; font-family: inherit; font-size: .92rem; color: var(--ink);
    background: #fff; border: 1px solid var(--line-strong); border-radius: 6px;
    padding: .5rem .6rem; margin-bottom: .8rem;
  }
  .row2 { display: grid; grid-template-columns: 1fr 1fr; gap: .7rem; }
  .hint { color: var(--muted); font-size: .78rem; margin: -.15rem 0 .6rem; }

  button {
    font-family: inherit; font-size: .92rem; font-weight: 600; cursor: pointer;
    background: var(--accent); color: #fff; border: 1px solid var(--accent);
    border-radius: 7px; padding: .6rem 1.1rem; width: 100%; margin-bottom: .6rem;
  }
  button:hover { background: var(--accent-2); border-color: var(--accent-2); }
  button.secondary { background: #fff; color: var(--ink); border-color: var(--line-strong); }
  button.secondary:hover { background: #f1f0ea; border-color: var(--muted); color: var(--ink); }

  .toggle-row { display: flex; gap: .5rem; margin-bottom: .6rem; }
  .toggle-row button { margin-bottom: 0; }
  .toggle-row button.active { background: var(--accent); color: #fff; }
  .toggle-row button:not(.active) { background: #fff; color: var(--ink); border-color: var(--line-strong); }

  .preview-wrap { background: #d9d7cd; border-radius: 10px; padding: 1.4rem; overflow: auto; }
  .preview-note { font-size: .8rem; color: var(--muted); margin-bottom: .8rem; }

  .sheet {
    background: #fff; width: 8.5in; min-height: 11in; margin: 0 auto; padding: 0.6in 0.55in;
    box-shadow: 0 2px 10px rgba(0,0,0,.18); max-width: 100%;
  }
  .sheet-title { font-size: 1.3rem; font-weight: 700; margin-bottom: .2rem; }
  .sheet-meta { display: flex; justify-content: space-between; font-size: .85rem; color: var(--muted); margin-bottom: 1rem; border-bottom: 1px solid var(--line); padding-bottom: .5rem; }
  .sheet-meta .fill-line { border-bottom: 1px solid #999; display: inline-block; min-width: 6rem; }

  .problems { column-gap: 1.4rem; font-family: Consolas, monospace; font-size: 1rem; }
  .problems .p { break-inside: avoid; margin-bottom: .85rem; white-space: nowrap; }
  .problems .p .num { color: var(--muted); font-size: .78rem; margin-right: .35rem; }

  .answers { column-gap: 1.4rem; font-family: Consolas, monospace; font-size: .92rem; }
  .answers .a { break-inside: avoid; margin-bottom: .5rem; }
  .answers .a .num { color: var(--muted); font-size: .78rem; margin-right: .35rem; }

  footer.note { color: var(--muted); font-size: .82rem; margin-top: 2rem; }

  @media print {
    body * { visibility: hidden; }
    #printArea, #printArea * { visibility: visible; }
    #printArea { display: block !important; position: absolute; left: 0; top: 0; width: 100%; margin: 0; }
    #printArea .sheet { box-shadow: none; page-break-after: always; }
    #printArea .sheet:last-child { page-break-after: auto; }
    @page { size: letter portrait; margin: 0; }
  }
</style>
</head>
<body>
<div class="wrap">

  <div class="app-header">
    <div>
      <a class="back-link" href="../index.html">&larr; Toolkit</a>
      <h1>Math Fact Drill Sheet Generator</h1>
    </div>
  </div>

  <div class="layout">
    <div class="editor">
      <div class="card">
        <label for="templateKey">Template</label>
        <select id="templateKey"></select>

        <div class="row2">
          <div>
            <label for="operand1Min">Operand 1 range</label>
            <div class="row2" style="margin-bottom:0;">
              <input type="number" id="operand1Min" min="0" max="999" aria-label="Operand 1 minimum">
              <input type="number" id="operand1Max" min="0" max="999" aria-label="Operand 1 maximum">
            </div>
          </div>
          <div>
            <label for="operand2Min">Operand 2 range</label>
            <div class="row2" style="margin-bottom:0;">
              <input type="number" id="operand2Min" min="0" max="999" aria-label="Operand 2 minimum">
              <input type="number" id="operand2Max" min="0" max="999" aria-label="Operand 2 maximum">
            </div>
          </div>
        </div>
        <button type="button" class="secondary" id="resetRangeBtn" style="margin-bottom:.8rem;">Reset range to template default</button>

        <label for="sheetTitle">Sheet title (optional)</label>
        <input type="text" id="sheetTitle" placeholder="e.g. Multiplication Facts — Period 3">

        <div class="row2">
          <div><label for="problemCount">Number of problems</label><input type="number" id="problemCount" value="30" min="5" max="100"></div>
          <div><label for="columns">Columns</label><input type="number" id="columns" value="3" min="1" max="6"></div>
        </div>

        <label for="versionCount">Number of versions</label>
        <input type="number" id="versionCount" value="1" min="1" max="6">
        <p class="hint">Generates that many distinct randomized sheets (Version A/B/C&hellip;) back to back &mdash; useful for preventing copying during a timed drill.</p>

        <label style="display:flex;align-items:center;gap:.4rem;font-weight:600;font-size:.85rem;">
          <input type="checkbox" id="timedFluency" style="width:auto;margin:0;"> Add timed-fluency header
        </label>
        <div id="fluencyTargetRow" style="display:none;">
          <label for="fluencyTargetSeconds">Target time (seconds, optional)</label>
          <input type="number" id="fluencyTargetSeconds" min="1" max="3600" placeholder="e.g. 60">
        </div>

        <button type="button" id="generateBtn">Generate new sheet</button>

        <div class="toggle-row" id="versionTabs" style="display:none;"></div>

        <div class="toggle-row">
          <button type="button" class="secondary active" id="viewWorksheetBtn">Worksheet</button>
          <button type="button" class="secondary" id="viewAnswersBtn">Answer key</button>
        </div>

        <button type="button" id="printBtn">Print (both pages)</button>

        <div class="row2">
          <button type="button" class="secondary" id="exportSettingsBtn">Export settings</button>
          <button type="button" class="secondary" id="importSettingsBtn">Import settings</button>
        </div>
        <input type="file" id="importSettingsFile" accept="application/json,.json" style="display:none;">
      </div>
    </div>

    <div class="preview-wrap">
      <p class="preview-note" id="previewNote">Live preview.</p>
      <div id="previewArea"></div>
    </div>
  </div>

  <footer class="note">
    Runs entirely in your browser &mdash; nothing is uploaded. Every "Generate" makes a fresh, randomized sheet.
  </footer>

</div>

<div id="printArea" style="display:none;"></div>

<script>
(function () {
  'use strict';

  var els = {};
  ['templateKey','sheetTitle','problemCount','columns','versionCount','versionTabs','generateBtn',
   'viewWorksheetBtn','viewAnswersBtn','printBtn','previewArea','previewNote',
   'exportSettingsBtn','importSettingsBtn','importSettingsFile',
   'operand1Min','operand1Max','operand2Min','operand2Max','resetRangeBtn',
   'timedFluency','fluencyTargetRow','fluencyTargetSeconds'
  ].forEach(function (id) { els[id] = document.getElementById(id); });

  var settings = { templateKey: 'addition', sheetTitle: '', problemCount: 30, columns: 3, versions: 1, rangesByTemplate: {},
    timedFluency: false, fluencyTargetSeconds: '' };
  var problemSets = []; // [{ label: 'Version A'|null, problems: [...] }, ...]
  var currentVersionIndex = 0;
  var view = 'worksheet';
  var todayStr = new Date().toLocaleDateString();

  function loadSaved() {
    var saved = MathDrillStore.load();
    if (saved) Object.keys(settings).forEach(function (k) { if (saved[k] !== undefined) settings[k] = saved[k]; });
  }
  function persist() { MathDrillStore.save(settings); }

  function buildTemplateOptions() {
    MathDrillTemplates.TEMPLATES.forEach(function (t) {
      var opt = document.createElement('option');
      opt.value = t.key; opt.textContent = t.label;
      els.templateKey.appendChild(opt);
    });
  }

  /** The template with its operand ranges overridden by any saved custom range for that template key. */
  function effectiveTemplate(key) {
    var base = MathDrillTemplates.byKey(key);
    var custom = settings.rangesByTemplate[key];
    if (!custom) return base;
    return {
      key: base.key, label: base.label, operation: base.operation,
      operand1: custom.operand1 || base.operand1,
      operand2: custom.operand2 || base.operand2
    };
  }

  function clampRange(min, max, fallback, minFloor) {
    min = parseInt(min, 10); max = parseInt(max, 10);
    if (isNaN(min)) min = fallback.min;
    if (isNaN(max)) max = fallback.max;
    min = Math.max(minFloor, Math.min(999, min));
    max = Math.max(minFloor, Math.min(999, max));
    if (max < min) max = min;
    return { min: min, max: max };
  }

  /** Populate the operand-range inputs from the current template's saved custom range (or its default). */
  function loadRangeInputs() {
    var t = effectiveTemplate(els.templateKey.value);
    els.operand1Min.value = t.operand1.min;
    els.operand1Max.value = t.operand1.max;
    els.operand2Min.value = t.operand2.min;
    els.operand2Max.value = t.operand2.max;
  }

  /** Read the operand-range inputs into settings.rangesByTemplate for the current template. */
  function readRangeInputs() {
    var key = els.templateKey.value;
    var base = MathDrillTemplates.byKey(key);
    // Operand 2 doubles as the divisor for division/mixed templates, so it can never bottom out at 0.
    var op1 = clampRange(els.operand1Min.value, els.operand1Max.value, base.operand1, 0);
    var op2 = clampRange(els.operand2Min.value, els.operand2Max.value, base.operand2, 1);
    settings.rangesByTemplate[key] = { operand1: op1, operand2: op2 };
    els.operand1Min.value = op1.min; els.operand1Max.value = op1.max;
    els.operand2Min.value = op2.min; els.operand2Max.value = op2.max;
  }

  function escapeHtml(s) {
    return String(s || '').replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }

  function fluencyHeaderHtml() {
    if (!settings.timedFluency) return '';
    var target = parseInt(settings.fluencyTargetSeconds, 10);
    var targetHtml = (isFinite(target) && target > 0)
      ? '<span>Target: ' + target + ' seconds</span>'
      : '<span>Target: _____ seconds</span>';
    return '<div class="sheet-meta"><span>Start time: <span class="fill-line">&nbsp;</span></span>' +
      '<span>End time: <span class="fill-line">&nbsp;</span></span>' + targetHtml + '</div>';
  }

  function sheetTitleFor(label) {
    var base = escapeHtml(settings.sheetTitle || MathDrillTemplates.byKey(settings.templateKey).label);
    return label ? base + ' &mdash; ' + label : base;
  }

  function worksheetHtml(set) {
    var cols = settings.columns;
    var items = set.problems.map(function (p, i) {
      return '<div class="p"><span class="num">' + (i + 1) + '.</span>' +
        p.a + ' ' + p.symbol + ' ' + p.b + ' = _____</div>';
    }).join('');
    return (
      '<div class="sheet">' +
        '<div class="sheet-title">' + sheetTitleFor(set.label) + '</div>' +
        '<div class="sheet-meta"><span>Name: <span class="fill-line">&nbsp;</span></span><span>Date: ' + todayStr + '</span></div>' +
        fluencyHeaderHtml() +
        '<div class="problems" style="column-count:' + cols + ';">' + items + '</div>' +
      '</div>'
    );
  }

  function answersHtml(set) {
    var cols = settings.columns + 1;
    var items = set.problems.map(function (p, i) {
      return '<div class="a"><span class="num">' + (i + 1) + '.</span>' + p.answer + '</div>';
    }).join('');
    return (
      '<div class="sheet">' +
        '<div class="sheet-title">' + sheetTitleFor(set.label) + ' &mdash; Answer Key</div>' +
        '<div class="sheet-meta"><span>&nbsp;</span><span>Date: ' + todayStr + '</span></div>' +
        '<div class="answers" style="column-count:' + cols + ';">' + items + '</div>' +
      '</div>'
    );
  }

  function renderVersionTabs() {
    els.versionTabs.innerHTML = '';
    if (problemSets.length <= 1) { els.versionTabs.style.display = 'none'; return; }
    els.versionTabs.style.display = '';
    problemSets.forEach(function (set, i) {
      var b = document.createElement('button');
      b.type = 'button';
      b.className = 'secondary' + (i === currentVersionIndex ? ' active' : '');
      b.textContent = set.label;
      b.addEventListener('click', function () { currentVersionIndex = i; renderVersionTabs(); renderPreview(); });
      els.versionTabs.appendChild(b);
    });
  }

  function renderPreview() {
    var set = problemSets[currentVersionIndex];
    els.previewArea.innerHTML = view === 'worksheet' ? worksheetHtml(set) : answersHtml(set);
    els.previewNote.textContent = (view === 'worksheet'
      ? 'Worksheet preview — ' + set.problems.length + ' problems.'
      : 'Answer key preview — matches the current worksheet exactly.') +
      (problemSets.length > 1 ? ' (' + set.label + ', ' + problemSets.length + ' versions total.)' : '');
    els.printBtn.textContent = problemSets.length > 1
      ? 'Print all ' + problemSets.length + ' versions'
      : 'Print (both pages)';
  }

  function readFormIntoSettings() {
    settings.templateKey = els.templateKey.value;
    settings.sheetTitle = els.sheetTitle.value;
    settings.problemCount = Math.max(5, Math.min(100, parseInt(els.problemCount.value, 10) || 30));
    settings.columns = Math.max(1, Math.min(6, parseInt(els.columns.value, 10) || 3));
    settings.versions = Math.max(1, Math.min(6, parseInt(els.versionCount.value, 10) || 1));
    settings.timedFluency = els.timedFluency.checked;
    settings.fluencyTargetSeconds = els.fluencyTargetSeconds.value;
  }

  function generate() {
    readFormIntoSettings();
    persist();
    var template = effectiveTemplate(settings.templateKey);
    problemSets = [];
    for (var i = 0; i < settings.versions; i++) {
      problemSets.push({
        label: settings.versions > 1 ? 'Version ' + String.fromCharCode(65 + i) : null,
        problems: MathDrillGenerate.generateProblems(template, settings.problemCount)
      });
    }
    currentVersionIndex = 0;
    renderVersionTabs();
    renderPreview();
  }

  function buildPrintArea() {
    var html = problemSets.map(function (set) {
      return worksheetHtml(set) + answersHtml(set);
    }).join('');
    document.getElementById('printArea').innerHTML = html;
  }

  /* ---------- settings export / import ---------- */
  function isPlausibleSettings(obj) {
    return !!obj && typeof obj === 'object' &&
      typeof obj.templateKey === 'string' &&
      (typeof obj.problemCount === 'number' || typeof obj.problemCount === 'string') &&
      (typeof obj.columns === 'number' || typeof obj.columns === 'string');
  }

  function exportSettings() {
    readFormIntoSettings();
    var blob = new Blob([JSON.stringify(settings, null, 2)], { type: 'application/json' });
    var url = URL.createObjectURL(blob);
    var a = document.createElement('a');
    a.href = url;
    a.download = 'math-drill-settings.json';
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(url);
  }

  function applyImportedSettings(obj) {
    els.templateKey.value = MathDrillTemplates.byKey(obj.templateKey).key;
    els.sheetTitle.value = typeof obj.sheetTitle === 'string' ? obj.sheetTitle : '';
    els.problemCount.value = obj.problemCount;
    els.columns.value = obj.columns;
    els.versionCount.value = Math.max(1, Math.min(6, parseInt(obj.versions, 10) || 1));
    settings.rangesByTemplate = (obj.rangesByTemplate && typeof obj.rangesByTemplate === 'object') ? obj.rangesByTemplate : {};
    els.timedFluency.checked = !!obj.timedFluency;
    els.fluencyTargetRow.style.display = els.timedFluency.checked ? '' : 'none';
    els.fluencyTargetSeconds.value = typeof obj.fluencyTargetSeconds === 'string' || typeof obj.fluencyTargetSeconds === 'number' ? obj.fluencyTargetSeconds : '';
    loadRangeInputs();
    generate();
  }

  function importSettingsFromFile(file) {
    var reader = new FileReader();
    reader.onload = function () {
      var parsed = null;
      try { parsed = JSON.parse(reader.result); } catch (e) { parsed = null; }
      if (!isPlausibleSettings(parsed)) {
        alert('That file doesn\'t look like a math drill settings file.');
      } else {
        applyImportedSettings(parsed);
      }
      els.importSettingsFile.value = '';
    };
    reader.onerror = function () {
      alert('Could not read that file.');
      els.importSettingsFile.value = '';
    };
    reader.readAsText(file);
  }

  /* ---------- wiring ---------- */
  els.generateBtn.addEventListener('click', generate);
  els.templateKey.addEventListener('change', function () { loadRangeInputs(); generate(); });
  els.sheetTitle.addEventListener('input', function () { readFormIntoSettings(); persist(); renderPreview(); });
  els.problemCount.addEventListener('change', generate);
  els.columns.addEventListener('change', function () { readFormIntoSettings(); persist(); renderPreview(); });
  els.versionCount.addEventListener('change', generate);

  ['operand1Min','operand1Max','operand2Min','operand2Max'].forEach(function (id) {
    els[id].addEventListener('change', function () { readRangeInputs(); generate(); });
  });
  els.resetRangeBtn.addEventListener('click', function () {
    delete settings.rangesByTemplate[els.templateKey.value];
    loadRangeInputs();
    generate();
  });

  els.timedFluency.addEventListener('change', function () {
    els.fluencyTargetRow.style.display = els.timedFluency.checked ? '' : 'none';
    readFormIntoSettings(); persist(); renderPreview();
  });
  els.fluencyTargetSeconds.addEventListener('input', function () { readFormIntoSettings(); persist(); renderPreview(); });

  els.viewWorksheetBtn.addEventListener('click', function () {
    view = 'worksheet';
    els.viewWorksheetBtn.classList.add('active');
    els.viewAnswersBtn.classList.remove('active');
    renderPreview();
  });
  els.viewAnswersBtn.addEventListener('click', function () {
    view = 'answers';
    els.viewAnswersBtn.classList.add('active');
    els.viewWorksheetBtn.classList.remove('active');
    renderPreview();
  });

  els.printBtn.addEventListener('click', function () {
    buildPrintArea();
    window.print();
  });

  els.exportSettingsBtn.addEventListener('click', exportSettings);
  els.importSettingsBtn.addEventListener('click', function () { els.importSettingsFile.click(); });
  els.importSettingsFile.addEventListener('change', function () {
    var file = els.importSettingsFile.files && els.importSettingsFile.files[0];
    if (file) importSettingsFromFile(file);
  });

  /* ---------- boot ---------- */
  buildTemplateOptions();
  loadSaved();
  els.templateKey.value = settings.templateKey;
  els.sheetTitle.value = settings.sheetTitle;
  els.problemCount.value = settings.problemCount;
  els.columns.value = settings.columns;
  els.versionCount.value = settings.versions || 1;
  els.timedFluency.checked = !!settings.timedFluency;
  els.fluencyTargetRow.style.display = els.timedFluency.checked ? '' : 'none';
  els.fluencyTargetSeconds.value = settings.fluencyTargetSeconds || '';
  loadRangeInputs();
  generate();
})();
</script>
<script>
if ('serviceWorker' in navigator) {
  window.addEventListener('load', function () {
    navigator.serviceWorker.register('../sw.js').catch(function () {});
  });
}
</script>
</body>
</html>
