<style>
  :root {
    --ink: #1f2430; --paper: #fafaf8; --card: #fff;
    --line: #dcdad2; --line-strong: #c3c0b6;
    --accent: #1f3550; --accent-2: #2e6b8f; --muted: #6b6a63;
  }
  * { box-sizing: border-box; }
  body {
    font-family: "Segoe UI", Georgia, "Times New Roman", serif;
    background: var(--paper); color: var(--ink); margin: 0;
    padding: 24px 20px 100px; line-height: 1.45;
  }
  .wrap { max-width: 900px; margin: 0 auto; }
  .app-header { display: flex; align-items: baseline; justify-content: space-between; gap: 1rem; flex-wrap: wrap; margin-bottom: 1.4rem; }
  .app-header h1 { font-size: 1.7rem; margin: 0 0 .2rem; }
  .back-link { color: var(--muted); text-decoration: none; font-size: .88rem; }
  .back-link:hover { color: var(--accent-2); }

  .header-actions { display: flex; align-items: center; }
  .fs-btn {
    font-size: .85rem; font-weight: 700; padding: .5rem .9rem; border-radius: 7px;
    background: #fff; color: var(--muted); border: 1px solid var(--line-strong);
  }
  .fs-btn:hover { color: var(--accent-2); border-color: var(--accent-2); background: #fff; }

  .controls { display: flex; flex-wrap: wrap; gap: .8rem; align-items: center; margin-bottom: 1.2rem; }
  .band-tabs, .genre-select { display: flex; gap: .4rem; flex-wrap: wrap; }
  .pill {
    padding: .5rem 1rem; border: 1px solid var(--line-strong); border-radius: 999px;
    background: #fff; cursor: pointer; font-weight: 700; font-size: .85rem; color: var(--muted);
  }
  .pill.active { color: #fff; background: var(--accent); border-color: var(--accent); }

  select {
    font-family: inherit; font-size: .9rem; padding: .5rem .7rem; border: 1px solid var(--line-strong);
    border-radius: 7px; background: #fff; color: var(--ink);
  }

  .stage {
    background: var(--card); border: 1px solid var(--line); border-radius: 14px;
    padding: 3rem 2rem; text-align: center; margin-bottom: 1.2rem; min-height: 14rem;
    display: flex; align-items: center; justify-content: center;
  }
  .stage .prompt-text { font-size: clamp(1.4rem, 4vw, 2.1rem); font-weight: 600; max-width: 44rem; }
  .stage .empty { color: var(--muted); font-size: 1.1rem; }
  .stage:fullscreen { width: 100vw; height: 100vh; border-radius: 0; }

  .meta-row { display: flex; justify-content: center; gap: .5rem; margin-bottom: 1.4rem; flex-wrap: wrap; }
  .meta-row .tag {
    font-family: Consolas, monospace; font-size: .72rem; letter-spacing: .05em; text-transform: uppercase;
    color: var(--muted); border: 1px solid var(--line-strong); border-radius: 4px; padding: .2rem .5rem;
  }

  button {
    font-family: inherit; font-size: 1rem; font-weight: 700; cursor: pointer;
    background: var(--accent); color: #fff; border: 1px solid var(--accent);
    border-radius: 8px; padding: .8rem 1.6rem;
  }
  button:hover { background: var(--accent-2); border-color: var(--accent-2); }

  .generate-row { text-align: center; margin-bottom: 1.6rem; }

  .history { border-top: 1px solid var(--line); padding-top: 1rem; }
  .history h2 { font-size: .78rem; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); margin: 0 0 .6rem; }
  .history ol { margin: 0; padding-left: 1.3rem; color: var(--muted); font-size: .88rem; max-height: 16rem; overflow-y: auto; }
  .history li { margin-bottom: .3rem; }
  .history .hist-date {
    font-family: Consolas, monospace; font-size: .72rem; color: var(--muted);
    border: 1px solid var(--line-strong); border-radius: 4px; padding: .05rem .35rem; margin-right: .4rem;
  }

  footer.note { color: var(--muted); font-size: .82rem; margin-top: 2rem; text-align: center; }

<body>
<div class="wrap">

  <div class="app-header">
    <div>
      <a class="back-link" href="../index.html">&larr; Toolkit</a>
      <h1>Writing Prompt Generator</h1>
    </div>
    <div class="header-actions">
      <button type="button" class="fs-btn" id="fullscreenBtn" title="Toggle fullscreen (F)">&#9970; Fullscreen</button>
    </div>
  </div>

  <div class="controls">
    <div class="band-tabs" id="bandTabs">
      <div class="pill active" data-band="ms">Middle School</div>
      <div class="pill active" data-band="hs">High School</div>
    </div>
    <select id="genreSelect"></select>
  </div>

  <div class="stage" id="stage" data-a11y-read>
    <p class="empty">Press Generate to get a prompt.</p>
  </div>

  <div class="meta-row" id="metaRow"></div>

  <div class="generate-row">
    <button type="button" id="generateBtn">Generate a prompt</button>
  </div>

  <div class="history">
    <h2>Prompt history</h2>
    <ol id="historyList"></ol>
  </div>

  <footer class="note">
    Runs entirely in your browser &mdash; nothing is uploaded. 200 prompts across 5 genres, split by grade band.
  </footer>

</div>

<script>
(function () {
  'use strict';

  var els = {};
  ['bandTabs','genreSelect','stage','metaRow','generateBtn','historyList','fullscreenBtn'].forEach(function (id) {
    els[id] = document.getElementById(id);
  });

  var settings = { bands: ['ms', 'hs'], genre: 'all' };
  var history = []; // {band, genre, text, date} — persisted across sessions, newest first
  var HISTORY_LIMIT = 200; // keep a school-year's worth of entries without growing unbounded
  var AVOID_REPEAT_WINDOW = 6;

  function todayStr() {
    var d = new Date();
    function pad(n) { return n < 10 ? '0' + n : '' + n; }
    return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate());
  }

  function loadSaved() {
    var saved = WritingPromptStore.load();
    var validBands = Object.keys(WritingPrompts.PROMPTS); // ['ms','hs']
    var validGenres = WritingPrompts.GENRES.map(function (g) { return g.key; });
    if (saved && Array.isArray(saved.bands)) {
      var bands = saved.bands.filter(function (b) { return validBands.indexOf(b) !== -1; });
      if (bands.length) settings.bands = bands;
    }
    if (saved && saved.genre && (saved.genre === 'all' || validGenres.indexOf(saved.genre) !== -1)) {
      settings.genre = saved.genre;
    }

    var savedHistory = WritingPromptStore.loadHistory();
    var isDate = function (s) { return typeof s === 'string' && /^\d{4}-\d{2}-\d{2}$/.test(s); };
    history = savedHistory.filter(function (h) {
      return h && typeof h.text === 'string' &&
        validBands.indexOf(h.band) !== -1 &&
        validGenres.indexOf(h.genre) !== -1 &&
        isDate(h.date);
    }).slice(0, HISTORY_LIMIT);
  }
  function persist() { WritingPromptStore.save(settings); }
  function persistHistory() { WritingPromptStore.saveHistory(history); }

  function buildGenreSelect() {
    var allOpt = document.createElement('option');
    allOpt.value = 'all'; allOpt.textContent = 'All genres';
    els.genreSelect.appendChild(allOpt);
    WritingPrompts.GENRES.forEach(function (g) {
      var opt = document.createElement('option');
      opt.value = g.key; opt.textContent = g.label;
      els.genreSelect.appendChild(opt);
    });
    els.genreSelect.value = settings.genre;
  }

  function applyBandTabs() {
    Array.prototype.slice.call(els.bandTabs.querySelectorAll('.pill')).forEach(function (p) {
      p.classList.toggle('active', settings.bands.indexOf(p.dataset.band) !== -1);
    });
  }

  function genreLabel(key) {
    if (key === 'all') return 'All genres';
    var g = WritingPrompts.GENRES.filter(function (x) { return x.key === key; })[0];
    return g ? g.label : key;
  }

  function pool() {
    var genres = settings.genre === 'all' ? WritingPrompts.GENRES.map(function (g) { return g.key; }) : [settings.genre];
    var bands = settings.bands.length ? settings.bands : ['ms', 'hs'];
    var items = [];
    bands.forEach(function (band) {
      genres.forEach(function (genre) {
        WritingPrompts.PROMPTS[band][genre].forEach(function (text) {
          items.push({ band: band, genre: genre, text: text });
        });
      });
    });
    return items;
  }

  function recentTexts() {
    return history.slice(0, AVOID_REPEAT_WINDOW).map(function (h) { return h.text; });
  }

  function generate() {
    var items = pool();
    if (!items.length) {
      els.stage.innerHTML = '<p class="empty">Pick at least one grade band.</p>';
      return;
    }
    var avoid = recentTexts();
    var candidates = items.filter(function (i) { return avoid.indexOf(i.text) === -1; });
    if (!candidates.length) candidates = items; // pool smaller than the avoid-repeat window
    var pick = candidates[Math.floor(Math.random() * candidates.length)];
    pick = { band: pick.band, genre: pick.genre, text: pick.text, date: todayStr() };

    history.unshift(pick);
    history = history.slice(0, HISTORY_LIMIT);
    persistHistory();

    els.stage.innerHTML = '<p class="prompt-text">' + escapeHtml(pick.text) + '</p>';
    els.metaRow.innerHTML =
      '<span class="tag">' + (pick.band === 'ms' ? 'Middle School' : 'High School') + '</span>' +
      '<span class="tag">' + escapeHtml(genreLabel(pick.genre)) + '</span>';

    renderHistory();
  }

  function renderHistory() {
    els.historyList.innerHTML = history.map(function (h) {
      return '<li><span class="hist-date">' + escapeHtml(h.date) + '</span>' + escapeHtml(h.text) + '</li>';
    }).join('');
  }

  function escapeHtml(s) {
    return String(s || '').replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }

  function updateFullscreenLabel() {
    var active = document.fullscreenElement === els.stage;
    els.fullscreenBtn.innerHTML = active ? '&#10530; Exit Fullscreen' : '&#9970; Fullscreen';
  }

  function toggleFullscreen() {
    if (document.fullscreenElement) document.exitFullscreen();
    else if (els.stage.requestFullscreen) els.stage.requestFullscreen();
  }

  /* ---------- wiring ---------- */
  Array.prototype.slice.call(els.bandTabs.querySelectorAll('.pill')).forEach(function (p) {
    p.addEventListener('click', function () {
      var band = p.dataset.band;
      var idx = settings.bands.indexOf(band);
      if (idx === -1) settings.bands.push(band);
      else if (settings.bands.length > 1) settings.bands.splice(idx, 1); // keep at least one selected
      applyBandTabs();
      persist();
    });
  });

  els.genreSelect.addEventListener('change', function () {
    settings.genre = els.genreSelect.value;
    persist();
  });

  els.generateBtn.addEventListener('click', generate);

  els.fullscreenBtn.addEventListener('click', toggleFullscreen);
  document.addEventListener('fullscreenchange', updateFullscreenLabel);

  document.addEventListener('keydown', function (e) {
    if (e.code === 'Space' && document.activeElement.tagName !== 'SELECT') {
      e.preventDefault();
      generate();
      return;
    }
    if ((e.key === 'f' || e.key === 'F') && !e.ctrlKey && !e.metaKey && !e.altKey) {
      var tag = (document.activeElement && document.activeElement.tagName) || '';
      if (tag === 'SELECT' || tag === 'INPUT' || tag === 'TEXTAREA') return;
      toggleFullscreen();
    }
  });

  /* ---------- boot ---------- */
  loadSaved();
  buildGenreSelect();
  applyBandTabs();
  renderHistory();
})();
</script>
<script>
if ('serviceWorker' in navigator) {
  window.addEventListener('load', function () {
    navigator.serviceWorker.register('../sw.js').catch(function () {});
  });
}
</script>
</body>
