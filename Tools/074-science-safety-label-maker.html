<!-- Native dark comes from _shared/ink-paper.css's [data-theme="dark"] block;
     opting in here keeps a11y.js from putting its CSS-filter invert on top.
     The printed labels are built into #printArea, which is paper.
     Read ink-paper.css's header before copying this into another tool. -->

<style>
  /* Path 5 P3. The ten safety symbols are drawn in currentColor and coloured
     by SYMBOLS[].color below, which is on screen in the picker and the queue
     and on the printed label. Seven of the ten hues ARE ink-paper's light
     values exactly (--err #a3372b, --ink #1f2430, --muted #6b6a63,
     --accent-2 #2e6b8f), so those symbols just use the token and flip with
     the theme for free. These three have no token; the dark values keep the
     hue and raise the lightness so a near-black card does not swallow them.
     #printArea is a sheet of paper, so it restores the light three the same
     way ink-paper.css restores its own. */
  :root {
    /* The two tint pairs the share note sits on, in 001's values with dark
       counterparts — ink-paper.css has no token for either. */
    --err-bg: #fbecea; --err-line: #e6c6c1; --info-bg: #eaf1f5; --info-line: #c9dbe3;
    --sym-corrosive-light: #c07a1a;
    --sym-biohazard-light: #2c6e3f;
    --sym-electrical-light: #c9a400;
    --sym-corrosive: var(--sym-corrosive-light);
    --sym-biohazard: var(--sym-biohazard-light);
    --sym-electrical: var(--sym-electrical-light);
  }
  :root[data-theme="dark"]:not(.a11y-filter-dark) {
    --err-bg: #3a201c; --err-line: #6d3a33; --info-bg: #1b2a35; --info-line: #33505f;
    --sym-corrosive: #e0a94e;
    --sym-biohazard: #63c08e;
    --sym-electrical: #e3c344;
  }
  :root[data-theme="dark"]:not(.a11y-filter-dark) #printArea:not(.paper-sheet-off) {
    --sym-corrosive: var(--sym-corrosive-light);
    --sym-biohazard: var(--sym-biohazard-light);
    --sym-electrical: var(--sym-electrical-light);
  }
  /* Share a label sheet: the sheet itself is _shared/share.js (Path 6 P3).
     This is only the note under the toolbar that records what it last did. */
  .share-note { font-size: .8rem; line-height: 1.5; margin: .6rem 0 0; padding: .5rem .7rem;
    border-radius: 6px; background: var(--info-bg); border: 1px solid var(--info-line); word-break: break-word; }
  .share-note.error { background: var(--err-bg); border-color: var(--err); }
  * { box-sizing: border-box; }
  body {
    font-family: "Segoe UI", Georgia, "Times New Roman", serif;
    background: var(--paper); color: var(--ink); margin: 0;
    padding: 24px 20px 100px; line-height: 1.45;
  }
  .wrap { max-width: 1200px; margin: 0 auto; }
  .app-header h1 { font-size: 1.7rem; margin: 0 0 .2rem; }
  .app-header .sub { color: var(--muted); font-size: .88rem; margin: 0; }
  .back-link { color: var(--muted); text-decoration: none; font-size: .88rem; }
  .back-link:hover { color: var(--accent-2); }

  .card h2 { font-size: 1rem; margin: 0 0 .7rem; }
  label { display: block; font-weight: 600; font-size: .82rem; margin-bottom: .3rem; }
  input[type="text"], input[type="number"] {
    width: 100%; font-family: inherit; font-size: .9rem; color: var(--ink);
    background: var(--card); border: 1px solid var(--line-strong); border-radius: 6px;
    padding: .45rem .55rem; margin-bottom: .6rem;
  }
  .add-grid { display: grid; grid-template-columns: 1fr 1fr auto; gap: .6rem; align-items: end; }
  .add-grid.editing { outline: 2px solid var(--accent-2); outline-offset: 6px; border-radius: 8px; }
  .editing-note { font-size: .78rem; color: var(--accent-2); font-weight: 600; margin: -.3rem 0 .6rem; }
  select#sizeSelect { width: auto; font-family: inherit; font-size: .85rem; padding: .35rem .5rem; border: 1px solid var(--line-strong); border-radius: 6px; background: var(--card); color: var(--ink); }

  .symbol-picker { display: flex; flex-wrap: wrap; gap: .5rem; margin-bottom: .8rem; }
  /* `color` is set here on purpose: .symbol-btn is a <button>, so without it
     the label under each icon inherited the accent button's white ink and
     was white on a white card — invisible in light since the tool shipped. */
  .symbol-btn { display: flex; flex-direction: column; align-items: center; gap: .2rem; padding: .5rem .4rem; border: 2px solid var(--line-strong); border-radius: 8px; background: var(--card); color: var(--ink); cursor: pointer; width: 5.2rem; }
  .symbol-btn.selected { border-color: var(--accent); background: var(--card-2); }
  .symbol-btn svg { width: 28px; height: 28px; }
  .symbol-btn span { font-size: .68rem; text-align: center; }

  button {
    font-family: inherit; font-size: .92rem; font-weight: 600; cursor: pointer;
    background: var(--accent); color: var(--accent-ink); border: 1px solid var(--accent);
    border-radius: 7px; padding: .55rem 1rem;
  }
  button:hover { background: var(--accent-2); border-color: var(--accent-2); }
  button.secondary { background: var(--card); color: var(--ink); border-color: var(--line-strong); }
  button.secondary:hover { background: var(--card-2); border-color: var(--muted); color: var(--ink); }
  button.danger { background: var(--card); color: var(--err); border-color: var(--err); }
  button.danger:hover { background: var(--err); color: var(--accent-ink); }
  button.small { padding: .2rem .5rem; font-size: .76rem; }
  .btnrow { display: flex; gap: .6rem; flex-wrap: wrap; }

  .queue-row { display: flex; align-items: center; gap: .6rem; padding: .4rem 0; border-bottom: 1px dashed var(--line); }
  .queue-row:last-child { border-bottom: none; }
  .queue-row svg { width: 24px; height: 24px; flex-shrink: 0; }
  .queue-row .qtext { flex: 1; font-size: .88rem; }
  .queue-row .qty { color: var(--muted); font-size: .8rem; }

  .label-grid { display: grid; gap: .2in; }
  .label-grid.size-small { grid-template-columns: repeat(4, 1fr); }
  .label-grid.size-medium { grid-template-columns: repeat(3, 1fr); }
  .label-grid.size-large { grid-template-columns: repeat(2, 1fr); }
  .label-card { border: 1.5px solid #333; border-radius: 6px; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: .15in; text-align: center; page-break-inside: avoid; }
  .label-grid.size-small .label-card { height: 1.5in; }
  .label-grid.size-medium .label-card { height: 2in; }
  .label-grid.size-large .label-card { height: 2.75in; }
  .label-card svg { width: 44px; height: 44px; margin-bottom: .1in; }
  .label-grid.size-large .label-card svg { width: 60px; height: 60px; }
  .label-card .ltext { font-weight: 700; font-size: .95rem; }

</style>
</head>
<body>
<div class="wrap">
  <div class="app-header">
    <div>
      <a class="back-link" href="../index.html">&larr; Toolkit</a>
      <h1>Science Safety Symbol &amp; Equipment Label Maker</h1>
      <p class="sub">Pick a hazard symbol, add your storage/bin text, print a sheet of labels.</p>
    </div>
    <div class="btnrow">
      <label style="margin:0;" for="sizeSelect">Label size</label>
      <select id="sizeSelect">
        <option value="small">Small (4/row)</option>
        <option value="medium" selected>Medium (3/row)</option>
        <option value="large">Large (2/row)</option>
      </select>
      <button type="button" class="secondary" id="shareBtn">&#128279; Share labels&hellip;</button>
      <button class="secondary" id="printBtn">Print labels</button>
    </div>
  </div>
  <p id="shareNote" class="share-note" style="display:none;" aria-live="polite"></p>

  <div class="card">
    <h2>Choose a symbol</h2>
    <div class="symbol-picker" id="symbolPicker"></div>
    <p class="editing-note" id="editingNote" style="display:none;">Editing a queued label &mdash; make changes then click "Save changes", or <a href="#" id="cancelEditLink">cancel</a>.</p>
    <div class="add-grid" id="addGrid">
      <div><label for="labelText">Label text</label><input type="text" id="labelText" placeholder="e.g. Acids Only"></div>
      <div><label for="labelQty">Copies</label><input type="number" id="labelQty" value="1" min="1" max="30"></div>
      <div><button id="addLabelBtn">Add to sheet</button></div>
    </div>
  </div>

  <div class="card">
    <h2>Labels queued (<span id="queueCount">0</span>)</h2>
    <div id="queueWrap"></div>
  </div>
</div>

<div id="printArea"></div>

<script>
(function () {
  'use strict';
  var STORE_KEY = 'sslm_queue_v1';

  var SYMBOLS = [
    { key: 'flammable', name: 'Flammable', color: 'var(--err)', path: '<path d="M16 4c-3 6-9 8-9 15a9 9 0 0018 0c0-5-3-6-3-10-2 3-3 4-3 6a3 3 0 01-6 0c0-4 2-6 3-11z" fill="currentColor"/>' },
    { key: 'corrosive', name: 'Corrosive', color: 'var(--sym-corrosive)', path: '<path d="M8 6h6l-1 8h-4z" fill="currentColor"/><path d="M6 22c0-3 2-5 2-5h4c0 0 2 2 2 5a4 4 0 01-8 0z" fill="currentColor"/><path d="M18 10h8v3l-2 12h-4l-2-12z" fill="currentColor" opacity=".7"/>' },
    { key: 'toxic', name: 'Toxic / Poison', color: 'var(--ink)', path: '<circle cx="16" cy="16" r="10" fill="none" stroke="currentColor" stroke-width="2"/><path d="M11 12a5 5 0 0010 0M11 20a5 5 0 0010 0" fill="none" stroke="currentColor" stroke-width="2"/><circle cx="16" cy="16" r="2" fill="currentColor"/>' },
    { key: 'biohazard', name: 'Biohazard', color: 'var(--sym-biohazard)', path: '<circle cx="16" cy="9" r="3.4" fill="none" stroke="currentColor" stroke-width="2"/><circle cx="10" cy="20" r="3.4" fill="none" stroke="currentColor" stroke-width="2"/><circle cx="22" cy="20" r="3.4" fill="none" stroke="currentColor" stroke-width="2"/><circle cx="16" cy="16" r="2" fill="currentColor"/>' },
    { key: 'electrical', name: 'Electrical Hazard', color: 'var(--sym-electrical)', path: '<path d="M18 4L8 18h6l-2 10 12-16h-7z" fill="currentColor"/>' },
    { key: 'sharp', name: 'Sharp Objects', color: 'var(--muted)', path: '<path d="M8 24l14-14 3 3-14 14z" fill="currentColor"/><path d="M8 24l-2 4 4-2z" fill="currentColor"/>' },
    { key: 'eyeprotect', name: 'Eye Protection', color: 'var(--accent-2)', path: '<ellipse cx="11" cy="16" rx="5" ry="4" fill="none" stroke="currentColor" stroke-width="2"/><ellipse cx="21" cy="16" rx="5" ry="4" fill="none" stroke="currentColor" stroke-width="2"/><path d="M16 16h0" stroke="currentColor" stroke-width="2"/>' },
    { key: 'hot', name: 'Hot Surface', color: 'var(--err)', path: '<path d="M12 6c-1 3 1 4 1 6a3 3 0 006 0c0-1-1-2-1-3 1 1 3 3 3 6a5 5 0 01-10 0c0-3 1-6 1-9z" fill="none" stroke="currentColor" stroke-width="2"/>' },
    { key: 'fragile', name: 'Fragile', color: 'var(--accent-2)', path: '<path d="M11 5h10l-1 10a4 4 0 01-8 0z" fill="none" stroke="currentColor" stroke-width="2"/><path d="M16 15v6M12 26h8" stroke="currentColor" stroke-width="2"/>' },
    { key: 'none', name: 'Equipment (no symbol)', color: 'var(--muted)', path: '<rect x="7" y="9" width="18" height="14" rx="2" fill="none" stroke="currentColor" stroke-width="2"/>' }
  ];

  var els = {};
  ['symbolPicker', 'labelText', 'labelQty', 'addLabelBtn', 'queueWrap', 'queueCount', 'printBtn', 'printArea', 'sizeSelect', 'editingNote', 'addGrid', 'cancelEditLink',
   'shareBtn', 'shareNote'].forEach(function (id) {
    els[id] = document.getElementById(id);
  });

  var selectedSymbol = SYMBOLS[0].key;
  var queue = [];
  var labelSize = 'medium';
  var editingId = null;

  function uid() { return 'l' + Date.now().toString(36) + Math.random().toString(36).slice(2, 6); }
  function escapeHtml(s) {
    return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }
  function symbolByKey(key) { return SYMBOLS.find(function (s) { return s.key === key; }); }
  function svgFor(sym) { return '<svg viewBox="0 0 32 32" style="color:' + sym.color + '">' + sym.path + '</svg>'; }

  /** True when there was a sheet of labels here already — which is what tells
      an arriving share link whether it is about to replace somebody's work.
      An empty install seeds nothing, so an empty queue is the whole test. */
  function load() {
    var saved = null;
    try { saved = JSON.parse(localStorage.getItem(STORE_KEY) || '[]'); } catch (e) { saved = []; }
    if (Array.isArray(saved)) { queue = saved; labelSize = 'medium'; }
    else if (saved && Array.isArray(saved.queue)) { queue = saved.queue; labelSize = saved.labelSize || 'medium'; }
    else { queue = []; labelSize = 'medium'; }
    return queue.length > 0;
  }
  function save() {
    try { localStorage.setItem(STORE_KEY, JSON.stringify({ queue: queue, labelSize: labelSize })); } catch (e) { /* storage full/blocked */ }
  }

  function renderPicker() {
    els.symbolPicker.innerHTML = SYMBOLS.map(function (sym) {
      return '<button type="button" class="symbol-btn' + (sym.key === selectedSymbol ? ' selected' : '') + '" data-symbol="' + sym.key + '">' +
        svgFor(sym) + '<span>' + escapeHtml(sym.name) + '</span></button>';
    }).join('');
  }
  els.symbolPicker.addEventListener('click', function (ev) {
    var btn = ev.target.closest('.symbol-btn');
    if (!btn) return;
    selectedSymbol = btn.getAttribute('data-symbol');
    renderPicker();
  });

  function setEditing(id) {
    editingId = id;
    var editing = !!id;
    els.editingNote.style.display = editing ? 'block' : 'none';
    els.addGrid.classList.toggle('editing', editing);
    els.addLabelBtn.textContent = editing ? 'Save changes' : 'Add to sheet';
  }

  els.addLabelBtn.addEventListener('click', function () {
    var text = els.labelText.value.trim();
    if (!text) { alert('Add label text first.'); return; }
    var qty = Math.max(1, Math.min(30, parseInt(els.labelQty.value, 10) || 1));
    if (editingId) {
      var item = queue.find(function (q) { return q.id === editingId; });
      if (item) { item.symbol = selectedSymbol; item.text = text; item.qty = qty; }
      setEditing(null);
    } else {
      queue.push({ id: uid(), symbol: selectedSymbol, text: text, qty: qty });
    }
    save(); renderQueue();
    els.labelText.value = ''; els.labelQty.value = 1;
  });

  els.cancelEditLink.addEventListener('click', function (ev) {
    ev.preventDefault();
    setEditing(null);
    els.labelText.value = ''; els.labelQty.value = 1;
  });

  els.sizeSelect.addEventListener('change', function () {
    labelSize = els.sizeSelect.value;
    save();
  });

  function renderQueue() {
    els.queueCount.textContent = queue.length;
    var last = queue.length - 1;
    els.queueWrap.innerHTML = queue.map(function (item, i) {
      var sym = symbolByKey(item.symbol) || SYMBOLS[SYMBOLS.length - 1];
      return '<div class="queue-row">' + svgFor(sym) +
        '<span class="qtext">' + escapeHtml(item.text) + ' &mdash; <em>' + escapeHtml(sym.name) + '</em></span>' +
        '<span class="qty">&times;' + item.qty + '</span>' +
        '<button type="button" class="secondary small" data-move-up="' + item.id + '"' + (i === 0 ? ' disabled' : '') + ' title="Move up">&uarr;</button>' +
        '<button type="button" class="secondary small" data-move-down="' + item.id + '"' + (i === last ? ' disabled' : '') + ' title="Move down">&darr;</button>' +
        '<button type="button" class="secondary small" data-edit="' + item.id + '">Edit</button>' +
        '<button type="button" class="secondary small" data-dup="' + item.id + '">Duplicate</button>' +
        '<button type="button" class="danger small" data-del="' + item.id + '">Delete</button></div>';
    }).join('');
  }
  els.queueWrap.addEventListener('click', function (ev) {
    var editId = ev.target.getAttribute('data-edit');
    var dupId = ev.target.getAttribute('data-dup');
    var delId = ev.target.getAttribute('data-del');
    var upId = ev.target.getAttribute('data-move-up');
    var downId = ev.target.getAttribute('data-move-down');
    if (upId || downId) {
      // shelf-order printing: the queue's order IS the printed grid's order
      var mId = upId || downId;
      var idx = queue.findIndex(function (q) { return q.id === mId; });
      var swapWith = upId ? idx - 1 : idx + 1;
      if (idx === -1 || swapWith < 0 || swapWith >= queue.length) return;
      var tmp = queue[idx]; queue[idx] = queue[swapWith]; queue[swapWith] = tmp;
      save(); renderQueue();
      return;
    }
    if (editId) {
      var item = queue.find(function (q) { return q.id === editId; });
      if (!item) return;
      selectedSymbol = item.symbol;
      els.labelText.value = item.text;
      els.labelQty.value = item.qty;
      renderPicker();
      setEditing(editId);
      els.labelText.focus();
      return;
    }
    if (dupId) {
      var src = queue.find(function (q) { return q.id === dupId; });
      if (!src) return;
      queue.push({ id: uid(), symbol: src.symbol, text: src.text, qty: src.qty });
      save(); renderQueue();
      return;
    }
    if (!delId) return;
    if (editingId === delId) setEditing(null);
    queue = queue.filter(function (q) { return q.id !== delId; });
    save(); renderQueue();
  });

  els.printBtn.addEventListener('click', function () {
    if (!queue.length) { alert('Add at least one label first.'); return; }
    var cards = [];
    queue.forEach(function (item) {
      var sym = symbolByKey(item.symbol) || SYMBOLS[SYMBOLS.length - 1];
      for (var i = 0; i < item.qty; i++) {
        cards.push('<div class="label-card">' + svgFor(sym) + '<div class="ltext">' + escapeHtml(item.text) + '</div></div>');
      }
    });
    els.printArea.innerHTML = '<div class="label-grid size-' + labelSize + '">' + cards.join('') + '</div>';
    window.print();
  });

  /* ---------- share a label sheet: _shared/share.js (Path 6 P3) ----------
     One button opens the shared sheet — copy link, QR code (greyed out with
     the reason when the payload is too dense to scan), download .json, and
     the system share where the browser has one. A science department labels
     its storage cupboards the same way in every room, and until now the only
     way to pass that sheet on was to print it and photocopy it.

     The symbols themselves do not travel: each label carries its symbol KEY
     and the receiving page draws its own SVG for it, so a sheet shared from a
     build with a symbol this one does not have still prints, with those
     labels falling back to the plain equipment box rather than vanishing.

     This tool keeps ONE sheet, so an arriving link has nowhere to land except
     on top of what is here; it asks first, and only when `load()` found
     labels — an empty install has nothing to lose. */
  var SHARE_PARAM = 'labels';

  function setShareNote(text, isError) {
    els.shareNote.textContent = text || '';
    els.shareNote.style.display = text ? '' : 'none';
    els.shareNote.classList.toggle('error', !!isError);
  }

  Share.mount(els.shareBtn, {
    getState: function () { return { queue: queue, labelSize: labelSize }; },
    param: SHARE_PARAM,
    tool: 'science-safety-label-maker',
    title: 'Share these labels',
    noun: 'this label sheet',
    filename: 'safety labels',
    note: 'Every queued label travels — its text, its hazard symbol, how many copies of it to print and the printed label size — in the order they are stacked in. Opening it replaces the sheet on the receiving device, which is asked first.',
    successMessage: 'Link copied. Opening it on another device offers this whole label sheet in place of whatever is there.',
    onMessage: function (text, isError) { setShareNote(text, isError); }
  });

  function isPlausibleLabels(obj) {
    return !!obj && typeof obj === 'object' && Array.isArray(obj.queue);
  }

  var SIZES = { small: true, medium: true, large: true };

  /** Normalises an arrival. Ids are handed out locally — the queue's own
      order is what the printed grid follows and nothing refers to a label
      from outside it — and a symbol key this build does not know becomes the
      plain equipment box rather than an empty card. */
  function normalizeLabels(obj) {
    return {
      labelSize: SIZES[obj.labelSize] ? obj.labelSize : 'medium',
      queue: obj.queue.map(function (item) {
        item = item || {};
        var qty = parseInt(item.qty, 10);
        return {
          id: uid(),
          symbol: symbolByKey(item.symbol) ? item.symbol : 'none',
          text: String(item.text || ''),
          qty: (isFinite(qty) && qty >= 1) ? Math.min(qty, 30) : 1
        };
      }).filter(function (item) { return item.text.trim(); })
    };
  }

  function importSharedLabels(hadSaved) {
    return Share.receive({
      param: SHARE_PARAM,
      validate: isPlausibleLabels,
      onError: function (message) { setShareNote(message, true); },
      onState: function (decoded) {
        var incoming = normalizeLabels(decoded);
        if (hadSaved && !confirm('Replace the ' + queue.length + ' label' + (queue.length === 1 ? '' : 's') +
            ' on this device with the shared sheet (' + incoming.queue.length + ')?')) {
          setShareNote('Kept the labels already on this device. The shared sheet was not loaded.');
          return false;
        }
        queue = incoming.queue;
        labelSize = incoming.labelSize;
        save();
        setShareNote('Loaded a shared sheet of ' + queue.length + ' label' + (queue.length === 1 ? '' : 's') + '.');
        return true;
      }
    });
  }

  /* ---------- boot ---------- */
  var hadSaved = load();
  importSharedLabels(hadSaved);
  els.sizeSelect.value = labelSize;
  renderPicker();
  renderQueue();
})();
</script>
<script src="../_shared/sw-register.js" defer></script>
</body>
</html>
