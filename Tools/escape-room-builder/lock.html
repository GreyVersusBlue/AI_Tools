<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Escape Room — Lock Screen</title>
<meta name="description" content="Scan a station code, solve the clue, unlock the next one.">
<meta name="robots" content="noindex">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%23F6F7F9'/%3E%3Crect x='9' y='15' width='14' height='11' rx='2' fill='%232A6DB0'/%3E%3Cpath d='M12 15v-4a4 4 0 0 1 8 0v4' fill='none' stroke='%23C43A2F' stroke-width='2.4' stroke-linecap='round'/%3E%3Ccircle cx='16' cy='20' r='1.8' fill='%23F6F7F9'/%3E%3C/svg%3E">
<script src="../../_shared/a11y.js"></script>
<script src="../../_shared/webrtc-pair.js"></script>
<script src="../../_shared/vendor/qrcode/qrcode.js"></script>
<script src="er-match.js"></script>
<link rel="stylesheet" href="../../_shared/ink-paper.css">
<link rel="stylesheet" href="../../_shared/a11y.css">
<style>
  :root { --good: #2f6b3a; }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    font-family: "Segoe UI", Georgia, "Times New Roman", serif;
    background: var(--paper); color: var(--ink); margin: 0;
    min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center;
    padding: 1.5rem 1rem 2.5rem; line-height: 1.5;
  }
  .wrap { width: 100%; max-width: 460px; }
  .card {
    background: var(--card); border: 1px solid var(--line); border-radius: 14px;
    padding: 1.6rem 1.4rem; box-shadow: 0 6px 20px rgba(20,20,10,0.06);
  }
  .room-title { text-align: center; font-size: 1rem; font-weight: 700; color: var(--accent); letter-spacing: .02em; margin: 0 0 .3rem; }
  .station-badge {
    display: block; text-align: center; font-size: .74rem; text-transform: uppercase; letter-spacing: .08em;
    color: var(--muted); margin-bottom: 1rem;
  }
  .clue-box {
    background: #f4f3ee; border: 1px solid var(--line); border-radius: 10px;
    padding: 1.1rem 1.1rem; margin-bottom: 1.2rem; font-size: 1.15rem; line-height: 1.55;
    white-space: pre-line; overflow-wrap: anywhere;
  }
  .clue-image { display: block; width: 100%; max-height: 260px; object-fit: contain; border-radius: 8px; margin-bottom: .8rem; background: #fff; }
  label { display: block; font-weight: 600; font-size: .88rem; margin-bottom: .4rem; }
  input[type="text"] {
    width: 100%; font-family: inherit; font-size: 1.15rem; color: var(--ink);
    background: #fff; border: 2px solid var(--line-strong); border-radius: 8px;
    padding: .7rem .8rem; margin-bottom: .9rem;
  }
  input[type="text"]:focus { outline: none; border-color: var(--accent-2); }
  button {
    font-family: inherit; font-size: 1.05rem; font-weight: 700; cursor: pointer;
    background: var(--accent); color: #fff; border: 1px solid var(--accent);
    border-radius: 9px; padding: .8rem 1rem; width: 100%;
  }
  button:hover { background: var(--accent-2); border-color: var(--accent-2); }
  button.secondary {
    background: #fff; color: var(--accent); border-color: var(--line-strong);
    font-size: .85rem; font-weight: 600; padding: .55rem .8rem; margin-top: .6rem;
  }
  button.secondary:hover { background: #f1f0ea; color: var(--accent); }
  .feedback { font-size: .92rem; margin-top: .85rem; padding: .65rem .8rem; border-radius: 8px; display: none; }
  .feedback.show { display: block; }
  .feedback.bad { background: #fbeceA; color: var(--err); border: 1px solid #e6c6c1; }
  .feedback.good { background: #eaf5ec; color: var(--good); border: 1px solid #c7e2cb; }
  .hint-box {
    margin-top: .9rem; font-size: .88rem; color: var(--accent-2); background: #eef4f8;
    border: 1px solid #cfe0ea; border-radius: 8px; padding: .7rem .85rem; display: none;
  }
  .hint-box.show { display: block; }
  .gate-icon, .done-icon { text-align: center; font-size: 2.4rem; margin-bottom: .5rem; }
  .gate-text, .done-text { text-align: center; font-size: 1.05rem; line-height: 1.55; }
  .progress-note { text-align: center; font-size: .78rem; color: var(--muted); margin-top: 1rem; }
  .error-card { text-align: center; color: var(--muted); }
  .home-link { display: block; text-align: center; font-size: .76rem; color: var(--muted); text-decoration: none; margin-top: 1.2rem; }
  .home-link:hover { color: var(--accent-2); }
  .stars { text-align: center; letter-spacing: .3rem; font-size: 1.4rem; margin-bottom: .6rem; }
  .digit-row { display: flex; justify-content: center; gap: .5rem; margin-bottom: .9rem; }
  .digit-box {
    width: 2.6rem; height: 3rem; text-align: center; font-size: 1.6rem; font-weight: 700;
    font-family: Consolas, monospace; border: 2px solid var(--line-strong); border-radius: 8px;
    background: #fff; color: var(--ink);
  }
  .digit-box:focus { outline: none; border-color: var(--accent-2); }
  .cipher-box {
    font-family: Consolas, monospace; letter-spacing: .14em; font-size: 1.25rem; text-align: center;
    text-transform: uppercase; background: #f4f3ee; border: 1px dashed var(--line-strong); border-radius: 8px;
    padding: .9rem 1rem; margin: -.5rem 0 1.1rem; overflow-wrap: anywhere;
  }
  .letters-strip { text-align: center; font-size: .85rem; color: var(--muted); margin-bottom: .8rem; }
  .letters-strip .letter-box {
    display: inline-block; min-width: 1.4rem; padding: 0 .1rem; font-weight: 700; color: var(--accent);
    border-bottom: 2px solid var(--line-strong); margin: 0 .12rem;
  }
  .letters-strip .letter-box.filled { border-color: var(--accent-2); }
  .timer-banner {
    text-align: center; font-family: Consolas, monospace; font-weight: 700; font-size: 1.1rem; letter-spacing: .03em;
    background: var(--card); border: 1px solid var(--line); border-radius: 10px;
    padding: .6rem 1rem; margin-bottom: .8rem; color: var(--accent);
  }
  .timer-banner.low { color: var(--err); border-color: var(--err); }
  .timer-banner.done { color: #fff; background: var(--err); border-color: var(--err); }
  .monitor-toggle {
    display: block; width: 100%; background: none; border: none; color: var(--muted);
    font-size: .78rem; text-align: center; margin-top: 1rem; padding: .3rem; cursor: pointer;
  }
  .monitor-toggle:hover { color: var(--accent-2); }
  .monitor-box { display: none; margin-top: .6rem; padding-top: .8rem; border-top: 1px dashed var(--line); }
  .monitor-box.open { display: block; }
  .monitor-box p { font-size: .8rem; color: var(--muted); margin: 0 0 .5rem; }
  .monitor-box textarea {
    width: 100%; font-family: Consolas, monospace; font-size: .7rem; min-height: 3rem;
    border: 1px solid var(--line-strong); border-radius: 6px; padding: .5rem .6rem; margin-bottom: .5rem;
  }
  .monitor-box canvas { display: block; margin: 0 auto .5rem; max-width: 180px; width: 100%; }
  .monitor-status { font-size: .78rem; color: var(--muted); }
  .monitor-status.connected { color: var(--good); }
</style>
</head>
<body>
<div class="wrap">
  <div class="timer-banner" id="timerBanner" style="display:none;"></div>
  <div class="card" id="card">
    <p class="error-card">Loading…</p>
  </div>
  <a class="home-link" href="../../index.html">&larr; AsPerMyLessonPlan.com Toolkit</a>
</div>

<script>
(function () {
  "use strict";

  // ── Room data travels entirely inside the URL (no server, no accounts). ──
  // Encoding: base64( encodeURIComponent(JSON) ) via btoa(unescape(...)) so
  // it's unicode-safe and a bit shorter/denser in the QR code than raw
  // encodeURIComponent JSON would be. See 019-escape-room-builder.html for the
  // matching encode step.
  function decodeRoom(raw) {
    var jsonStr = decodeURIComponent(escape(atob(raw)));
    return JSON.parse(jsonStr);
  }

  function getParam(name) {
    var m = new RegExp('[?&]' + name + '=([^&]*)').exec(window.location.search);
    return m ? decodeURIComponent(m[1].replace(/\+/g, ' ')) : null;
  }

  // Answer matching lives in er-match.js, shared with the builder's teacher
  // test-run mode. Both pages have to agree exactly on whether a typed answer
  // is right, and a test run that used a second implementation would be
  // testing the wrong thing.
  var checkAnswer = window.EscapeRoomMatch.checkAnswer;

  function escapeHtml(s) { return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;'); }

  // Matching copy of 019-escape-room-builder.html's caesarEncode — see that
  // file's comment for why it's duplicated rather than shared.
  function caesarEncode(text, shift) {
    var sh = ((shift % 26) + 26) % 26;
    return String(text || '').replace(/[a-zA-Z]/g, function (ch) {
      var base = ch === ch.toUpperCase() ? 65 : 97;
      return String.fromCharCode((ch.charCodeAt(0) - base + sh) % 26 + base);
    });
  }

  var BASE_POINTS = 100;

  var card = document.getElementById('card');

  var rParam = getParam('r');
  if (!rParam) {
    card.innerHTML = '<p class="error-card">No escape room data found in this link. Ask your teacher for the real station QR code or link.</p>';
    return;
  }

  var room;
  try {
    room = decodeRoom(rParam);
    if (!room || !Array.isArray(room.stations) || !room.stations.length) throw new Error('empty room');
  } catch (e) {
    card.innerHTML = '<p class="error-card">This escape room link looks damaged or incomplete. Ask your teacher for a fresh QR code.</p>';
    return;
  }

  var roomId = room.id || 'room';
  var stationParamRaw = getParam('s');
  // If a station is embedded in this physical QR code, that's the station
  // this printed code represents. If absent, this is the generic "one link
  // for everyone" mode — always show whatever the player's own progress is.
  var scannedStation = stationParamRaw !== null ? parseInt(stationParamRaw, 10) : null;
  if (scannedStation !== null && (isNaN(scannedStation) || scannedStation < 0 || scannedStation >= room.stations.length)) {
    scannedStation = null;
  }

  // "start" marks this code as a valid entry point (set by the "randomize
  // starting station" toggle in the builder, one station per printed/shared
  // code) — a brand-new player seeds their progress at the scanned station
  // instead of the fixed first one, so a physical rotation can have teams
  // begin at different stations simultaneously. Absent by default, so a
  // first-time player without it still starts at station 0 as before.
  var startHere = getParam('start') !== null && scannedStation !== null;

  var PROGRESS_KEY = 'escape-room-progress:' + roomId;

  // How long a student is locked out of guessing again once a station's
  // attempt limit (`maxAttempts`, optional, teacher-configured) is reached by
  // consecutive wrong answers. Short enough not to stall a group out of the
  // activity, long enough to actually force a pause instead of guess-spamming.
  var LOCKOUT_MS = 30000;

  function loadProgress() {
    var fresh = { current: startHere ? scannedStation : 0, misses: {}, solved: {}, hintsUsed: {}, letters: {}, lockUntil: {} };
    try {
      var raw = localStorage.getItem(PROGRESS_KEY);
      if (!raw) return fresh;
      var p = JSON.parse(raw);
      if (!p || typeof p !== 'object') return fresh;
      if (typeof p.current === 'undefined') p.current = fresh.current;
      if (!p.misses || typeof p.misses !== 'object') p.misses = {};
      if (!p.solved || typeof p.solved !== 'object') p.solved = {};
      if (!p.hintsUsed || typeof p.hintsUsed !== 'object') p.hintsUsed = {};
      if (!p.letters || typeof p.letters !== 'object') p.letters = {};
      if (!p.lockUntil || typeof p.lockUntil !== 'object') p.lockUntil = {};
      return p;
    } catch (e) { return fresh; }
  }
  function saveProgress(p) {
    try { localStorage.setItem(PROGRESS_KEY, JSON.stringify(p)); } catch (e) { /* private browsing — progress just won't persist */ }
  }

  var progress = loadProgress();

  // Scoring only surfaces at all when some station actually charges points
  // for its hint — a plain riddle-chain room stays exactly as before.
  var hasScoring = room.stations.some(function (st) { return (st.hintCost || 0) > 0; });
  function computeScore() {
    var score = 0;
    Object.keys(progress.solved || {}).forEach(function () { score += BASE_POINTS; });
    Object.keys(progress.hintsUsed || {}).forEach(function (idx) {
      var st = room.stations[idx];
      if (st) score -= (st.hintCost || 0);
    });
    return score;
  }

  function lettersStripHtml() {
    var lettered = [];
    room.stations.forEach(function (st, i) { if (st.awardLetter) lettered.push(i); });
    if (!lettered.length) return '';
    var cells = lettered.map(function (i) {
      var got = progress.letters && progress.letters[i];
      return '<span class="letter-box' + (got ? ' filled' : '') + '">' + (got ? escapeHtml(got) : '_') + '</span>';
    }).join('');
    return '<div class="letters-strip">Letters collected: ' + cells + '</div>';
  }

  // ── R61: "Connect to teacher monitor" — one WebRTC data-channel pairing
  // per browser session (see monitor.html on the teacher's side). Lives in
  // module scope, not localStorage/progress, because the connection itself
  // can't survive a page reload without a server — it only persists across
  // in-page render() calls, which covers the common case (one shared link,
  // no re-scanning between stations). Re-scanning a fresh per-station
  // printed code reloads the page and drops the connection; the teacher
  // reconnects that device the same way.
  var monitorChannel = null;
  var monitorPendingPc = null;

  function monitorBoxHtml() {
    return '<button type="button" class="monitor-toggle" id="monitorToggle">📡 Connect to teacher monitor</button>' +
      '<div class="monitor-box" id="monitorBox">' +
        (monitorChannel && monitorChannel.readyState === 'open'
          ? '<p class="monitor-status connected">✓ Connected — your progress is visible on the teacher\'s screen.</p>'
          : '<p>Paste the code your teacher is showing on their monitor screen:</p>' +
            '<textarea id="monitorOfferInput" placeholder="Paste the teacher\'s code here…"></textarea>' +
            '<button type="button" id="monitorConnectBtn">Generate Reply Code</button>' +
            '<div id="monitorReplyWrap" style="display:none;margin-top:.6rem;">' +
              '<p>Show this reply code back to your teacher:</p>' +
              '<canvas id="monitorAnswerQr"></canvas>' +
              '<textarea id="monitorAnswerText" readonly></textarea>' +
            '</div>' +
            '<p class="monitor-status" id="monitorStatus"></p>') +
      '</div>';
  }

  function sendMonitorUpdate() {
    if (!monitorChannel || monitorChannel.readyState !== 'open') return;
    var done = progress.current === 'done';
    try {
      monitorChannel.send(JSON.stringify({
        station: done ? room.stations.length : progress.current,
        total: room.stations.length,
        done: done,
        score: hasScoring ? computeScore() : null,
      }));
    } catch (e) { /* channel not ready — next render()'s call will retry */ }
  }

  function wireMonitorBox() {
    var toggle = document.getElementById('monitorToggle');
    var box = document.getElementById('monitorBox');
    if (!toggle || !box) return;
    toggle.addEventListener('click', function () { box.classList.toggle('open'); });

    var connectBtn = document.getElementById('monitorConnectBtn');
    if (!connectBtn) return; // already connected — nothing more to wire
    connectBtn.addEventListener('click', function () {
      var offerPayload = document.getElementById('monitorOfferInput').value.trim();
      if (!offerPayload) return;
      var statusEl = document.getElementById('monitorStatus');
      statusEl.textContent = 'Generating reply code…';
      window.WebRTCPair.createAnswer(offerPayload, function (channel) {
        monitorChannel = channel;
        channel.addEventListener('open', function () {
          statusEl.textContent = 'Connected!';
          sendMonitorUpdate();
        });
        channel.addEventListener('close', function () { monitorChannel = null; });
      }).then(function (result) {
        monitorPendingPc = result.pc;
        document.getElementById('monitorAnswerText').value = result.answerPayload;
        drawLockQR(document.getElementById('monitorAnswerQr'), result.answerPayload);
        document.getElementById('monitorReplyWrap').style.display = '';
        statusEl.textContent = 'Show this code to your teacher, then wait…';
      }).catch(function (e) {
        statusEl.textContent = e.message || 'That code didn’t look right — ask your teacher for a fresh one.';
      });
    });
  }

  // Same drawing approach as Tools/classroom-timer/ct-mirror.js's drawQR.
  function drawLockQR(canvas, text) {
    var qr = window.qrcode(0, 'L');
    qr.addData(text);
    qr.make();
    var count = qr.getModuleCount();
    var quiet = 4;
    var total = count + quiet * 2;
    var px = 6;
    var size = total * px;
    canvas.width = size; canvas.height = size;
    var ctx = canvas.getContext('2d');
    ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, size, size);
    ctx.fillStyle = '#16222e';
    for (var r = 0; r < count; r++) {
      for (var c = 0; c < count; c++) {
        if (qr.isDark(r, c)) {
          var x0 = Math.round((quiet + c) * px), x1 = Math.round((quiet + c + 1) * px);
          var y0 = Math.round((quiet + r) * px), y1 = Math.round((quiet + r + 1) * px);
          ctx.fillRect(x0, y0, x1 - x0, y1 - y0);
        }
      }
    }
  }

  // ── Whole-room countdown (optional, baked into the link via `timerMinutes`) ─
  // There's no server/shared clock in this static toolkit, so each device's
  // countdown starts the moment that device first opens its own link, not a
  // synced room-wide start — a documented, deliberate approximation, not a bug.
  var timerBanner = document.getElementById('timerBanner');
  var timerInterval = null;

  function formatCountdown(totalSeconds) {
    var s = Math.max(0, Math.round(totalSeconds));
    var m = Math.floor(s / 60);
    var sec = s % 60;
    return m + ':' + (sec < 10 ? '0' : '') + sec;
  }

  function setupTimer() {
    if (timerInterval) { clearInterval(timerInterval); timerInterval = null; }
    var minutes = Number(room.timerMinutes);
    if (!minutes || !isFinite(minutes) || minutes <= 0) { timerBanner.style.display = 'none'; return; }
    if (!progress.startedAt) { progress.startedAt = Date.now(); saveProgress(progress); }
    timerBanner.style.display = '';
    timerBanner.classList.remove('done');
    function tick() {
      var remainingSec = minutes * 60 - (Date.now() - progress.startedAt) / 1000;
      if (remainingSec <= 0) {
        timerBanner.textContent = '⏰ Time’s up!';
        timerBanner.classList.remove('low');
        timerBanner.classList.add('done');
        clearInterval(timerInterval);
        timerInterval = null;
        return;
      }
      timerBanner.classList.toggle('low', remainingSec <= 60);
      timerBanner.textContent = '⏱ ' + formatCountdown(remainingSec) + ' remaining';
    }
    tick();
    timerInterval = setInterval(tick, 1000);
  }
  setupTimer();

  // The lockout countdown (see renderLockout) ticks via its own interval,
  // separate from the whole-room timer — cleared any time we navigate away
  // from the clue screen it belongs to so it can't keep firing into a
  // gate/done screen or a freshly-rendered next station.
  var lockoutInterval = null;
  function clearLockoutInterval() {
    if (lockoutInterval) { clearInterval(lockoutInterval); lockoutInterval = null; }
  }

  function render() {
    clearLockoutInterval();
    if (progress.current === 'done') {
      renderDone();
      return;
    }
    var current = progress.current;
    // Physical per-station QR mode: if this code isn't the player's current
    // target station, gate them off instead of revealing it early.
    if (scannedStation !== null && scannedStation !== current) {
      renderGate(current, scannedStation);
      return;
    }
    renderClue(current);
  }

  function renderGate(current, scanned) {
    var already = scanned < current;
    card.innerHTML =
      '<div class="gate-icon">' + (already ? '✅' : '🔒') + '</div>' +
      '<p class="room-title">' + escapeHtml(room.title || 'Escape Room') + '</p>' +
      '<p class="gate-text">' + (already
        ? 'You already solved this station. Your next clue is waiting at <strong>Station ' + (current + 1) + '</strong>.'
        : 'Not so fast — this isn’t your next station yet. Go find <strong>Station ' + (current + 1) + '</strong> and solve that clue first.') +
      '</p>';
  }

  function renderDone() {
    card.innerHTML =
      '<div class="stars">⭐ 🏆 ⭐</div>' +
      '<p class="room-title">' + escapeHtml(room.title || 'Escape Room') + '</p>' +
      '<div class="done-icon">🎉</div>' +
      '<p class="done-text"><strong>You escaped!</strong><br>Every station solved. Great work.' +
        (hasScoring ? '<br>Final score: ' + computeScore() : '') + '</p>' +
      lettersStripHtml() +
      '<button type="button" class="secondary" id="resetBtn">Restart this room</button>' +
      monitorBoxHtml();
    wireMonitorBox();
    sendMonitorUpdate();
    document.getElementById('resetBtn').addEventListener('click', function () {
      if (!confirm('Reset your progress on this escape room and start over from Station 1?')) return;
      progress = { current: 0, misses: {}, solved: {}, hintsUsed: {}, letters: {}, lockUntil: {} };
      saveProgress(progress);
      setupTimer();
      render();
    });
  }

  // ── Attempt limit / lockout ─────────────────────────────────────────────
  // A station can optionally set `maxAttempts` (teacher-configured in the
  // builder); once a student's consecutive wrong guesses on that station
  // reach it, they're locked out of guessing again for LOCKOUT_MS — a short,
  // ticking cooldown rather than a hard stop, so a stuck group is nudged to
  // slow down (and read the hint, if there is one) instead of guess-spamming.
  function renderLockout(idx, lockUntil) {
    var station = room.stations[idx];
    var secondsLeft = Math.max(0, Math.ceil((lockUntil - Date.now()) / 1000));
    card.innerHTML =
      '<p class="room-title">' + escapeHtml(room.title || 'Escape Room') + '</p>' +
      '<span class="station-badge">Station ' + (idx + 1) + ' of ' + room.stations.length + (hasScoring ? ' · Score: ' + computeScore() : '') + '</span>' +
      lettersStripHtml() +
      (station.image ? '<img class="clue-image" src="' + escapeHtml(station.image) + '" alt="Clue image">' : '') +
      '<div class="clue-box">' + escapeHtml(station.clue || '(no clue text)') + '</div>' +
      '<div class="feedback show bad">🔒 Too many misses in a row — locked out for <strong><span id="lockoutSeconds">' + secondsLeft + '</span>s</strong>.' +
        (station.hint ? ' Read the hint below while you wait.' : '') + '</div>' +
      (station.hint ? '<div class="hint-box show">💡 Hint: ' + escapeHtml(station.hint) + '</div>' : '') +
      '<p class="progress-note">Progress is saved on this device — re-scanning this code won’t lose your place.</p>' +
      monitorBoxHtml();
    wireMonitorBox();
    sendMonitorUpdate();
    clearLockoutInterval();
    lockoutInterval = setInterval(function () {
      var remaining = Math.max(0, Math.ceil((lockUntil - Date.now()) / 1000));
      var span = document.getElementById('lockoutSeconds');
      if (span) span.textContent = remaining;
      if (remaining <= 0) {
        clearLockoutInterval();
        progress.misses[idx] = 0;
        if (progress.lockUntil) delete progress.lockUntil[idx];
        saveProgress(progress);
        render();
      }
    }, 500);
  }

  function renderClue(idx) {
    var station = room.stations[idx];
    var type = station.type || 'text';
    var misses = progress.misses[idx] || 0;
    var cost = station.hintCost || 0;

    var lockUntil = progress.lockUntil && progress.lockUntil[idx];
    if (lockUntil && Date.now() < lockUntil) {
      renderLockout(idx, lockUntil);
      return;
    }

    // A costed hint is never given away free on misses — the whole point of
    // a cost is that the student chooses to spend it. A free hint (cost 0)
    // keeps the original behavior: it auto-reveals after two wrong tries.
    var hintUsedPersisted = !!(progress.hintsUsed && progress.hintsUsed[idx]);
    var showHintNow = !!station.hint && (cost > 0 ? hintUsedPersisted : (misses >= 2 || hintUsedPersisted));

    var answerFieldHtml;
    if (type === 'digits') {
      var digitLen = 4;
      if (station.answers && station.answers[0]) digitLen = Math.max(1, Math.min(10, String(station.answers[0]).length));
      var boxesHtml = '';
      for (var di = 0; di < digitLen; di++) {
        boxesHtml += '<input type="text" inputmode="numeric" pattern="[0-9]*" maxlength="1" class="digit-box" data-i="' + di + '">';
      }
      answerFieldHtml = '<label>Enter the code</label><div class="digit-row" id="digitRow">' + boxesHtml + '</div><button type="submit">Unlock</button>';
    } else {
      answerFieldHtml =
        '<label for="answerInput">Your answer</label>' +
        '<input type="text" id="answerInput" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" placeholder="Type the answer to unlock the next clue">' +
        '<button type="submit">Unlock</button>';
    }
    var cipherHtml = '';
    if (type === 'cipher' && station.answers && station.answers.length) {
      // Every accepted phrase is shown encoded, not just the first — a station
      // with several comma-separated accepted answers used to encode only the
      // first one here, so the others were accepted on submit but the student
      // never actually saw them as ciphertext to decode.
      var cipherLines = station.answers.map(function (a) { return escapeHtml(caesarEncode(a, station.cipherShift || 3)); });
      cipherHtml = '<div class="cipher-box">' + cipherLines.join('<br>') + '</div>';
    }

    card.innerHTML =
      '<p class="room-title">' + escapeHtml(room.title || 'Escape Room') + '</p>' +
      '<span class="station-badge">Station ' + (idx + 1) + ' of ' + room.stations.length + (hasScoring ? ' · Score: ' + computeScore() : '') + '</span>' +
      lettersStripHtml() +
      (station.image ? '<img class="clue-image" src="' + escapeHtml(station.image) + '" alt="Clue image">' : '') +
      '<div class="clue-box">' + escapeHtml(station.clue || '(no clue text)') + '</div>' +
      cipherHtml +
      '<form id="answerForm" autocomplete="off">' + answerFieldHtml + '</form>' +
      '<div class="feedback" id="feedback"></div>' +
      (station.hint ? '<div class="hint-box' + (showHintNow ? ' show' : '') + '" id="hintBox">💡 Hint: ' + escapeHtml(station.hint) + '</div>' : '') +
      (station.hint && !showHintNow ? '<button type="button" class="secondary" id="hintBtn">' + escapeHtml('Show a hint' + (cost > 0 ? ' (−' + cost + ' pts)' : '')) + '</button>' : '') +
      '<p class="progress-note">Progress is saved on this device — re-scanning this code won’t lose your place.</p>' +
      monitorBoxHtml();

    wireMonitorBox();
    sendMonitorUpdate();

    var form = document.getElementById('answerForm');
    var input = document.getElementById('answerInput');
    var digitBoxes = type === 'digits' ? Array.prototype.slice.call(document.querySelectorAll('.digit-box')) : null;
    var feedback = document.getElementById('feedback');
    var hintBtn = document.getElementById('hintBtn');
    var hintBox = document.getElementById('hintBox');

    if (digitBoxes) {
      digitBoxes.forEach(function (box, i) {
        box.addEventListener('input', function () {
          box.value = box.value.replace(/[^0-9]/g, '').slice(0, 1);
          if (box.value && i < digitBoxes.length - 1) digitBoxes[i + 1].focus();
        });
        box.addEventListener('keydown', function (e) {
          if (e.key === 'Backspace' && !box.value && i > 0) digitBoxes[i - 1].focus();
        });
      });
      digitBoxes[0].focus();
    }

    if (hintBtn) {
      hintBtn.addEventListener('click', function () {
        hintBox.classList.add('show');
        hintBtn.style.display = 'none';
        if (cost > 0 && !hintUsedPersisted) {
          progress.hintsUsed = progress.hintsUsed || {};
          progress.hintsUsed[idx] = true;
          saveProgress(progress);
          sendMonitorUpdate();
          var badge = document.querySelector('.station-badge');
          if (badge && hasScoring) badge.textContent = 'Station ' + (idx + 1) + ' of ' + room.stations.length + ' · Score: ' + computeScore();
        }
      });
    }

    form.addEventListener('submit', function (e) {
      e.preventDefault();
      var rawGiven = digitBoxes
        ? digitBoxes.map(function (b) { return b.value || ''; }).join('')
        : input.value;
      // `type` is already read off the station above; checkAnswer() reads it
      // again from the station itself, so the two can't disagree.
      var verdict = checkAnswer(station, rawGiven);
      var correct = verdict.correct;
      var nearMiss = verdict.nearMiss;

      if (correct) {
        progress.solved = progress.solved || {};
        progress.solved[idx] = true;
        var letterMsg = '';
        if (station.awardLetter) {
          progress.letters = progress.letters || {};
          progress.letters[idx] = station.awardLetter;
          letterMsg = ' You earned the letter “' + station.awardLetter + '”.';
        }
        feedback.className = 'feedback show good';
        feedback.textContent = '✓ Correct!' + letterMsg + ' Unlocking the next clue…';
        var nextIdx = (typeof station.next === 'number') ? station.next : idx + 1;
        if (nextIdx >= room.stations.length || nextIdx === null) {
          progress.current = 'done';
        } else {
          progress.current = nextIdx;
        }
        saveProgress(progress);
        setTimeout(render, 550);
      } else {
        progress.misses[idx] = (progress.misses[idx] || 0) + 1;

        // Optional per-station attempt limit: once consecutive misses reach
        // it, lock the station out for a short cooldown instead of letting
        // guesses continue indefinitely.
        var maxAttempts = parseInt(station.maxAttempts, 10) || 0;
        var lockingOutNow = maxAttempts > 0 && progress.misses[idx] >= maxAttempts;
        if (lockingOutNow) {
          progress.lockUntil = progress.lockUntil || {};
          progress.lockUntil[idx] = Date.now() + LOCKOUT_MS;
        }
        saveProgress(progress);

        if (lockingOutNow) {
          render();
          return;
        }

        feedback.className = 'feedback show bad';
        feedback.textContent = nearMiss
          ? 'So close — check your capitalization, spacing, and spelling, then try again.'
          : 'Not quite — try again.';
        if (cost === 0 && station.hint && progress.misses[idx] >= 2 && hintBox && !hintBox.classList.contains('show')) {
          hintBox.classList.add('show');
          if (hintBtn) hintBtn.style.display = 'none';
        }
        if (digitBoxes) { digitBoxes.forEach(function (b) { b.value = ''; }); digitBoxes[0].focus(); }
        else input.select();
      }
    });
  }

  render();
})();
</script>
</body>
</html>
