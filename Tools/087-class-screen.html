<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="manifest" href="../manifest.json">
<title>Class Screen</title>
<meta name="description" content="A projector board you build from widgets: timers, a stopwatch, a clock, text boxes, YouTube videos, a traffic light, a name picker, dice, work symbols, a noise meter, drawing, pictures, QR codes and a group maker, placed anywhere and saved as named screens.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%23F6F7F9'/%3E%3Crect x='4' y='6' width='24' height='17' rx='2' fill='none' stroke='%231f3550' stroke-width='2'/%3E%3Crect x='7' y='9' width='8' height='6' rx='1' fill='%232e6b8f'/%3E%3Crect x='17' y='13' width='8' height='7' rx='1' fill='%23a3372b'/%3E%3Cpath d='M12 27h8' stroke='%231f3550' stroke-width='2' stroke-linecap='round'/%3E%3C/svg%3E">
<!-- Native dark from _shared/ink-paper.css; this page paints only tokens. -->
<script>window.A11Y_NATIVE_THEME = true;</script>
<script src="../_shared/a11y.js"></script>

<link rel="stylesheet" href="../_shared/ink-paper.css">
<link rel="stylesheet" href="../_shared/a11y.css">
<style>
  [hidden] { display: none !important; }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0; background: var(--paper); color: var(--ink);
    font-family: "Segoe UI", system-ui, sans-serif; line-height: 1.4;
    display: flex; flex-direction: column; overflow: hidden;
  }

  /* ── header ─────────────────────────────────────────────────────────── */
  .app-header {
    display: flex; align-items: center; gap: .6rem 1rem; flex-wrap: wrap;
    padding: .5rem 1rem; border-bottom: 1px solid var(--line); background: var(--card);
  }
  .app-header h1 { font-size: 1.15rem; margin: 0; }
  .back-link { color: var(--muted); text-decoration: none; font-size: .85rem; }
  .back-link:hover { color: var(--accent-2); }
  .screen-bar { display: flex; align-items: center; gap: .4rem; flex-wrap: wrap; margin-left: auto; }
  .screen-bar label { font-size: .82rem; font-weight: 600; }
  .screen-bar .follow { display: inline-flex; align-items: center; gap: .25rem; }
  .menu { position: relative; }
  .menu summary {
    list-style: none; cursor: pointer; font-size: .85rem; font-weight: 600;
    border: 1px solid var(--line-strong); border-radius: 6px; padding: .3rem .65rem; background: var(--card);
  }
  .menu summary::-webkit-details-marker { display: none; }
  .menu summary::after { content: " ▾"; }
  .menu summary:focus-visible { outline: 3px solid var(--accent-2); outline-offset: 2px; }
  .menu-pop {
    position: absolute; right: 0; top: calc(100% + 4px); z-index: 70; min-width: 11rem;
    display: flex; flex-direction: column; gap: .25rem; padding: .35rem;
    background: var(--card); border: 1px solid var(--line-strong); border-radius: 8px; box-shadow: 0 8px 24px rgba(0,0,0,.18);
  }
  .menu-pop button { text-align: left; }
  select, input[type="text"] {
    font: inherit; font-size: .88rem; color: var(--ink); background: var(--card);
    border: 1px solid var(--line-strong); border-radius: 6px; padding: .3rem .45rem;
  }
  button {
    font: inherit; font-size: .85rem; font-weight: 600; cursor: pointer;
    background: var(--card); color: var(--ink); border: 1px solid var(--line-strong);
    border-radius: 6px; padding: .3rem .65rem;
  }
  button:hover { background: var(--card-2); }
  button.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
  button.primary:hover { background: var(--accent-2); border-color: var(--accent-2); }
  button:disabled { opacity: .5; cursor: not-allowed; }
  button:focus-visible, select:focus-visible, input:focus-visible, textarea:focus-visible, a:focus-visible {
    outline: 3px solid var(--accent-2); outline-offset: 2px;
  }

  /* ── stage: the board and the dock ──────────────────────────────────── */
  #stage { flex: 1; min-height: 0; display: flex; flex-direction: column; background: var(--paper); }
  #stage.is-fullscreen { position: fixed; inset: 0; z-index: 50; }
  #board {
    position: relative; flex: 1; min-height: 0; overflow: hidden;
    background-color: var(--paper);
    background-image: radial-gradient(var(--line) 1px, transparent 1.2px);
    background-size: 24px 24px;
  }
  .board-empty {
    position: absolute; inset: 0; display: grid; place-items: center; text-align: center;
    color: var(--muted); font-size: 1rem; padding: 1rem; pointer-events: none;
  }
  .dock {
    display: flex; gap: .4rem; flex-wrap: wrap; justify-content: center; align-items: center;
    padding: .45rem .6rem; background: var(--card); border-top: 1px solid var(--line);
  }
  .dock .dock-label { font-size: .8rem; color: var(--muted); font-weight: 600; margin-right: .2rem; }
  .dock button { display: inline-flex; align-items: center; gap: .35rem; }
  .dock svg { width: 18px; height: 18px; flex: none; }

  /* ── widgets ────────────────────────────────────────────────────────── */
  .w {
    position: absolute; display: flex; flex-direction: column;
    background: var(--card); color: var(--ink);
    border: 1px solid var(--line-strong); border-radius: 10px;
    box-shadow: 0 4px 16px rgba(0, 0, 0, .12);
    min-width: 0; min-height: 0; overflow: hidden;
  }
  .w.dragging { box-shadow: 0 10px 28px rgba(0, 0, 0, .22); opacity: .96; }
  .w-bar {
    display: flex; align-items: center; gap: .25rem; flex: none;
    background: var(--card-2); border-bottom: 1px solid var(--line);
  }
  .w-grip {
    flex: 1; min-width: 0; text-align: left; border: 0; border-radius: 0; background: transparent;
    cursor: grab; padding: .25rem .5rem; font-size: .78rem; color: var(--muted);
    touch-action: none; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .w-grip:hover { background: transparent; color: var(--ink); }
  .w.dragging .w-grip { cursor: grabbing; }
  .w-close {
    border: 0; background: transparent; padding: .1rem .5rem; font-size: 1rem; line-height: 1;
    color: var(--muted); border-radius: 0;
  }
  .w-close:hover { color: var(--err); background: transparent; }
  .w-body { flex: 1; min-height: 0; display: flex; flex-direction: column; padding: .4rem .5rem; gap: .35rem; }
  .w-resize {
    position: absolute; right: 0; bottom: 0; width: 18px; height: 18px; cursor: nwse-resize;
    touch-action: none;
    background: linear-gradient(135deg, transparent 50%, var(--line-strong) 50%, var(--line-strong) 60%, transparent 60%, transparent 72%, var(--line-strong) 72%, var(--line-strong) 82%, transparent 82%);
  }
  .w-foot { display: flex; gap: .3rem; flex-wrap: wrap; align-items: center; justify-content: center; flex: none; }
  .w-foot button, .w-foot select, .w-foot input[type="text"] { font-size: .78rem; padding: .2rem .45rem; }
  .w-foot label { font-size: .78rem; display: inline-flex; align-items: center; gap: .2rem; }
  .w-foot input[type="text"] { width: 6.5em; }
  .note { font-size: .78rem; color: var(--muted); text-align: center; margin: 0; }
  .err-note { font-size: .8rem; color: var(--err); text-align: center; margin: 0; }

  /* The big number/name area scales with the widget: it is a size container,
     so cqw/cqh below are relative to it, not the window. */
  .big { flex: 1; min-height: 0; container-type: size; display: grid; place-items: center; overflow: hidden; }
  .big-text {
    font-family: Consolas, "Courier New", monospace; font-weight: 700; line-height: 1;
    font-size: min(24cqw, 70cqh); font-variant-numeric: tabular-nums; white-space: nowrap;
  }
  .big-name { font-weight: 700; line-height: 1.1; text-align: center; font-size: min(14cqw, 45cqh); padding: 0 .2em; overflow-wrap: anywhere; }
  .big-date { display: block; font-family: inherit; font-weight: 600; font-size: min(7cqw, 18cqh); color: var(--muted); text-align: center; margin-top: .25em; }

  /* text */
  .text-area {
    flex: 1; min-height: 0; width: 100%; resize: none; border: 0; background: transparent; color: var(--ink);
    font: inherit; font-size: calc(var(--fs, 2) * 1rem); line-height: 1.25; padding: .1rem;
  }

  /* timer */
  .w.timer-done { animation: done-flash 1s steps(2, jump-none) 6; border-color: var(--err); }
  .w.timer-done .big-text { color: var(--err); }
  @keyframes done-flash { 50% { background: var(--card-2); } }
  @media (prefers-reduced-motion: reduce) { .w.timer-done { animation: none; } }

  /* traffic light */
  .lights { flex: 1; min-height: 0; display: flex; flex-direction: column; align-items: center; justify-content: space-evenly; container-type: size; }
  .light {
    width: min(70cqw, 26cqh); aspect-ratio: 1; border-radius: 50%; padding: 0;
    border: 3px solid var(--line-strong); opacity: .28;
  }
  .light:hover { opacity: .55; }
  .light[aria-pressed="true"] { opacity: 1; box-shadow: 0 0 0 4px var(--card), 0 0 18px 4px var(--line-strong); }
  .light.red, .light.red:hover { background: #d33a2c; }
  .light.yellow, .light.yellow:hover { background: #f1b82d; }
  .light.green, .light.green:hover { background: #2f9e57; }
  .light-label { font-weight: 700; font-size: min(14cqw, 7cqh); }

  /* dice */
  .dice { flex: 1; min-height: 0; container-type: size; display: flex; flex-wrap: wrap; gap: 4cqmin; align-items: center; justify-content: center; }
  .die {
    position: relative; width: min(28cqw, 60cqh); aspect-ratio: 1;
    border: 2px solid var(--ink); border-radius: 16%; background: var(--card);
  }
  .die .pip { position: absolute; width: 18%; height: 18%; border-radius: 50%; background: var(--ink); transform: translate(-50%, -50%); }

  /* youtube */
  .yt-frame { flex: 1; min-height: 0; width: 100%; border: 0; border-radius: 6px; background: #000; }
  .yt-form { display: flex; flex-direction: column; gap: .4rem; justify-content: center; flex: 1; }
  .yt-form label { font-size: .85rem; font-weight: 600; }
  .yt-form input { width: 100%; }
  .yt-offline { flex: 1; display: grid; place-items: center; text-align: center; color: var(--muted); font-size: .9rem; padding: .5rem; }

  /* work symbols */
  .sym { flex: 1; min-height: 0; container-type: size; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2cqh; text-align: center; }
  .sym svg { width: min(60cqw, 48cqh); height: min(60cqw, 48cqh); color: var(--accent-2); }
  .sym-label { font-weight: 800; font-size: min(15cqw, 13cqh); line-height: 1.05; }
  .sym-sub { color: var(--muted); font-size: min(8cqw, 7cqh); line-height: 1.15; }

  /* noise meter */
  .noise { flex: 1; min-height: 0; container-type: size; display: flex; align-items: center; justify-content: center; gap: 6cqw; }
  .noise-track {
    position: relative; width: min(24cqw, 30cqh); height: 92cqh; border-radius: 12px; flex: none;
    border: 2px solid var(--line-strong); background: var(--card-2); overflow: hidden;
  }
  .noise-fill { position: absolute; left: 0; right: 0; bottom: 0; height: 0; background: #2f9e57; transition: height .12s linear; }
  .noise-fill.mid { background: #f1b82d; }
  .noise-fill.high { background: #d33a2c; }
  .noise-limit { position: absolute; left: -2px; right: -2px; height: 0; border-top: 3px dashed var(--ink); }
  .noise-word { font-weight: 800; font-size: min(12cqw, 16cqh); line-height: 1.05; max-width: 50cqw; }
  .w.noise-loud { animation: done-flash 1s steps(2, jump-none) infinite; border-color: var(--err); }
  .w.noise-loud .noise-word { color: var(--err); }
  @media (prefers-reduced-motion: reduce) { .w.noise-loud { animation: none; } }
  .w-foot input[type="range"] { width: 5.5em; }

  /* drawing */
  .draw-wrap { flex: 1; min-height: 0; position: relative; border: 1px dashed var(--line); border-radius: 6px; }
  .draw-canvas { position: absolute; inset: 0; width: 100%; height: 100%; touch-action: none; cursor: crosshair; }
  .pen { width: 1.6rem; height: 1.6rem; padding: 0; border-radius: 50%; border: 2px solid var(--line-strong); }
  .pen[aria-pressed="true"] { outline: 3px solid var(--accent-2); outline-offset: 1px; }
  .pen.ink, .pen.ink:hover { background: var(--ink); }
  .pen.red, .pen.red:hover { background: var(--err); }
  .pen.blue, .pen.blue:hover { background: var(--accent-2); }
  .pen.green, .pen.green:hover { background: #2f9e57; }

  /* image */
  .pic { flex: 1; min-height: 0; width: 100%; height: 100%; object-fit: contain; border-radius: 6px; }
  .pic.cover { object-fit: cover; }
  .pick-form { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: .45rem; text-align: center; }

  /* QR */
  .qr-box { flex: 1; min-height: 0; display: grid; place-items: center; overflow: hidden; }
  .qr-box canvas { display: block; border-radius: 4px; }
  .qr-caption { font-size: .8rem; color: var(--muted); text-align: center; margin: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

  /* groups */
  /* The grid's own columns cannot use cq units (that would measure the
     viewport: .groups is the container, not inside one), so they are rem. */
  .groups { flex: 1; min-height: 0; overflow: auto; container-type: inline-size; display: grid; gap: .4rem; grid-template-columns: repeat(auto-fill, minmax(10rem, 1fr)); align-content: start; }
  .group { border: 1px solid var(--line); border-radius: 8px; background: var(--card-2); padding: .3rem .45rem; }
  .group h3 { margin: 0 0 .15rem; font-size: .8rem; color: var(--accent-2); }
  .group ul { margin: 0; padding: 0; list-style: none; font-weight: 600; font-size: clamp(1rem, 3cqw, 2rem); line-height: 1.25; }

  /* board backgrounds — every one painted from tokens, so dark comes free */
  #board[data-bg="grid"] {
    background-image: linear-gradient(var(--line) 1px, transparent 1px), linear-gradient(90deg, var(--line) 1px, transparent 1px);
    background-size: 32px 32px;
  }
  #board[data-bg="lines"] { background-image: linear-gradient(transparent 31px, var(--line) 31px); background-size: 100% 32px; }
  #board[data-bg="plain"] { background-image: none; }
  #board[data-bg="blue"] { background-image: none; background-color: color-mix(in srgb, var(--accent-2) 16%, var(--paper)); }
  #board[data-bg="slate"] { background-image: none; background-color: color-mix(in srgb, var(--accent) 16%, var(--paper)); }
  #board[data-bg="warm"] { background-image: none; background-color: color-mix(in srgb, var(--err) 10%, var(--paper)); }
  #board[data-bg="image"] { background-size: cover; background-position: center; background-repeat: no-repeat; }

  /* ── toast ──────────────────────────────────────────────────────────── */
  .toast {
    position: fixed; left: 50%; bottom: 4.2rem; transform: translateX(-50%); z-index: 60;
    background: var(--ink); color: var(--paper); border-radius: 8px; padding: .45rem .6rem .45rem .9rem;
    display: flex; gap: .7rem; align-items: center; font-size: .88rem; box-shadow: 0 6px 20px rgba(0,0,0,.25);
  }
  .toast button { background: var(--paper); color: var(--ink); border-color: var(--paper); }
  .sr-only { position: absolute; width: 1px; height: 1px; margin: -1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0; }

  @media (max-width: 640px) {
    .app-header { padding: .4rem .6rem; }
    .screen-bar { margin-left: 0; }
    .dock .dock-label { display: none; }
    .dock button span { display: none; }
  }
</style>
</head>
<body>
<header class="app-header">
  <a class="back-link" href="../index.html">← All tools</a>
  <h1>Class Screen</h1>
  <div class="screen-bar">
    <label for="screenSelect">Screen</label>
    <select id="screenSelect"></select>
    <button type="button" id="newScreenBtn">New</button>
    <label for="templateSelect" class="sr-only">New screen from a starter</label>
    <select id="templateSelect"></select>
    <label for="periodSelect">Period</label>
    <select id="periodSelect"></select>
    <label class="follow" title="Switch to each period's screen when its bell rings (bell times come from Command Center)"><input type="checkbox" id="followBell"> Follow the bell</label>
    <label for="bgSelect">Background</label>
    <select id="bgSelect">
      <option value="dots">Dots</option>
      <option value="grid">Grid</option>
      <option value="lines">Lines</option>
      <option value="plain">Plain</option>
      <option value="blue">Blue</option>
      <option value="slate">Slate</option>
      <option value="warm">Warm</option>
      <option value="image">Picture…</option>
    </select>
    <input type="file" id="bgFile" accept="image/*" hidden>
    <details class="menu" id="moreMenu">
      <summary>More</summary>
      <div class="menu-pop">
        <button type="button" id="renameScreenBtn">Rename</button>
        <button type="button" id="dupScreenBtn">Duplicate</button>
        <button type="button" id="exportScreenBtn">Export screen</button>
        <button type="button" id="importScreenBtn">Import screen</button>
        <button type="button" id="clearScreenBtn">Clear</button>
        <button type="button" id="deleteScreenBtn">Delete</button>
      </div>
    </details>
    <input type="file" id="importFile" accept=".json,application/json" hidden>
    <button type="button" id="fsBtn" class="primary">Fullscreen</button>
  </div>
</header>

<main id="stage">
  <div id="board" aria-label="Board">
    <p class="board-empty" id="boardEmpty">Add a widget from the bar below. Drag it by its title, resize it from the corner, and it stays where you put it.</p>
  </div>
  <nav class="dock" id="dock" aria-label="Add a widget">
    <span class="dock-label">Add:</span>
  </nav>
</main>

<p class="sr-only" id="gripHelp">Arrow keys move this widget. Shift plus arrow keys resize it.</p>
<div class="toast" id="toast" role="status" hidden><span id="toastText"></span><button type="button" id="toastUndo">Undo</button></div>

<script>
(function () {
  'use strict';

  var Core = window.ClassScreenCore;
  var KEY = 'cls-screen:state';
  var ROSTER_HUB = '006-class-roster-hub.html';

  if (window.Store && Store.configure) Store.configure({ toolName: 'Class Screen' });

  var state = Core.normalizeState(window.Store ? Store.get(KEY, { version: 1, default: null }) : null);
  var board = document.getElementById('board');
  var boardEmpty = document.getElementById('boardEmpty');
  var screenSelect = document.getElementById('screenSelect');
  var instances = {};           // widget id -> { el, tick, destroy }
  var saveTimer = 0;

  /* ── persistence ──────────────────────────────────────────────────── */

  function saveNow() {
    clearTimeout(saveTimer); saveTimer = 0;
    if (window.Store) Store.set(KEY, state, { version: 1 });
  }
  function save() {
    clearTimeout(saveTimer);
    saveTimer = setTimeout(saveNow, 300);
  }
  window.addEventListener('pagehide', function () { if (saveTimer) saveNow(); });

  function currentScreen() {
    for (var i = 0; i < state.screens.length; i++) if (state.screens[i].id === state.current) return state.screens[i];
    state.current = state.screens[0].id;
    return state.screens[0];
  }

  /* ── small DOM helpers (no markup strings anywhere on this page) ───── */

  function el(tag, attrs, kids) {
    var n = document.createElement(tag);
    if (attrs) Object.keys(attrs).forEach(function (k) {
      var v = attrs[k];
      if (v === null || v === undefined || v === false) return;
      if (k === 'text') n.textContent = v;
      else if (k === 'className') n.className = v;
      else if (k.slice(0, 2) === 'on') n.addEventListener(k.slice(2), v);
      else n.setAttribute(k, v === true ? '' : v);
    });
    (kids || []).forEach(function (c) { if (c) n.appendChild(typeof c === 'string' ? document.createTextNode(c) : c); });
    return n;
  }
  var SVGNS = 'http://www.w3.org/2000/svg';
  function icon(paths) {
    var s = document.createElementNS(SVGNS, 'svg');
    s.setAttribute('viewBox', '0 0 24 24'); s.setAttribute('fill', 'none'); s.setAttribute('aria-hidden', 'true');
    paths.forEach(function (d) {
      var p = document.createElementNS(SVGNS, 'path');
      p.setAttribute('d', d); p.setAttribute('stroke', 'currentColor'); p.setAttribute('stroke-width', '2');
      p.setAttribute('stroke-linecap', 'round'); p.setAttribute('stroke-linejoin', 'round');
      s.appendChild(p);
    });
    return s;
  }

  /* ── sound: one short beep pattern, built on first use ─────────────── */

  var audioCtx = null;
  function unlockAudio() {
    try {
      if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      if (audioCtx.state === 'suspended') audioCtx.resume();
    } catch (e) { audioCtx = null; }
  }
  function beep() {
    if (!audioCtx) return;
    try {
      var t = audioCtx.currentTime;
      for (var i = 0; i < 3; i++) {
        var o = audioCtx.createOscillator(), g = audioCtx.createGain();
        o.frequency.value = 880; o.type = 'sine';
        g.gain.setValueAtTime(0.0001, t + i * 0.35);
        g.gain.exponentialRampToValueAtTime(0.35, t + i * 0.35 + 0.02);
        g.gain.exponentialRampToValueAtTime(0.0001, t + i * 0.35 + 0.25);
        o.connect(g); g.connect(audioCtx.destination);
        o.start(t + i * 0.35); o.stop(t + i * 0.35 + 0.3);
      }
    } catch (e) {}
  }

  /* ── widget types ─────────────────────────────────────────────────── */
  /* Each build(ctx) fills ctx.body and returns { tick?, destroy? }.
     ctx.data is the live, saved object; call ctx.save() after changing it. */

  var TYPES = {};

  TYPES.text = {
    title: 'Text', icon: ['M5 6h14', 'M12 6v13', 'M9 19h6'],
    build: function (ctx) {
      var d = ctx.data;
      var ta = el('textarea', { className: 'text-area', 'aria-label': 'Text box', placeholder: 'Type here…', spellcheck: 'true' });
      ta.value = d.text;
      ta.style.setProperty('--fs', d.size);
      ta.addEventListener('input', function () { d.text = ta.value; ctx.save(); });

  bgFile.addEventListener('change', function () {
    var f = bgFile.files && bgFile.files[0];
    if (!f) return;
    var s = currentScreen();
    savePicture(f).then(function (id) {
      s.bg = 'image'; s.bgImage = id; saveNow(); renderBackground(); collectMedia();
    }, function (e) { showToast((e && e.message) || 'That picture could not be saved.', false); });
  });

  function addWidget(type) {
    var s = currentScreen();
    if (s.widgets.length >= Core.MAX_WIDGETS) { showToast('This screen already holds ' + Core.MAX_WIDGETS + ' widgets.', false); return; }
    var r = Core.placeNew(type, s.widgets);
    var top = s.widgets.reduce(function (m, o) { return Math.max(m, o.z); }, 0);
    var w = Core.normalizeWidget({ id: Core.newId('w'), type: type, x: r.x, y: r.y, w: r.w, h: r.h, z: top + 1, data: Core.defaultData(type) });
    s.widgets.push(w);
    mountWidget(w);
    boardEmpty.hidden = true;
    saveNow();
    var inst = instances[w.id];
    var first = inst.el.querySelector('.w-body textarea, .w-body input[type="text"]') || inst.el.querySelector('.w-grip');
    first.focus();
  }

  var lastRemoved = null;
  function removeWidget(id) {
    var s = currentScreen();
    var i = s.widgets.findIndex(function (o) { return o.id === id; });
    if (i === -1) return;
    var w = s.widgets.splice(i, 1)[0];
    var inst = instances[id];
    if (inst) { if (inst.destroy) try { inst.destroy(); } catch (e) {} inst.el.remove(); delete instances[id]; }
    boardEmpty.hidden = s.widgets.length > 0;
    lastRemoved = { screenId: s.id, widgets: [w] };
    saveNow();
    showToast(TYPES[w.type].title + ' removed.', true);
  }

  /* ── toast with undo ──────────────────────────────────────────────── */

  var toast = document.getElementById('toast');
  var toastText = document.getElementById('toastText');
  var toastUndo = document.getElementById('toastUndo');
  var toastTimer = 0;
  function showToast(text, undoable) {
    toastText.textContent = text;
    toastUndo.hidden = !undoable;
    toast.hidden = false;
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function () { toast.hidden = true; lastRemoved = null; collectMedia(); }, 7000);
  }
  toastUndo.addEventListener('click', function () {
    toast.hidden = true;
    if (!lastRemoved) return;
    var s = state.screens.find(function (o) { return o.id === lastRemoved.screenId; });
    if (s) {
      lastRemoved.widgets.forEach(function (w) { if (s.widgets.length < Core.MAX_WIDGETS) s.widgets.push(w); });
      state.current = s.id;
      saveNow(); renderBoard();
    }
    lastRemoved = null;
  });

  /* ── screens ──────────────────────────────────────────────────────── */

  function renderScreenBar() {
    screenSelect.textContent = '';
    var bell = readBell();
    var byId = {};
    bell.forEach(function (p) { byId[p.id] = p; });
    state.screens.forEach(function (s) {
      var tag = s.period && byId[s.period] ? ' (' + byId[s.period].label + ')' : '';
      screenSelect.appendChild(el('option', { value: s.id, text: s.name + tag }));
    });
    screenSelect.value = state.current;
    renderPeriodBar(bell);
    document.getElementById('deleteScreenBtn').disabled = state.screens.length < 2;
    document.getElementById('newScreenBtn').disabled = state.screens.length >= Core.MAX_SCREENS;
    document.getElementById('dupScreenBtn').disabled = state.screens.length >= Core.MAX_SCREENS;
  }
  function uniqueName(base) {
    var names = state.screens.map(function (s) { return s.name; });
    if (names.indexOf(base) === -1) return base;
    base = base.replace(/ \d+$/, '');      // "Do Now 2" taken → "Do Now 3", not "Do Now 2 2"
    for (var i = 2; ; i++) if (names.indexOf(base + ' ' + i) === -1) return base + ' ' + i;
  }
  screenSelect.addEventListener('change', function () { state.current = screenSelect.value; saveNow(); renderBoard(); });
  document.getElementById('newScreenBtn').addEventListener('click', function () {
    var name = window.prompt('Name for the new screen:', uniqueName('Screen ' + (state.screens.length + 1)));
    if (name === null) return;
    var s = Core.blankScreen(name.trim().slice(0, 60) || uniqueName('Screen'));
    state.screens.push(s); state.current = s.id; saveNow(); renderBoard();
  });
  document.getElementById('renameScreenBtn').addEventListener('click', function () {
    var s = currentScreen();
    var name = window.prompt('Rename this screen:', s.name);
    if (name === null || !name.trim()) return;
    s.name = name.trim().slice(0, 60); saveNow(); renderScreenBar();
  });
  document.getElementById('dupScreenBtn').addEventListener('click', function () {
    var s = currentScreen();
    var copy = Core.normalizeState({ screens: [JSON.parse(JSON.stringify(s))] }).screens[0];
    copy.id = Core.newId('s');
    copy.name = uniqueName(s.name + ' copy').slice(0, 60);
    copy.widgets.forEach(function (w) { w.id = Core.newId('w'); });
    state.screens.push(copy); state.current = copy.id; saveNow(); renderBoard();
  });
  document.getElementById('deleteScreenBtn').addEventListener('click', function () {
    if (state.screens.length < 2) return;
    var s = currentScreen();
    if (!window.confirm('Delete the screen "' + s.name + '" and its ' + s.widgets.length + ' widgets?')) return;
    state.screens = state.screens.filter(function (o) { return o.id !== s.id; });
    state.current = state.screens[0].id; saveNow(); renderBoard(); collectMedia();
  });
  document.getElementById('clearScreenBtn').addEventListener('click', function () {
    var s = currentScreen();
    if (!s.widgets.length) return;
    var removed = s.widgets.slice();
    s.widgets = [];
    saveNow(); renderBoard();
    lastRemoved = { screenId: s.id, widgets: removed };
    showToast('Screen cleared.', true);
  });

  /* ── starter screens ──────────────────────────────────────────────── */

  var templateSelect = document.getElementById('templateSelect');
  templateSelect.appendChild(el('option', { value: '', text: 'Starter screen…' }));
  Core.TEMPLATES.forEach(function (t) { templateSelect.appendChild(el('option', { value: t.id, text: t.name })); });
  templateSelect.addEventListener('change', function () {
    var id = templateSelect.value;
    templateSelect.value = '';
    if (!id) return;
    if (state.screens.length >= Core.MAX_SCREENS) { showToast('You already have ' + Core.MAX_SCREENS + ' screens.', false); return; }
    var sc = Core.fromTemplate(id);
    sc.name = uniqueName(sc.name);
    state.screens.push(sc); state.current = sc.id; saveNow(); renderBoard();
    showToast('Added the “' + sc.name + '” screen. Change anything on it.', false);
  });

  /* ── periods: the bell schedule is 010 Command Center's ───────────── */
  /* This page reads 'gvb-command-center:settings' and never writes it. A
     screen can be linked to one period; with "Follow the bell" on, the board
     switches to that period's screen when the period starts (and when the
     page opens mid-period). Between bells a teacher's own choice stands. */

  var BELL_KEY = 'gvb-command-center:settings';
  var COMMAND_CENTER = '010-command-center-dashboard.html';
  var periodSelect = document.getElementById('periodSelect');
  var followBell = document.getElementById('followBell');
  function readBell() {
    try { return Core.readPeriods(JSON.parse(localStorage.getItem(BELL_KEY) || '{}')); } catch (e) { return []; }
  }
  function nowMinutes() {
    var d = new Date();
    return d.getHours() * 60 + d.getMinutes() + d.getSeconds() / 60;
  }
  function renderPeriodBar(bell) {
    var s = currentScreen();
    periodSelect.textContent = '';
    periodSelect.appendChild(el('option', { value: '', text: bell.length ? 'No period' : 'No bell times' }));
    bell.forEach(function (p) { periodSelect.appendChild(el('option', { value: p.id, text: p.label + ' (' + p.start + ')' })); });
    periodSelect.value = bell.some(function (p) { return p.id === s.period; }) ? s.period : '';
    periodSelect.title = bell.length ? 'Which period this screen is for' : 'Add bell times in Command Center to link screens to periods';
    followBell.checked = state.follow;
    followBell.disabled = !bell.length;
  }
  periodSelect.addEventListener('change', function () {
    var s = currentScreen();
    var id = periodSelect.value;
    var moved = '';
    state.screens.forEach(function (o) { if (o !== s && id && o.period === id) { o.period = ''; moved = o.name; } });
    s.period = id;
    saveNow(); renderScreenBar();
    if (id) {
      var label = periodSelect.options[periodSelect.selectedIndex].text.replace(/ \(.*\)$/, '');
      showToast(label + ' now opens “' + s.name + '”' + (moved ? ', not “' + moved + '”' : '') + '.', false);
    }
  });
  followBell.addEventListener('change', function () {
    state.follow = followBell.checked; saveNow();
    lastPeriodId = undefined;
    if (state.follow) checkBell();
  });
  var lastPeriodId;                       // undefined until the first check
  function checkBell() {
    var bell = readBell();
    var at = Core.periodAt(bell, nowMinutes());
    var id = at.current ? at.current.id : '';
    if (id === lastPeriodId) return;
    lastPeriodId = id;
    if (!state.follow || !id) return;
    var target = Core.screenForPeriod(state, id);
    if (!target || target.id === state.current) return;
    state.current = target.id; saveNow(); renderBoard();
    showToast(at.current.label + ': showing “' + target.name + '”.', false);
  }
  setInterval(checkBell, 5000);
  window.addEventListener('storage', function (e) { if (e.key === BELL_KEY) { renderScreenBar(); checkBell(); } });

  /* ── a screen as a file: export and import ────────────────────────── */

  var moreMenu = document.getElementById('moreMenu');
  moreMenu.addEventListener('click', function (e) { if (e.target.closest('.menu-pop button')) moreMenu.open = false; });
  document.addEventListener('pointerdown', function (e) { if (moreMenu.open && !moreMenu.contains(e.target)) moreMenu.open = false; });
  moreMenu.addEventListener('keydown', function (e) {
    if (e.key === 'Escape' && moreMenu.open) { moreMenu.open = false; moreMenu.querySelector('summary').focus(); }
  });

  function download(name, text) {
    var blob = new Blob([text], { type: 'application/json' });
    var url = URL.createObjectURL(blob);
    var a = el('a', { href: url, download: name });
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(function () { URL.revokeObjectURL(url); }, 1000);
  }
  function fileName(name) {
    return 'class-screen-' + (name.toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '') || 'screen') + '.json';
  }
  document.getElementById('exportScreenBtn').addEventListener('click', function () {
    var s = currentScreen();
    var ids = Core.mediaIds({ screens: [s] });
    var urls = {};
    Promise.all(ids.map(function (id) {
      if (!media) return null;
      return media.getBlob(id).then(function (b) {
        return b ? MediaDB.toDataUrl(b).then(function (u) { urls[id] = u; }) : null;
      });
    })).then(function () {
      var missing = ids.filter(function (id) { return !urls[id]; }).length;
      download(fileName(s.name), JSON.stringify(Core.exportScreen(s, urls)));
      showToast('Exported “' + s.name + '”' + (missing ? ' (' + missing + ' picture' + (missing > 1 ? 's' : '') + ' could not be read)' : '') + '.', false);
    });
  });
  var importFile = document.getElementById('importFile');
  document.getElementById('importScreenBtn').addEventListener('click', function () { importFile.value = ''; importFile.click(); });
  importFile.addEventListener('change', function () {
    var f = importFile.files && importFile.files[0];
    if (!f) return;
    if (state.screens.length >= Core.MAX_SCREENS) { showToast('You already have ' + Core.MAX_SCREENS + ' screens.', false); return; }
    if (f.size > 30 * 1024 * 1024) { showToast('That file is too big to be a Class Screen export.', false); return; }
    f.text().then(function (text) {
      var obj;
      try { obj = JSON.parse(text); } catch (e) { showToast('That file is not a Class Screen export.', false); return; }
      var r = Core.readImport(obj);
      if (r.error) { showToast(r.error, false); return; }
      var ids = Object.keys(r.media);
      return Promise.all(ids.map(function (id) {
        if (!media) return Promise.reject(new Error('This browser cannot store pictures for this page.'));
        return media.put(id, MediaDB.dataUrlToBlob(r.media[id]), { name: 'imported' });
      })).then(function () {
        r.screen.name = uniqueName(r.screen.name);
        state.screens.push(r.screen); state.current = r.screen.id; saveNow(); renderBoard();
        showToast('Imported “' + r.screen.name + '”' + (r.dropped ? ' (' + r.dropped + ' picture' + (r.dropped > 1 ? 's' : '') + ' left out)' : '') + '.', false);
      });
    }).catch(function (e) { showToast((e && e.message) || 'That screen could not be imported.', false); });
  });

  /* ── dock ─────────────────────────────────────────────────────────── */

  var dock = document.getElementById('dock');
  Core.TYPES.forEach(function (t) {
    var b = el('button', { type: 'button', 'data-add': t, 'aria-label': 'Add ' + TYPES[t].title.toLowerCase() },
      [icon(TYPES[t].icon), el('span', { text: TYPES[t].title })]);
    b.addEventListener('click', function () { addWidget(t); });
    dock.appendChild(b);
  });

  /* ── fullscreen, ticking, start ───────────────────────────────────── */

  if (window.Stage) Stage.mount(document.getElementById('stage'), {
    button: document.getElementById('fsBtn'),
    labels: { enter: 'Fullscreen', exit: 'Exit fullscreen' }
  });

  setInterval(function () {
    Object.keys(instances).forEach(function (id) {
      var t = instances[id].tick;
      if (t) try { t(); } catch (e) {}
    });
  }, 200);

  renderBoard();
  collectMedia();
  checkBell();

  /* For the smoke suite: the saved state, read-only. */
  window.__classScreen = { state: function () { return JSON.parse(JSON.stringify(state)); }, key: KEY };
})();
</script>
<script src="../_shared/sw-register.js" defer></script>
</body>
