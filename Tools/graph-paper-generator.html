<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Graph Paper &amp; Number Line Generator</title>

<script src="graph-paper-generator/gpg-render.js"></script>
<style>
  :root {
    --ink: #1f2430; --paper: #fafaf8; --card: #fff;
    --line: #dcdad2; --line-strong: #c3c0b6;
    --accent: #1f3550; --accent-2: #2e6b8f; --muted: #6b6a63;
  }
  * { box-sizing: border-box; }
  body {
    font-family: "Segoe UI", Georgia, "Times New Roman", serif;
    background: var(--paper); color: var(--ink); margin: 0;
    padding: 24px 20px 100px; line-height: 1.45;
  }
  .wrap { max-width: 1280px; margin: 0 auto; }
  .app-header { display: flex; align-items: baseline; justify-content: space-between; gap: 1rem; flex-wrap: wrap; margin-bottom: 1.4rem; }
  .app-header h1 { font-size: 1.7rem; margin: 0 0 .2rem; }
  .back-link { color: var(--muted); text-decoration: none; font-size: .88rem; }
  .back-link:hover { color: var(--accent-2); }

  .layout { display: grid; grid-template-columns: minmax(280px, 360px) 1fr; gap: 1.4rem; align-items: start; }
  @media (max-width: 900px) { .layout { grid-template-columns: 1fr; } }

  .card { background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 1.1rem 1.2rem; margin-bottom: 1rem; }
  label { display: block; font-weight: 600; font-size: .82rem; margin-bottom: .3rem; }
  .hint { color: var(--muted); font-size: .78rem; margin: -.15rem 0 .6rem; }
  input[type="text"], input[type="number"], select {
    width: 100%; font-family: inherit; font-size: .92rem; color: var(--ink);
    background: #fff; border: 1px solid var(--line-strong); border-radius: 6px;
    padding: .5rem .6rem; margin-bottom: .8rem;
  }
  .row2 { display: grid; grid-template-columns: 1fr 1fr; gap: .7rem; }
  .checkline { display: flex; align-items: center; gap: .5rem; font-weight: 600; font-size: .85rem; margin-bottom: .8rem; }
  .checkline input { width: auto; margin: 0; }

  .mode-tabs { display: flex; gap: .4rem; margin-bottom: .9rem; flex-wrap: wrap; }
  .mode-tab {
    flex: 1 1 auto; text-align: center; padding: .5rem .4rem; border: 1px solid var(--line-strong);
    border-radius: 7px; background: #fff; cursor: pointer; font-weight: 700; font-size: .82rem; color: var(--muted);
  }
  .mode-tab.active { color: #fff; background: var(--accent); border-color: var(--accent); }
  .mode-panel { display: none; }
  .mode-panel.active { display: block; }

  button {
    font-family: inherit; font-size: .92rem; font-weight: 600; cursor: pointer;
    background: var(--accent); color: #fff; border: 1px solid var(--accent);
    border-radius: 7px; padding: .6rem 1.1rem; width: 100%;
  }
  button:hover { background: var(--accent-2); border-color: var(--accent-2); }

  .preview-wrap { background: #d9d7cd; border-radius: 10px; padding: 1.4rem; overflow: auto; }
  .preview-note { font-size: .8rem; color: var(--muted); margin-bottom: .8rem; }
  #previewArea { background: #fff; margin: 0 auto; box-shadow: 0 2px 10px rgba(0,0,0,.18); max-width: 100%; }
  #previewArea svg { display: block; width: 100%; height: auto; }

  footer.note { color: var(--muted); font-size: .82rem; margin-top: 2rem; }

  @media print {
    body * { visibility: hidden; }
    #previewArea, #previewArea * { visibility: visible; }
    #previewArea { position: absolute; left: 0; top: 0; margin: 0; box-shadow: none; width: 100%; }
    #previewArea svg { width: 100%; height: auto; }
    @page { margin: 0; }
  }
</style>
</head>
<body>
<div class="wrap">

  <div class="app-header">
    <div>
      <a class="back-link" href="../index.html">&larr; Toolkit</a>
      <h1>Graph Paper &amp; Number Line Generator</h1>
    </div>
  </div>

  <div class="layout">
    <div class="editor">
      <div class="card">
        <div class="mode-tabs">
          <div class="mode-tab active" data-mode="graph">Graph paper</div>
          <div class="mode-tab" data-mode="numberline">Number line</div>
          <div class="mode-tab" data-mode="plane">Coordinate plane</div>
        </div>

        <label for="orientation">Page orientation</label>
        <select id="orientation">
          <option value="portrait">Portrait</option>
          <option value="landscape">Landscape</option>
        </select>

        <!-- ===== Graph paper panel ===== -->
        <div class="mode-panel active" id="panel-graph">
          <label for="gridSizePreset">Grid size</label>
          <select id="gridSizePreset">
            <option value="0.25">1/4 inch squares</option>
            <option value="0.5">1/2 inch squares</option>
            <option value="0.3937">1 cm squares</option>
            <option value="custom">Custom (squares per inch)</option>
          </select>
          <input type="number" id="gridSizeCustom" min="1" max="20" step="0.5" value="4" style="display:none;" placeholder="Squares per inch">

          <div class="checkline">
            <input type="checkbox" id="exactCount">
            <label style="margin:0;" for="exactCount">Use an exact number of rows/columns instead (auto-sized to fit the page)</label>
          </div>
          <div class="row2" id="exactCountFields" style="display:none;">
            <div><label for="exactCols">Columns</label><input type="number" id="exactCols" min="1" max="60" value="10"></div>
            <div><label for="exactRows">Rows</label><input type="number" id="exactRows" min="1" max="80" value="10"></div>
          </div>

          <div class="checkline">
            <input type="checkbox" id="boldCenter">
            <label style="margin:0;" for="boldCenter">Bold axis lines through the center</label>
          </div>
        </div>

        <!-- ===== Number line panel ===== -->
        <div class="mode-panel" id="panel-numberline">
          <div class="row2">
            <div><label for="nlMin">Min</label><input type="number" id="nlMin" value="0"></div>
            <div><label for="nlMax">Max</label><input type="number" id="nlMax" value="20"></div>
          </div>
          <div class="row2">
            <div><label for="nlInterval">Tick interval</label><input type="number" id="nlInterval" value="1" min="0.1" step="0.1"></div>
            <div><label for="nlLabelEvery">Label every Nth tick</label><input type="number" id="nlLabelEvery" value="1" min="1" step="1"></div>
          </div>
          <label for="nlCopies">Copies on one page</label>
          <p class="hint">For handing out cut-apart strips.</p>
          <input type="number" id="nlCopies" value="1" min="1" max="10" step="1">
        </div>

        <!-- ===== Coordinate plane panel ===== -->
        <div class="mode-panel" id="panel-plane">
          <label for="planeQuadrants">Quadrants</label>
          <select id="planeQuadrants">
            <option value="four">Full (four quadrants)</option>
            <option value="first">First quadrant only</option>
          </select>
          <div class="row2">
            <div><label for="planeXMin">X min</label><input type="number" id="planeXMin" value="-10"></div>
            <div><label for="planeXMax">X max</label><input type="number" id="planeXMax" value="10"></div>
          </div>
          <div class="row2">
            <div><label for="planeYMin">Y min</label><input type="number" id="planeYMin" value="-10"></div>
            <div><label for="planeYMax">Y max</label><input type="number" id="planeYMax" value="10"></div>
          </div>
          <div class="row2">
            <div><label for="planeInterval">Gridline interval</label><input type="number" id="planeInterval" value="1" min="0.5" step="0.5"></div>
            <div><label for="planeLabelEvery">Label every Nth line</label><input type="number" id="planeLabelEvery" value="5" min="1" step="1"></div>
          </div>
        </div>

        <button type="button" id="printBtn">Print</button>
      </div>
    </div>

    <div class="preview-wrap">
      <p class="preview-note">Live preview &mdash; sized true-to-scale for printing at 100%.</p>
      <div id="previewArea"></div>
    </div>
  </div>

  <footer class="note">
    Runs entirely in your browser &mdash; nothing is uploaded. Print at 100% scale ("Fit to page" will distort the sizing).
  </footer>

</div>

<script>
(function () {
  'use strict';

  var els = {};
  ['orientation','gridSizePreset','gridSizeCustom','exactCount','exactCountFields','exactCols','exactRows','boldCenter',
   'nlMin','nlMax','nlInterval','nlLabelEvery','nlCopies',
   'planeQuadrants','planeXMin','planeXMax','planeYMin','planeYMax','planeInterval','planeLabelEvery',
   'printBtn','previewArea'
  ].forEach(function (id) { els[id] = document.getElementById(id); });

  var settings = {
    mode: 'graph',
    orientation: 'portrait',
    gridSizePreset: '0.25',
    gridSizeCustom: 4,
    exactCount: false,
    exactCols: 10,
    exactRows: 10,
    boldCenter: false,
    nlMin: 0, nlMax: 20, nlInterval: 1, nlLabelEvery: 1, nlCopies: 1,
    planeQuadrants: 'four', planeXMin: -10, planeXMax: 10, planeYMin: -10, planeYMax: 10,
    planeInterval: 1, planeLabelEvery: 5
  };

  function loadSaved() {
    var saved = GraphPaperStore.load();
    if (saved) Object.keys(settings).forEach(function (k) { if (saved[k] !== undefined) settings[k] = saved[k]; });
  }
  function persist() { GraphPaperStore.save(settings); }

  function applySettingsToForm() {
    els.orientation.value = settings.orientation;
    var preset = ['0.25', '0.5', '0.3937'].indexOf(String(settings.gridSizePreset)) !== -1 ? String(settings.gridSizePreset) : 'custom';
    els.gridSizePreset.value = preset;
    els.gridSizeCustom.value = settings.gridSizeCustom;
    els.gridSizeCustom.style.display = preset === 'custom' ? '' : 'none';
    els.exactCount.checked = settings.exactCount;
    els.exactCountFields.style.display = settings.exactCount ? '' : 'none';
    els.exactCols.value = settings.exactCols;
    els.exactRows.value = settings.exactRows;
    els.boldCenter.checked = settings.boldCenter;
    els.nlMin.value = settings.nlMin; els.nlMax.value = settings.nlMax;
    els.nlInterval.value = settings.nlInterval; els.nlLabelEvery.value = settings.nlLabelEvery;
    els.nlCopies.value = settings.nlCopies;
    els.planeQuadrants.value = settings.planeQuadrants;
    els.planeXMin.value = settings.planeXMin; els.planeXMax.value = settings.planeXMax;
    els.planeYMin.value = settings.planeYMin; els.planeYMax.value = settings.planeYMax;
    els.planeInterval.value = settings.planeInterval; els.planeLabelEvery.value = settings.planeLabelEvery;
  }

  function readFormIntoSettings() {
    settings.orientation = els.orientation.value;
    var preset = els.gridSizePreset.value;
    settings.gridSizePreset = preset;
    settings.gridSizeCustom = parseFloat(els.gridSizeCustom.value) || 4;
    settings.exactCount = els.exactCount.checked;
    settings.exactCols = parseInt(els.exactCols.value, 10) || 1;
    settings.exactRows = parseInt(els.exactRows.value, 10) || 1;
    settings.boldCenter = els.boldCenter.checked;

    settings.nlMin = parseFloat(els.nlMin.value) || 0;
    settings.nlMax = parseFloat(els.nlMax.value) || 0;
    settings.nlInterval = parseFloat(els.nlInterval.value) || 1;
    settings.nlLabelEvery = parseInt(els.nlLabelEvery.value, 10) || 1;
    settings.nlCopies = parseInt(els.nlCopies.value, 10) || 1;

    settings.planeQuadrants = els.planeQuadrants.value;
    settings.planeXMin = parseFloat(els.planeXMin.value) || 0;
    settings.planeXMax = parseFloat(els.planeXMax.value) || 0;
    settings.planeYMin = parseFloat(els.planeYMin.value) || 0;
    settings.planeYMax = parseFloat(els.planeYMax.value) || 0;
    settings.planeInterval = parseFloat(els.planeInterval.value) || 1;
    settings.planeLabelEvery = parseInt(els.planeLabelEvery.value, 10) || 1;
  }

  function gridSizeInches() {
    return settings.gridSizePreset === 'custom' ? (1 / settings.gridSizeCustom) : parseFloat(settings.gridSizePreset);
  }

  function render() {
    readFormIntoSettings();
    persist();

    var result;
    if (settings.mode === 'graph') {
      result = window.GraphPaperRender.renderGraphPaper({
        orientation: settings.orientation,
        mode: settings.exactCount ? 'exact' : 'fill',
        cellSize: gridSizeInches(),
        cols: settings.exactCols,
        rows: settings.exactRows,
        boldCenter: settings.boldCenter
      });
    } else if (settings.mode === 'numberline') {
      result = window.GraphPaperRender.renderNumberLine({
        orientation: settings.orientation,
        min: settings.nlMin, max: settings.nlMax,
        interval: settings.nlInterval, labelEvery: settings.nlLabelEvery, copies: settings.nlCopies
      });
    } else {
      result = window.GraphPaperRender.renderCoordinatePlane({
        orientation: settings.orientation,
        quadrants: settings.planeQuadrants,
        xMin: settings.planeXMin, xMax: settings.planeXMax,
        yMin: settings.planeYMin, yMax: settings.planeYMax,
        interval: settings.planeInterval, labelEvery: settings.planeLabelEvery
      });
    }
    els.previewArea.innerHTML = result.svg;
  }

  /* ---------- wiring ---------- */
  Array.prototype.slice.call(document.querySelectorAll('.mode-tab')).forEach(function (tab) {
    tab.addEventListener('click', function () {
      Array.prototype.slice.call(document.querySelectorAll('.mode-tab')).forEach(function (t) { t.classList.remove('active'); });
      Array.prototype.slice.call(document.querySelectorAll('.mode-panel')).forEach(function (p) { p.classList.remove('active'); });
      tab.classList.add('active');
      settings.mode = tab.dataset.mode;
      document.getElementById('panel-' + settings.mode).classList.add('active');
      render();
    });
  });

  els.gridSizePreset.addEventListener('change', function () {
    els.gridSizeCustom.style.display = els.gridSizePreset.value === 'custom' ? '' : 'none';
    render();
  });
  els.exactCount.addEventListener('change', function () {
    els.exactCountFields.style.display = els.exactCount.checked ? '' : 'none';
    render();
  });

  Array.prototype.slice.call(document.querySelectorAll('input, select')).forEach(function (el) {
    el.addEventListener('input', render);
    el.addEventListener('change', render);
  });

  els.printBtn.addEventListener('click', function () { window.print(); });

  /* ---------- boot ---------- */
  loadSaved();
  applySettingsToForm();
  if (settings.mode !== 'graph') {
    document.querySelectorAll('.mode-tab').forEach(function (t) { t.classList.toggle('active', t.dataset.mode === settings.mode); });
    document.querySelectorAll('.mode-panel').forEach(function (p) { p.classList.toggle('active', p.id === 'panel-' + settings.mode); });
  }
  render();
})();
</script>
</body>
</html>
