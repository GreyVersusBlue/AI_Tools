<script src="../_shared/theme-toggle.js"></script>
<style>
  :root {
    --color-bg: #f5f4f0;
    --color-surface: #ffffff;
    --color-text: #1a1a1a;
    --color-dim: #5b6b78;
    --color-divider: #e1e5ea;
    --color-accent: #2a6db0;
    --color-success: #2f8f5b;
    --color-danger: #c43a2f;
    --radius: 10px;
  }
  [data-theme="dark"] {
    --color-bg: #14181c;
    --color-surface: #1e242b;
    --color-text: #eef1f4;
    --color-dim: #9aa7b2;
    --color-divider: #333c44;
    --color-accent: #5b9bd9;
    --color-success: #4caf7d;
    --color-danger: #e0665a;
  }
  * { box-sizing: border-box; }
  html { background: var(--color-bg); }
  body {
    font-family: 'Segoe UI', system-ui, sans-serif;
    background: var(--color-bg);
    color: var(--color-text);
    min-height: 100vh;
    margin: 0;
    padding: 1.5rem 1rem 3rem;
    transition: background 0.15s ease, color 0.15s ease;
  }
  .container { max-width: 780px; margin: 0 auto; }

  .app-header { display: flex; align-items: center; justify-content: space-between; gap: 1rem; margin-bottom: 1.25rem; flex-wrap: wrap; }
  .app-header h1 { font-size: 1.6rem; margin: 0; }
  .back-link { color: var(--color-dim); text-decoration: none; font-size: 0.9rem; }
  .back-link:hover { color: var(--color-accent); }
  .header-actions { display: flex; align-items: center; gap: 0.75rem; }

  button, select, input[type="number"] {
    font-family: inherit;
    font-size: 0.95rem;
    color: var(--color-text);
    background: var(--color-surface);
    border: 1px solid var(--color-divider);
    border-radius: 8px;
    padding: 0.5rem 0.8rem;
  }
  button { cursor: pointer; }
  button:hover:not(:disabled) { border-color: var(--color-accent); }
  button:disabled { opacity: 0.45; cursor: default; }

  #themeToggle { font-size: 0.9rem; }

  .mode-tabs { display: flex; flex-wrap: wrap; gap: 0.4rem; margin-bottom: 1.5rem; }
  .mode-tab {
    flex: 1 1 auto;
    min-width: 100px;
    padding: 0.6rem 0.5rem;
    text-align: center;
    font-weight: 600;
    font-size: 0.85rem;
  }
  .mode-tab.active { background: var(--color-accent); border-color: var(--color-accent); color: #fff; }

  .timer-stage { display: flex; flex-direction: column; align-items: center; gap: 1.25rem; margin-bottom: 1.5rem; }
  .ring-wrap { position: relative; width: min(70vw, 340px); aspect-ratio: 1; }
  .ring-wrap.ring-hidden .progress-ring { visibility: hidden; }
  .progress-ring { width: 100%; height: 100%; transform: rotate(-90deg); }
  .ring-bg { fill: none; stroke: var(--color-divider); stroke-width: 10; }
  .ring-fg {
    fill: none;
    stroke: var(--color-accent);
    stroke-width: 10;
    stroke-linecap: round;
    transition: stroke-dashoffset 0.15s linear;
  }
  .stage-center {
    position: absolute; inset: 0;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 0.35rem; text-align: center; padding: 0 0.5rem;
  }
  #timeDisplay {
    font-family: 'Consolas', 'SFMono-Regular', ui-monospace, monospace;
    font-size: clamp(2.6rem, 12vw, 4.4rem);
    font-weight: 700;
    line-height: 1;
    font-variant-numeric: tabular-nums;
  }
  #timeDisplay.flash { animation: flashPulse 1.1s ease-in-out 2; }
  @keyframes flashPulse {
    0%, 100% { color: var(--color-text); }
    50% { color: var(--color-danger); }
  }
  #subDisplay { font-size: 0.95rem; color: var(--color-dim); min-height: 1.2em; }

  .controls { display: flex; gap: 0.6rem; flex-wrap: wrap; justify-content: center; }
  .controls button { font-size: 1.05rem; font-weight: 600; padding: 0.65rem 1.6rem; min-width: 110px; }
  .btn-primary { background: var(--color-accent); border-color: var(--color-accent); color: #fff; }
  .btn-danger-outline { color: var(--color-danger); border-color: var(--color-danger); }

  .panel-disabled { opacity: 0.5; pointer-events: none; }

  .card {
    background: var(--color-surface);
    border: 1px solid var(--color-divider);
    border-radius: var(--radius);
    padding: 1.1rem 1.25rem;
    margin-bottom: 1rem;
  }
  .card h2 { font-size: 0.8rem; text-transform: uppercase; letter-spacing: 0.05em; color: var(--color-dim); margin: 0 0 0.8rem; }

  .field-row { display: flex; align-items: center; gap: 0.6rem; flex-wrap: wrap; }
  .field-row label { font-size: 0.85rem; color: var(--color-dim); }
  .num-input { width: 4.2rem; text-align: center; }
  .field-sep { font-weight: 700; padding: 0 0.15rem; }

  .preset-row { display: flex; gap: 0.5rem; flex-wrap: wrap; margin-top: 0.7rem; }
  .preset-row button { flex: 1 1 auto; min-width: 64px; font-weight: 600; }
  .preset-row.big button { font-size: 1.1rem; padding: 0.9rem 0.5rem; }

  .laps-list { list-style: none; margin: 0.7rem 0 0; padding: 0; font-variant-numeric: tabular-nums; font-size: 0.9rem; max-height: 160px; overflow-y: auto; }
  .laps-list li { padding: 0.25rem 0; border-bottom: 1px solid var(--color-divider); }

  .sound-row { display: flex; align-items: center; gap: 0.9rem; flex-wrap: wrap; }
  .sound-row label { font-size: 0.85rem; color: var(--color-dim); }
  input[type="range"] { width: 120px; }
  .mute-check { display: flex; align-items: center; gap: 0.35rem; font-size: 0.85rem; color: var(--color-dim); }

  .checkbox-row { display: flex; align-items: center; gap: 0.4rem; font-size: 0.9rem; }

  @media (max-width: 480px) {
    .app-header h1 { font-size: 1.3rem; }
  }
</style>
</head>
<body>
<div class="container">

  <header class="app-header">
    <div>
      <a class="back-link" href="../index.html">← All tools</a>
      <h1>Classroom Timer</h1>
    </div>
    <div class="header-actions">
      <button id="themeToggle">☾ Dark mode</button>
    </div>
  </header>

  <nav class="mode-tabs" role="tablist" aria-label="Timer mode">
    <button class="mode-tab" role="tab" data-mode="countdown">Countdown</button>
    <button class="mode-tab" role="tab" data-mode="transition">Transition</button>
    <button class="mode-tab" role="tab" data-mode="random">Random Interval</button>
    <button class="mode-tab" role="tab" data-mode="stopwatch">Stopwatch</button>
    <button class="mode-tab" role="tab" data-mode="roundrobin">Round-Robin</button>
  </nav>

  <main class="timer-stage">
    <div class="ring-wrap" id="ringWrap">
      <svg class="progress-ring" viewBox="0 0 200 200" aria-hidden="true">
        <circle class="ring-bg" cx="100" cy="100" r="90"></circle>
        <circle class="ring-fg" id="ringFg" cx="100" cy="100" r="90"></circle>
      </svg>
      <div class="stage-center">
        <div id="timeDisplay" aria-live="polite">05:00</div>
        <div id="subDisplay"></div>
      </div>
    </div>

    <div class="controls">
      <button id="startBtn" class="btn-primary">Start</button>
      <button id="pauseBtn" hidden>Pause</button>
      <button id="resumeBtn" class="btn-primary" hidden>Resume</button>
      <button id="resetBtn" class="btn-danger-outline">Reset</button>
    </div>
  </main>

  <section id="modeSettings">
    <div class="card settings-panel" data-panel="countdown">
      <h2>Countdown</h2>
      <div class="field-row">
        <label for="cdMinutes">Minutes</label>
        <input type="number" id="cdMinutes" class="num-input" min="0" max="180">
        <span class="field-sep">:</span>
        <label for="cdSeconds" class="sr-only">Seconds</label>
        <input type="number" id="cdSeconds" class="num-input" min="0" max="59">
      </div>
      <div class="preset-row">
        <button type="button" class="cd-preset" data-min="5">5m</button>
        <button type="button" class="cd-preset" data-min="10">10m</button>
        <button type="button" class="cd-preset" data-min="15">15m</button>
        <button type="button" class="cd-preset" data-min="20">20m</button>
        <button type="button" class="cd-preset" data-min="30">30m</button>
      </div>
    </div>

    <div class="card settings-panel" data-panel="transition" hidden>
      <h2>Transition — one click to start</h2>
      <div class="preset-row big">
        <button type="button" class="tr-preset" data-min="1">1 min</button>
        <button type="button" class="tr-preset" data-min="2">2 min</button>
        <button type="button" class="tr-preset" data-min="5">5 min</button>
      </div>
      <div class="field-row" style="margin-top: 0.9rem;">
        <label for="trMinutes">Custom</label>
        <input type="number" id="trMinutes" class="num-input" min="0" max="60">
        <span class="field-sep">:</span>
        <input type="number" id="trSeconds" class="num-input" min="0" max="59">
        <button type="button" id="trCustomStart">Start</button>
      </div>
    </div>

    <div class="card settings-panel" data-panel="random" hidden>
      <h2>Random Interval</h2>
      <p style="font-size: 0.85rem; color: var(--color-dim); margin: 0 0 0.7rem;">Fires once at a random moment between the two times below. The countdown stays hidden so it's a genuine surprise.</p>
      <div class="field-row">
        <label for="rndMin">From</label>
        <input type="number" id="rndMin" class="num-input" min="0" max="120">
        <span style="font-size:0.85rem; color: var(--color-dim);">min</span>
        <label for="rndMax">to</label>
        <input type="number" id="rndMax" class="num-input" min="0" max="120">
        <span style="font-size:0.85rem; color: var(--color-dim);">min</span>
      </div>
    </div>

    <div class="card settings-panel" data-panel="stopwatch" hidden>
      <h2>Stopwatch</h2>
      <div class="field-row">
        <button type="button" id="swLap">Lap</button>
      </div>
      <ul class="laps-list" id="swLaps"></ul>
    </div>

    <div class="card settings-panel" data-panel="roundrobin" hidden>
      <h2>Round-Robin</h2>
      <div class="field-row">
        <label for="rrMinutes">Per station</label>
        <input type="number" id="rrMinutes" class="num-input" min="0" max="60">
        <span class="field-sep">:</span>
        <input type="number" id="rrSeconds" class="num-input" min="0" max="59">
      </div>
      <div class="field-row" style="margin-top: 0.7rem;">
        <label for="rrStations">Stations</label>
        <input type="number" id="rrStations" class="num-input" min="2" max="20">
        <span class="checkbox-row">
          <input type="checkbox" id="rrLoop">
          <label for="rrLoop">Repeat when finished</label>
        </span>
      </div>
    </div>
  </section>

  <section class="card">
    <h2>Alert Sound</h2>
    <div class="sound-row">
      <label for="soundChoice">Sound</label>
      <select id="soundChoice">
        <option value="chime">Chime</option>
        <option value="bell">Bell</option>
        <option value="buzzer">Buzzer</option>
        <option value="none">None</option>
      </select>
      <label for="soundVolume">Volume</label>
      <input type="range" id="soundVolume" min="0" max="1" step="0.05">
      <span class="mute-check">
        <input type="checkbox" id="soundMute">
        <label for="soundMute">Mute</label>
      </span>
      <button type="button" id="soundTest">Test sound</button>
    </div>
  </section>

</div>
<script type="module" src="classroom-timer/ct-app.js"></script>
</body>
</html>
