<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Duty Roster Builder</title>
<meta name="description" content="Build a rotating weekly hallway/cafeteria/bus duty assignment grid across staff and print it for the workroom board.">
<meta property="og:type" content="website">
<meta property="og:site_name" content="AsPerMyLessonPlan.com">
<meta property="og:url" content="https://www.aspermylessonplan.com/Tools/duty-roster-builder.html">
<meta property="og:title" content="Duty Roster Builder — AsPerMyLessonPlan.com">
<meta property="og:description" content="Build a rotating weekly hallway/cafeteria/bus duty assignment grid across staff and print it for the workroom board.">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="Duty Roster Builder — AsPerMyLessonPlan.com">
<meta name="twitter:description" content="Build a rotating weekly hallway/cafeteria/bus duty assignment grid across staff and print it for the workroom board.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%23F6F7F9'/%3E%3Cpath d='M7 9h18M7 16h18M7 23h18' stroke='%231f3550' stroke-width='2.4' stroke-linecap='round'/%3E%3C/svg%3E">
<style>
  :root {
    --ink: #1f2430; --paper: #fafaf8; --card: #fff;
    --line: #dcdad2; --line-strong: #c3c0b6;
    --accent: #1f3550; --accent-2: #2e6b8f; --muted: #6b6a63; --err: #a3372b;
  }
  * { box-sizing: border-box; }
  body {
    font-family: "Segoe UI", Georgia, "Times New Roman", serif;
    background: var(--paper); color: var(--ink); margin: 0;
    padding: 24px 20px 100px; line-height: 1.45;
  }
  .wrap { max-width: 1280px; margin: 0 auto; }
  .app-header { display: flex; align-items: baseline; justify-content: space-between; gap: 1rem; flex-wrap: wrap; margin-bottom: 1.4rem; }
  .app-header h1 { font-size: 1.7rem; margin: 0 0 .2rem; }
  .app-header .sub { color: var(--muted); font-size: .88rem; margin: 0; }
  .back-link { color: var(--muted); text-decoration: none; font-size: .88rem; }
  .back-link:hover { color: var(--accent-2); }

  .card { background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 1.1rem 1.2rem; margin-bottom: 1rem; }
  .card h2 { font-size: 1rem; margin: 0 0 .7rem; }
  label { display: block; font-weight: 600; font-size: .82rem; margin-bottom: .3rem; }
  .hint { color: var(--muted); font-size: .78rem; margin: -.15rem 0 .6rem; }
  input[type="text"], textarea, select {
    width: 100%; font-family: inherit; font-size: .9rem; color: var(--ink);
    background: #fff; border: 1px solid var(--line-strong); border-radius: 6px;
    padding: .45rem .55rem; margin-bottom: .6rem;
  }
  textarea { resize: vertical; min-height: 4.5rem; }

  button {
    font-family: inherit; font-size: .92rem; font-weight: 600; cursor: pointer;
    background: var(--accent); color: #fff; border: 1px solid var(--accent);
    border-radius: 7px; padding: .55rem 1rem;
  }
  button:hover { background: var(--accent-2); border-color: var(--accent-2); }
  button.secondary { background: #fff; color: var(--ink); border-color: var(--line-strong); }
  button.secondary:hover { background: #f1f0ea; border-color: var(--muted); color: var(--ink); }
  button.danger { background: #fff; color: var(--err); border-color: var(--err); }
  button.danger:hover { background: var(--err); color: #fff; }
  button.small { padding: .2rem .5rem; font-size: .76rem; }
  .btnrow { display: flex; gap: .5rem; flex-wrap: wrap; margin-bottom: .8rem; }

  .duty-row { display: flex; align-items: center; gap: .5rem; padding: .25rem 0; }
  .duty-row input { margin-bottom: 0; }

  table.roster-grid { width: 100%; border-collapse: collapse; font-size: .88rem; }
  table.roster-grid th, table.roster-grid td { border: 1px solid var(--line-strong); padding: .5rem .5rem; text-align: left; vertical-align: middle; }
  table.roster-grid th { background: #eef1f4; font-size: .78rem; text-transform: uppercase; letter-spacing: .03em; color: var(--muted); }
  table.roster-grid td select { margin-bottom: 0; }
  table.roster-grid .duty-name-cell { font-weight: 700; white-space: nowrap; }
  table.roster-grid .duty-name-cell input { margin-bottom: 0; font-weight: 700; }

  #printArea { display: none; }
  .print-title { font-size: 1.4rem; margin: 0 0 .2rem; text-align: center; }
  .print-sub { color: #555; font-size: .85rem; margin: 0 0 1rem; text-align: center; }
  table.print-grid { width: 100%; border-collapse: collapse; font-size: 1rem; }
  table.print-grid th, table.print-grid td { border: 1px solid #666; padding: .6rem .6rem; text-align: center; }
  table.print-grid th { background: #eee; }
  table.print-grid td:first-child, table.print-grid th:first-child { text-align: left; font-weight: 700; }

  @media print {
    body * { visibility: hidden; }
    #printArea, #printArea * { visibility: visible; }
    #printArea { display: block; position: absolute; top: 0; left: 0; width: 100%; padding: 0; margin: 0; }
  }
</style>
</head>
<body>
<div class="wrap">
  <div class="app-header">
    <div>
      <a class="back-link" href="../index.html">&larr; Toolkit</a>
      <h1>Duty Roster Builder</h1>
      <p class="sub">Assign staff to duty locations across the week, auto-fill a rotation, and print it for the workroom board.</p>
    </div>
    <div class="btnrow" style="margin-bottom:0;">
      <button class="secondary" id="printBtn">Print roster</button>
    </div>
  </div>

  <div class="card">
    <h2>Staff</h2>
    <label for="staffInput">Staff names, one per line</label>
    <textarea id="staffInput" placeholder="Alex Rivera&#10;Bailey Chen&#10;Carter Diaz"></textarea>
    <button class="secondary" id="saveStaffBtn">Save staff list</button>
  </div>

  <div class="card">
    <h2>Duty locations</h2>
    <div id="dutiesWrap"></div>
    <button class="secondary small" id="addDutyBtn">+ Add duty location</button>
  </div>

  <div class="card">
    <div class="btnrow">
      <h2 style="margin:0;flex:1;">Weekly grid</h2>
      <button class="secondary small" id="autoFillBtn">Auto-fill round robin</button>
      <button class="danger small" id="clearGridBtn">Clear grid</button>
    </div>
    <div style="overflow-x:auto;">
      <table class="roster-grid" id="gridTable"></table>
    </div>
  </div>
</div>

<div id="printArea">
  <h1 class="print-title">Duty Roster</h1>
  <p class="print-sub" id="printSub"></p>
  <table class="print-grid" id="printGrid"></table>
</div>

<script>
(function () {
  'use strict';
  var STORE_KEY = 'drb_roster_v1';
  var DAYS = ['Monday', 'Tuesday', 'Wednesday', 'Thursday', 'Friday'];

  var els = {};
  ['staffInput', 'saveStaffBtn', 'dutiesWrap', 'addDutyBtn', 'gridTable', 'autoFillBtn', 'clearGridBtn',
   'printBtn', 'printSub', 'printGrid'].forEach(function (id) { els[id] = document.getElementById(id); });

  var state = { staff: [], duties: [], assignments: {} };

  function uid() { return 'd' + Date.now().toString(36) + Math.random().toString(36).slice(2, 6); }
  function escapeHtml(s) {
    return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }
  function escapeAttr(s) { return String(s == null ? '' : s).replace(/"/g, '&quot;'); }

  function load() {
    try {
      var saved = JSON.parse(localStorage.getItem(STORE_KEY) || 'null');
      if (saved && Array.isArray(saved.duties)) state = saved;
    } catch (e) { /* ignore */ }
    if (!state.staff) state.staff = [];
    if (!state.duties.length) state.duties = [
      { id: uid(), name: 'Hallway (2nd floor)' },
      { id: uid(), name: 'Cafeteria' },
      { id: uid(), name: 'Bus loop' }
    ];
    if (!state.assignments) state.assignments = {};
  }
  function save() {
    try { localStorage.setItem(STORE_KEY, JSON.stringify(state)); } catch (e) { /* storage full/blocked */ }
  }

  function cellKey(dutyId, day) { return dutyId + '|' + day; }

  function renderDuties() {
    els.dutiesWrap.innerHTML = state.duties.map(function (d) {
      return '<div class="duty-row" data-id="' + d.id + '">' +
        '<input type="text" data-duty="' + d.id + '" value="' + escapeAttr(d.name) + '">' +
        '<button type="button" class="danger small" data-del-duty="' + d.id + '">&times;</button>' +
        '</div>';
    }).join('');
  }
  els.dutiesWrap.addEventListener('input', function (ev) {
    var id = ev.target.getAttribute('data-duty');
    if (!id) return;
    var d = state.duties.find(function (x) { return x.id === id; });
    if (d) d.name = ev.target.value;
    save(); renderGrid();
  });
  els.dutiesWrap.addEventListener('click', function (ev) {
    var id = ev.target.getAttribute('data-del-duty');
    if (!id) return;
    state.duties = state.duties.filter(function (d) { return d.id !== id; });
    save(); renderDuties(); renderGrid();
  });
  els.addDutyBtn.addEventListener('click', function () {
    state.duties.push({ id: uid(), name: 'New duty location' });
    save(); renderDuties(); renderGrid();
  });

  els.saveStaffBtn.addEventListener('click', function () {
    var names = els.staffInput.value.split('\n').map(function (s) { return s.trim(); }).filter(Boolean);
    var seen = {}; var unique = [];
    names.forEach(function (n) { if (!seen[n]) { seen[n] = true; unique.push(n); } });
    state.staff = unique;
    save(); renderGrid();
  });

  function renderGrid() {
    var head = '<tr><th>Duty</th>' + DAYS.map(function (d) { return '<th>' + d + '</th>'; }).join('') + '</tr>';
    var rows = state.duties.map(function (duty) {
      var cells = DAYS.map(function (day) {
        var key = cellKey(duty.id, day);
        var current = state.assignments[key] || '';
        var options = '<option value="">&mdash;</option>' + state.staff.map(function (name) {
          return '<option value="' + escapeAttr(name) + '"' + (name === current ? ' selected' : '') + '>' + escapeHtml(name) + '</option>';
        }).join('');
        return '<td><select data-duty="' + duty.id + '" data-day="' + day + '">' + options + '</select></td>';
      }).join('');
      return '<tr><td class="duty-name-cell">' + escapeHtml(duty.name) + '</td>' + cells + '</tr>';
    }).join('');
    els.gridTable.innerHTML = head + rows;
  }

  els.gridTable.addEventListener('change', function (ev) {
    var dutyId = ev.target.getAttribute('data-duty');
    var day = ev.target.getAttribute('data-day');
    if (!dutyId || !day) return;
    state.assignments[cellKey(dutyId, day)] = ev.target.value;
    save();
  });

  els.autoFillBtn.addEventListener('click', function () {
    if (!state.staff.length) { alert('Save a staff list first.'); return; }
    var i = 0;
    DAYS.forEach(function (day) {
      state.duties.forEach(function (duty) {
        state.assignments[cellKey(duty.id, day)] = state.staff[i % state.staff.length];
        i++;
      });
    });
    save(); renderGrid();
  });

  els.clearGridBtn.addEventListener('click', function () {
    if (!confirm('Clear every assignment in the grid?')) return;
    state.assignments = {};
    save(); renderGrid();
  });

  els.printBtn.addEventListener('click', function () {
    els.printSub.textContent = 'Printed ' + new Date().toLocaleDateString();
    var head = '<tr><th>Duty</th>' + DAYS.map(function (d) { return '<th>' + d + '</th>'; }).join('') + '</tr>';
    var rows = state.duties.map(function (duty) {
      var cells = DAYS.map(function (day) {
        var name = state.assignments[cellKey(duty.id, day)] || '';
        return '<td>' + escapeHtml(name) + '</td>';
      }).join('');
      return '<tr><td>' + escapeHtml(duty.name) + '</td>' + cells + '</tr>';
    }).join('');
    els.printGrid.innerHTML = head + rows;
    window.print();
  });

  /* ---------- boot ---------- */
  load();
  els.staffInput.value = state.staff.join('\n');
  renderDuties();
  renderGrid();
})();
</script>
<script>
if ('serviceWorker' in navigator) {
  window.addEventListener('load', function () {
    navigator.serviceWorker.register('../sw.js').catch(function () {});
  });
}
</script>
</body>
</html>
