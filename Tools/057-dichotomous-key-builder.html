<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dichotomous Key Builder</title>
<meta name="description" content="Build a custom dichotomous key for a classification lab, then print it as a student worksheet with an answer key.">

<meta property="og:site_name" content="AsPerMyLessonPlan.com">

<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%23F6F7F9'/%3E%3Cpath d='M16 6v6M16 12l-7 6M16 12l7 6' stroke='%231f3550' stroke-width='2' stroke-linecap='round'/%3E%3Ccircle cx='16' cy='6' r='2' fill='%231f3550'/%3E%3Ccircle cx='9' cy='20' r='2' fill='%231f3550'/%3E%3Ccircle cx='23' cy='20' r='2' fill='%231f3550'/%3E%3C/svg%3E">
<style>
  :root {
    --ink: #1f2430; --paper: #fafaf8; --card: #fff;
    --line: #dcdad2; --line-strong: #c3c0b6;
    --accent: #1f3550; --accent-2: #2e6b8f; --muted: #6b6a63; --err: #a3372b;
  }
  * { box-sizing: border-box; }
  body {
    font-family: "Segoe UI", Georgia, "Times New Roman", serif;
    background: var(--paper); color: var(--ink); margin: 0;
    padding: 24px 20px 100px; line-height: 1.45;
  }
  .wrap { max-width: 1100px; margin: 0 auto; }
  .app-header { display: flex; align-items: baseline; justify-content: space-between; gap: 1rem; flex-wrap: wrap; margin-bottom: 1.4rem; }
  .app-header h1 { font-size: 1.7rem; margin: 0 0 .2rem; }
  .app-header .sub { color: var(--muted); font-size: .88rem; margin: 0; }
  .back-link { color: var(--muted); text-decoration: none; font-size: .88rem; }
  .back-link:hover { color: var(--accent-2); }

  .card { background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 1.1rem 1.2rem; margin-bottom: 1rem; }
  .card h2 { font-size: 1rem; margin: 0 0 .7rem; }
  label { display: block; font-weight: 600; font-size: .78rem; margin-bottom: .2rem; }
  input[type="text"], select {
    width: 100%; font-family: inherit; font-size: .88rem; color: var(--ink);
    background: #fff; border: 1px solid var(--line-strong); border-radius: 6px;
    padding: .4rem .5rem; margin-bottom: .4rem;
  }

  button {
    font-family: inherit; font-size: .92rem; font-weight: 600; cursor: pointer;
    background: var(--accent); color: #fff; border: 1px solid var(--accent);
    border-radius: 7px; padding: .55rem 1rem;
  }
  button:hover { background: var(--accent-2); border-color: var(--accent-2); }
  button.secondary { background: #fff; color: var(--ink); border-color: var(--line-strong); }
  button.secondary:hover { background: #f1f0ea; border-color: var(--muted); color: var(--ink); }
  button.danger { background: #fff; color: var(--err); border-color: var(--err); }
  button.danger:hover { background: var(--err); color: #fff; }
  button.small { padding: .2rem .5rem; font-size: .76rem; }
  .btnrow { display: flex; gap: .6rem; flex-wrap: wrap; }

  .step-block { border: 1px solid var(--line); border-radius: 8px; padding: .8rem .9rem; margin-bottom: .8rem; }
  .step-block h3 { font-size: .95rem; margin: 0 0 .5rem; color: var(--accent); }
  .choice-row { display: grid; grid-template-columns: 1.5rem 2fr 1fr 1fr; gap: .5rem; align-items: start; margin-bottom: .4rem; }
  .choice-row .letter { font-weight: 700; padding-top: .4rem; }
  .choice-row input, .choice-row select { margin-bottom: 0; }

  #printArea { display: none; }
  .print-title { font-size: 1.3rem; margin: 0 0 .8rem; }
  .key-couplet { margin-bottom: .5rem; font-size: .92rem; }
  .key-couplet .cnum { font-weight: 700; }
  table.spec-table { width: 100%; border-collapse: collapse; margin-top: 1rem; font-size: .9rem; }
  table.spec-table th, table.spec-table td { border: 1px solid #999; padding: .4rem .5rem; text-align: left; }
  table.spec-table th { background: #eee; }
  .sheet-page { page-break-after: always; }

  @media print {
    body * { visibility: hidden; }
    #printArea, #printArea * { visibility: visible; }
    #printArea { display: block; position: absolute; top: 0; left: 0; width: 100%; padding: 0; margin: 0; }
  }
</style>
</head>
<body>
<div class="wrap">
  <div class="app-header">
    <div>
      <a class="back-link" href="../index.html">&larr; Toolkit</a>
      <h1>Dichotomous Key Builder</h1>
      <p class="sub">Build numbered couplets, tag examples under each result, print a worksheet and answer key.</p>
    </div>
    <div class="btnrow">
      <button class="secondary" id="printBtn">Print worksheet + key</button>
    </div>
  </div>

  <div class="card">
    <label for="keyTitle">Key title</label>
    <input type="text" id="keyTitle" placeholder="e.g. Classifying Common Animals">
  </div>

  <div class="card">
    <h2>Steps</h2>
    <div id="stepsWrap"></div>
    <button class="secondary" id="addStepBtn">+ Add step</button>
  </div>
</div>

<div id="printArea"></div>

<script>
(function () {
  'use strict';
  var STORE_KEY = 'dkb_key_v1';

  var els = {};
  ['keyTitle', 'stepsWrap', 'addStepBtn', 'printBtn', 'printArea'].forEach(function (id) { els[id] = document.getElementById(id); });

  var state = { title: '', steps: [] };

  function uid() { return 's' + Date.now().toString(36) + Math.random().toString(36).slice(2, 6); }
  function escapeHtml(s) {
    return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }
  function escapeAttr(s) { return String(s == null ? '' : s).replace(/"/g, '&quot;'); }
  function blankChoice() { return { text: '', leadsTo: '', result: '', examples: '' }; }

  function load() {
    try {
      var saved = JSON.parse(localStorage.getItem(STORE_KEY) || 'null');
      if (saved && Array.isArray(saved.steps) && saved.steps.length) state = saved;
    } catch (e) { /* ignore */ }
    if (!state.steps.length) {
      var step1Id = uid(), step2Id = uid();
      state.steps = [
        { id: step1Id, a: { text: 'Has a backbone', leadsTo: step2Id, result: '', examples: '' }, b: { text: 'No backbone', leadsTo: '', result: 'Invertebrate', examples: 'Earthworm, Jellyfish' } },
        { id: step2Id, a: { text: 'Has fur', leadsTo: '', result: 'Mammal', examples: 'Dog, Whale' }, b: { text: 'No fur', leadsTo: '', result: 'Reptile, bird, fish, or amphibian', examples: 'Snake, Robin' } }
      ];
    }
  }
  function save() {
    try { localStorage.setItem(STORE_KEY, JSON.stringify(state)); } catch (e) { /* storage full/blocked */ }
  }

  function stepNumber(id) {
    var idx = state.steps.findIndex(function (s) { return s.id === id; });
    return idx === -1 ? '?' : idx + 1;
  }

  function choiceOptionsHtml(currentLeadsTo, selfId) {
    var opts = '<option value=""' + (currentLeadsTo === '' ? ' selected' : '') + '>Final answer</option>';
    state.steps.forEach(function (s) {
      if (s.id === selfId) return;
      opts += '<option value="' + s.id + '"' + (currentLeadsTo === s.id ? ' selected' : '') + '>Go to step ' + stepNumber(s.id) + '</option>';
    });
    return opts;
  }

  function renderSteps() {
    els.stepsWrap.innerHTML = state.steps.map(function (step, i) {
      function choiceHtml(letter, choice) {
        var isFinal = !choice.leadsTo;
        return '<div class="choice-row" data-step="' + step.id + '" data-choice="' + letter + '">' +
          '<div class="letter">' + (i + 1) + letter + '.</div>' +
          '<div><label>Description</label><input type="text" data-field="text" value="' + escapeAttr(choice.text) + '" placeholder="e.g. Has feathers"></div>' +
          '<div><label>Leads to</label><select data-field="leadsTo">' + choiceOptionsHtml(choice.leadsTo, step.id) + '</select></div>' +
          (isFinal
            ? '<div><label>Result</label><input type="text" data-field="result" value="' + escapeAttr(choice.result) + '" placeholder="e.g. Bird"><label style="margin-top:.3rem;">Example specimens (comma-separated)</label><input type="text" data-field="examples" value="' + escapeAttr(choice.examples) + '" placeholder="e.g. Robin, Eagle"></div>'
            : '<div></div>') +
          '</div>';
      }
      return '<div class="step-block"><h3>Step ' + (i + 1) + '</h3>' + choiceHtml('a', step.a) + choiceHtml('b', step.b) +
        '<button type="button" class="danger small" data-del-step="' + step.id + '" style="margin-top:.4rem;">Remove step</button></div>';
    }).join('');
  }

  els.stepsWrap.addEventListener('input', function (ev) {
    var row = ev.target.closest('.choice-row');
    if (!row) return;
    var stepId = row.getAttribute('data-step');
    var letter = row.getAttribute('data-choice');
    var field = ev.target.getAttribute('data-field');
    var step = state.steps.find(function (s) { return s.id === stepId; });
    if (!step || !field) return;
    step[letter][field] = ev.target.value;
    if (field === 'leadsTo') { save(); renderSteps(); return; }
    save();
  });

  els.stepsWrap.addEventListener('click', function (ev) {
    var id = ev.target.getAttribute('data-del-step');
    if (!id) return;
    state.steps = state.steps.filter(function (s) { return s.id !== id; });
    state.steps.forEach(function (s) {
      ['a', 'b'].forEach(function (letter) {
        if (s[letter].leadsTo === id) s[letter].leadsTo = '';
      });
    });
    save(); renderSteps();
  });

  els.addStepBtn.addEventListener('click', function () {
    state.steps.push({ id: uid(), a: blankChoice(), b: blankChoice() });
    save(); renderSteps();
  });

  els.keyTitle.addEventListener('input', function () { state.title = els.keyTitle.value; save(); });

  function leadsToLabel(choice) {
    if (choice.leadsTo) return 'Go to step ' + stepNumber(choice.leadsTo);
    return escapeHtml(choice.result || '&mdash;');
  }

  function shuffle(arr) {
    for (var i = arr.length - 1; i > 0; i--) {
      var j = Math.floor(Math.random() * (i + 1));
      var t = arr[i]; arr[i] = arr[j]; arr[j] = t;
    }
    return arr;
  }

  els.printBtn.addEventListener('click', function () {
    if (!state.steps.length) { alert('Add at least one step first.'); return; }
    var title = state.title.trim() || 'Dichotomous Key';
    var coupletsHtml = state.steps.map(function (step, i) {
      var n = i + 1;
      return '<div class="key-couplet"><span class="cnum">' + n + 'a.</span> ' + escapeHtml(step.a.text || '&hellip;') + ' &mdash; <em>' + leadsToLabel(step.a) + '</em></div>' +
        '<div class="key-couplet"><span class="cnum">' + n + 'b.</span> ' + escapeHtml(step.b.text || '&hellip;') + ' &mdash; <em>' + leadsToLabel(step.b) + '</em></div>';
    }).join('');

    var specimens = [];
    state.steps.forEach(function (step) {
      ['a', 'b'].forEach(function (letter) {
        var choice = step[letter];
        if (!choice.leadsTo && choice.examples) {
          choice.examples.split(',').map(function (s) { return s.trim(); }).filter(Boolean).forEach(function (name) {
            specimens.push({ name: name, result: choice.result || '' });
          });
        }
      });
    });
    var shuffled = shuffle(specimens.slice());
    var worksheetRows = shuffled.map(function (s) { return '<tr><td>' + escapeHtml(s.name) + '</td><td>&nbsp;</td></tr>'; }).join('');
    var keyRows = shuffled.map(function (s) { return '<tr><td>' + escapeHtml(s.name) + '</td><td>' + escapeHtml(s.result) + '</td></tr>'; }).join('');

    var specimenSection = specimens.length
      ? '<table class="spec-table"><thead><tr><th>Specimen</th><th>Classification</th></tr></thead><tbody>' + '{{ROWS}}' + '</tbody></table>'
      : '';

    els.printArea.innerHTML =
      '<div class="sheet-page"><h1 class="print-title">' + escapeHtml(title) + '</h1>' + coupletsHtml +
      (specimens.length ? '<h2 style="font-size:1.1rem;margin-top:1rem;">Classify these specimens using the key above</h2>' + specimenSection.replace('{{ROWS}}', worksheetRows) : '') +
      '</div>' +
      (specimens.length ? '<div><h1 class="print-title">Answer Key</h1>' + specimenSection.replace('{{ROWS}}', keyRows) + '</div>' : '');
    window.print();
  });

  /* ---------- boot ---------- */
  load();
  els.keyTitle.value = state.title;
  renderSteps();
})();
</script>
<script>
if ('serviceWorker' in navigator) {
  window.addEventListener('load', function () {
    navigator.serviceWorker.register('../sw.js').catch(function () {});
  });
}
</script>
</body>
</html>
