<!-- Native dark comes from _shared/ink-paper.css's [data-theme="dark"] block;
     opting in here keeps a11y.js from putting its CSS-filter invert on top.
     Read ink-paper.css's header before copying this into another tool. -->

<script src="../_shared/a11y.js"></script>

<link rel="stylesheet" href="../_shared/base.css">
<style>
  /* The two tint pairs the share note sits on, in 001's values with dark
     counterparts — ink-paper.css has no token for either. */
  :root { --err-bg: #fbecea; --err-line: #e6c6c1; --info-bg: #eaf1f5; --info-line: #c9dbe3; }
  :root[data-theme="dark"]:not(.a11y-filter-dark) {
    --err-bg: #3a201c; --err-line: #6d3a33; --info-bg: #1b2a35; --info-line: #33505f; }

  /* Share this sheet: the sheet itself is _shared/share.js (Path 6 P3). This
     is only the note under the header that records what it did. */
  .share-note { font-size: .8rem; line-height: 1.5; margin: .6rem 0 0; padding: .5rem .7rem;
    border-radius: 6px; background: var(--info-bg); border: 1px solid var(--info-line); word-break: break-word; }
  .share-note.error { background: var(--err-bg); border-color: var(--err); }
  .btnrow { display: flex; gap: .6rem; flex-wrap: wrap; }
  * { box-sizing: border-box; }
  body {
    font-family: "Segoe UI", Georgia, "Times New Roman", serif;
    background: var(--paper); color: var(--ink); margin: 0;
    padding: 24px 20px 100px; line-height: 1.45;
  }
  .wrap { max-width: 1100px; margin: 0 auto; }
  .app-header h1 { font-size: 1.7rem; margin: 0 0 .2rem; }
  .app-header .sub { color: var(--muted); font-size: .88rem; margin: 0; }
  .back-link { color: var(--muted); text-decoration: none; font-size: .88rem; }
  .back-link:hover { color: var(--accent-2); }

  .card h2 { font-size: 1rem; margin: 0 0 .7rem; }
  label { display: block; font-weight: 600; font-size: .82rem; margin-bottom: .3rem; }
  select, input[type="number"], input[type="text"] {
    font-family: inherit; font-size: .9rem; color: var(--ink);
    background: var(--card); border: 1px solid var(--line-strong); border-radius: 6px;
    padding: .45rem .6rem;
  }
  .controls { display: flex; flex-wrap: wrap; gap: 1rem; align-items: end; }
  .controls .field { min-width: 10rem; }
  .controls select, .controls input { width: 100%; }

  button {
    font-family: inherit; font-size: .92rem; font-weight: 600; cursor: pointer;
    background: var(--accent); color: var(--accent-ink); border: 1px solid var(--accent);
    border-radius: 7px; padding: .55rem 1rem;
  }
  button:hover { background: var(--accent-2); border-color: var(--accent-2); }
  button.secondary { background: var(--card); color: var(--ink); border-color: var(--line-strong); }
  button.secondary:hover { background: var(--card-2); border-color: var(--muted); color: var(--ink); }
  .tabs { display: flex; gap: .4rem; margin: 1rem 0; }
  .tabs button { background: var(--card); color: var(--ink); border-color: var(--line-strong); }
  .tabs button.active { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
  .view { display: none; }
  .view.active { display: block; }

  table.drill-table { width: 100%; border-collapse: collapse; font-size: .95rem; }
  table.drill-table th, table.drill-table td { border: 1px solid var(--line-strong); padding: .55rem .6rem; text-align: center; }
  table.drill-table th { background: var(--card-2); font-size: .78rem; text-transform: uppercase; color: var(--muted); }
  table.drill-table td.given { font-weight: 700; color: var(--accent); }
  table.drill-table td.blank { color: transparent; }
  table.drill-table td.answer { color: var(--accent-2); font-weight: 600; }

  @media print {
    body * { visibility: hidden; }
    #printArea, #printArea * { visibility: visible; }
    #printArea { display: block; position: absolute; top: 0; left: 0; width: 100%; padding: 0; margin: 0; }
    .sheet-page { page-break-after: always; }
  }
  #printArea { display: none; }
  .sheet-title { font-size: 1.3rem; margin: 0 0 .1rem; }
  .sheet-sub { color: #555; font-size: .85rem; margin: 0 0 1rem; }

<body>
<div class="wrap">
  <div class="app-header">
    <div>
      <a class="back-link" href="../index.html">&larr; Toolkit</a>
      <h1>Fraction&ndash;Decimal&ndash;Percent Conversion Drill Generator</h1>
      <p class="sub">Randomized conversion practice &mdash; one form given, two to fill in.</p>
    </div>
    <div class="btnrow">
      <button type="button" class="secondary" id="shareBtn">&#128279; Share this sheet&hellip;</button>
    </div>
  </div>
  <p id="shareNote" class="share-note" style="display:none;" aria-live="polite"></p>

  <div class="card">
    <div class="controls">
      <div class="field">
        <label for="difficulty">Difficulty</label>
        <select id="difficulty">
          <option value="easy">Easy (halves, quarters, fifths, tenths&hellip;)</option>
          <option value="medium" selected>Medium (adds thirds, sixths, eighths)</option>
          <option value="hard">Hard (any denominator 2&ndash;20, rounded decimals)</option>
        </select>
      </div>
      <div class="field">
        <label for="givenForm">Given form</label>
        <select id="givenForm">
          <option value="random" selected>Random each row</option>
          <option value="fraction">Always fraction</option>
          <option value="decimal">Always decimal</option>
          <option value="percent">Always percent</option>
        </select>
      </div>
      <div class="field" style="max-width:7rem;">
        <label for="rowCount">Rows</label>
        <input type="number" id="rowCount" value="12" min="4" max="30">
      </div>
      <div class="field">
        <button id="generateBtn">Generate</button>
      </div>
    </div>
    <div class="controls" style="margin-top:.8rem;">
      <div class="field">
        <label for="seedDisplay">Sheet seed</label>
        <input type="text" id="seedDisplay" readonly aria-label="Sheet seed, used to reprint this exact sheet">
      </div>
      <div class="field" style="min-width:auto;">
        <label style="display:flex;align-items:center;gap:.4rem;font-weight:400;white-space:nowrap;">
          <input type="checkbox" id="lockSeed" style="width:auto;"> Lock seed &mdash; reprint this exact sheet
        </label>
      </div>
    </div>
  </div>

  <div class="tabs">
    <button type="button" class="tab-btn active" data-view="worksheet">Worksheet</button>
    <button type="button" class="tab-btn" data-view="key">Answer key</button>
  </div>

  <div class="view active" id="view-worksheet">
    <div class="card">
      <button class="secondary" id="printWorksheetBtn">Print worksheet</button>
      <table class="drill-table" id="worksheetTable" style="margin-top:1rem;"></table>
    </div>
  </div>

  <div class="view" id="view-key">
    <div class="card">
      <button class="secondary" id="printKeyBtn">Print answer key</button>
      <table class="drill-table" id="keyTable" style="margin-top:1rem;"></table>
    </div>
  </div>
</div>

<div id="printArea">
  <div class="sheet-page">
    <h2 class="sheet-title">Fraction&ndash;Decimal&ndash;Percent Conversion Drill</h2>
    <p class="sheet-sub">Name: __________________________ &nbsp; Date: __________</p>
    <table class="drill-table" id="printWorksheetTable"></table>
  </div>
  <div class="sheet-page">
    <h2 class="sheet-title">Answer Key</h2>
    <table class="drill-table" id="printKeyTable"></table>
  </div>
</div>

<script>
(function () {
  'use strict';

  var DENOMS = {
    easy: [2, 4, 5, 10, 20, 25, 50, 100],
    medium: [2, 3, 4, 5, 6, 8, 10, 20, 25, 100],
    hard: Array.from({ length: 19 }, function (_, i) { return i + 2; })
  };

  var STORE_KEY = 'fdp_settings_v1';

  /* mulberry32 — small, fast, seedable PRNG so a sheet can be reprinted
     identically (same seed + same settings = same rows). */
  function makeRng(seed) {
    if (seed == null) return Math.random;
    var state = seed >>> 0;
    return function () {
      state |= 0; state = (state + 0x6D2B79F5) | 0;
      var t = Math.imul(state ^ (state >>> 15), 1 | state);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }
  function randInt(rng, min, max) { return Math.floor(rng() * (max - min + 1)) + min; }
  function pick(rng, arr) { return arr[randInt(rng, 0, arr.length - 1)]; }
  function gcd(a, b) { return b === 0 ? a : gcd(b, a % b); }

  function fmtFraction(num, den) {
    var g = gcd(num, den) || 1;
    num /= g; den /= g;
    if (den === 1) return String(num);
    return num + '/' + den;
  }
  function trimNumberString(str) {
    if (str.indexOf('.') === -1) return str;
    return str.replace(/0+$/, '').replace(/\.$/, '');
  }
  function roundedDecimalValue(value) { return Math.round(value * 1000) / 1000; }

  function makeRow(rng, difficulty, givenSetting) {
    var denoms = DENOMS[difficulty];
    var den = pick(rng, denoms);
    var num = randInt(rng, 1, den - 1);
    var value = num / den;
    var roundedValue = roundedDecimalValue(value);
    var fraction = fmtFraction(num, den);
    var decimal = trimNumberString(roundedValue.toString());
    var percentValue = Math.round(roundedValue * 100 * 1000) / 1000;
    var percent = trimNumberString(percentValue.toString()) + '%';
    var given = givenSetting === 'random' ? pick(rng, ['fraction', 'decimal', 'percent']) : givenSetting;
    return { fraction: fraction, decimal: decimal, percent: percent, given: given };
  }

  var els = {};
  ['difficulty', 'givenForm', 'rowCount', 'generateBtn', 'worksheetTable', 'keyTable',
   'printWorksheetBtn', 'printKeyBtn', 'printWorksheetTable', 'printKeyTable',
   'seedDisplay', 'lockSeed', 'shareBtn', 'shareNote'].forEach(function (id) {
    els[id] = document.getElementById(id);
  });

  var DIFFICULTIES = ['easy', 'medium', 'hard'];
  var GIVEN_FORMS = ['random', 'fraction', 'decimal', 'percent'];
  var settings = { difficulty: 'medium', givenForm: 'random', rowCount: 12, lockSeed: false, seed: null };
  function loadSettings() {
    try {
      var saved = JSON.parse(localStorage.getItem(STORE_KEY) || 'null');
      if (saved && typeof saved === 'object') {
        if (saved.difficulty) settings.difficulty = saved.difficulty;
        if (saved.givenForm) settings.givenForm = saved.givenForm;
        if (saved.rowCount) settings.rowCount = saved.rowCount;
        settings.lockSeed = !!saved.lockSeed;
        settings.seed = typeof saved.seed === 'number' ? saved.seed : null;
      }
    } catch (e) { /* ignore */ }
  }
  function saveSettings() {
    try { localStorage.setItem(STORE_KEY, JSON.stringify(settings)); } catch (e) { /* storage full/blocked */ }
  }

  var rows = [];

  function tableHtml(showAnswers) {
    var head = '<tr><th>#</th><th>Fraction</th><th>Decimal</th><th>Percent</th></tr>';
    var body = rows.map(function (r, i) {
      function cell(form, value) {
        if (form === r.given) return '<td class="given">' + value + '</td>';
        if (showAnswers) return '<td class="answer">' + value + '</td>';
        return '<td>&nbsp;</td>';
      }
      return '<tr><td>' + (i + 1) + '</td>' + cell('fraction', r.fraction) + cell('decimal', r.decimal) + cell('percent', r.percent) + '</tr>';
    }).join('');
    return head + body;
  }

  function nextSeed() {
    if (settings.lockSeed && settings.seed != null) return settings.seed;
    return Math.floor(Math.random() * 0xFFFFFFFF);
  }

  /* The rows `settings` describes. Split out of generate() so a sheet that
     arrived over a link is rebuilt from ITS seed — generate() draws a new one
     unless the seed is locked, which would quietly hand the receiving teacher
     a different worksheet from the one they were sent. */
  function buildRows() {
    var rng = makeRng(settings.seed);
    rows = [];
    for (var i = 0; i < settings.rowCount; i++) rows.push(makeRow(rng, settings.difficulty, settings.givenForm));
    els.seedDisplay.value = settings.seed;
    render();
  }

  function generate() {
    settings.difficulty = els.difficulty.value;
    settings.givenForm = els.givenForm.value;
    settings.rowCount = Math.max(4, Math.min(30, parseInt(els.rowCount.value, 10) || 12));
    settings.lockSeed = els.lockSeed.checked;
    settings.seed = nextSeed();
    saveSettings();
    buildRows();
  }

  function render() {
    els.worksheetTable.innerHTML = tableHtml(false);
    els.keyTable.innerHTML = tableHtml(true);
  }

  els.generateBtn.addEventListener('click', generate);

  document.querySelectorAll('.tab-btn').forEach(function (btn) {
    btn.addEventListener('click', function () {
      document.querySelectorAll('.tab-btn').forEach(function (b) { b.classList.remove('active'); });
      btn.classList.add('active');
      var view = btn.getAttribute('data-view');
      document.getElementById('view-worksheet').classList.toggle('active', view === 'worksheet');
      document.getElementById('view-key').classList.toggle('active', view === 'key');
    });
  });

  els.printWorksheetBtn.addEventListener('click', function () {
    els.printWorksheetTable.innerHTML = tableHtml(false);
    els.printKeyTable.innerHTML = tableHtml(true);
    window.print();
  });
  els.printKeyBtn.addEventListener('click', function () {
    els.printWorksheetTable.innerHTML = tableHtml(false);
    els.printKeyTable.innerHTML = tableHtml(true);
    window.print();
  });

  /* ---------- share this sheet: _shared/share.js (Path 6 P3) --------------
     THE LINK IS THE WORKSHEET. Nothing here is authored — every row is drawn
     by mulberry32 from the seed above — so what travels is the four numbers
     that regenerate it: difficulty, which form is given, how many rows, and
     the seed. The receiving device rebuilds the same sheet and the same
     answer key, row for row, which is more than a list of rows would have
     given it: it can print more copies, print the key on its own, or change
     the difficulty and get a matched sheet.

     081 is the tool this follows and its two rules hold here. Nothing is
     anybody's typing, so an arrival NEVER STOPS TO ASK. And "lock seed" does
     not travel: it is a statement about what the NEXT press of Generate
     should do on this device, not about this sheet. */
  var SHARE_PARAM = 'drill';

  function setShareNote(text, isError) {
    els.shareNote.textContent = text || '';
    els.shareNote.style.display = text ? '' : 'none';
    els.shareNote.classList.toggle('error', !!isError);
  }

  Share.mount(els.shareBtn, {
    getState: function () {
      if (settings.seed == null || !rows.length) return null;
      return {
        difficulty: settings.difficulty, givenForm: settings.givenForm,
        rowCount: settings.rowCount, seed: settings.seed
      };
    },
    param: SHARE_PARAM,
    tool: 'fraction-decimal-percent-drill-generator',
    title: 'Share this sheet',
    noun: 'this drill sheet',
    filename: 'conversion drill',
    note: 'The link carries the seed this sheet was drawn from, not the rows — the other device generates the same sheet and the same answer key from it.',
    successMessage: 'Link copied. Opening it builds this exact sheet on the other device.',
    emptyMessage: 'Generate a sheet first — the link carries the seed it was drawn from.',
    onMessage: function (text, isError) { setShareNote(text, isError); }
  });

  function isPlausibleSheet(obj) {
    return !!obj && typeof obj === 'object' && typeof obj.seed === 'number' &&
      isFinite(obj.seed) && DIFFICULTIES.indexOf(obj.difficulty) !== -1;
  }

  function importSharedSheet() {
    return Share.receive({
      param: SHARE_PARAM,
      validate: isPlausibleSheet,
      onError: function (message) { setShareNote(message, true); },
      onState: function (decoded) {
        settings.difficulty = decoded.difficulty;
        settings.givenForm = GIVEN_FORMS.indexOf(decoded.givenForm) === -1 ? 'random' : decoded.givenForm;
        settings.rowCount = Math.max(4, Math.min(30, parseInt(decoded.rowCount, 10) || 12));
        settings.seed = decoded.seed >>> 0;
        saveSettings();
        setShareNote('Loaded a shared drill sheet — the same ' + settings.rowCount +
          ' rows and the same answer key as the device that sent it.');
        return true;
      }
    });
  }

  /* ---------- boot ---------- */
  loadSettings();
  var arrived = importSharedSheet();
  els.difficulty.value = settings.difficulty;
  els.givenForm.value = settings.givenForm;
  els.rowCount.value = settings.rowCount;
  els.lockSeed.checked = settings.lockSeed;
  /* generate() draws a NEW seed unless the seed is locked, so a shared sheet
     is rebuilt from the seed that arrived rather than generated. */
  if (arrived) buildRows(); else generate();
})();
</script>
<script src="../_shared/sw-register.js" defer></script>
</body>
