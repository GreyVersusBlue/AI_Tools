<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Virtual Manipulatives Board</title>
<meta name="description" content="A projector-friendly board of draggable base-ten blocks, fraction tiles, algebra tiles, and a number line for demonstrating a concept live, with a one-click snapshot of whatever's on the board.">

<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%23F6F7F9'/%3E%3Crect x='7' y='7' width='7' height='7' fill='%232e6b8f'/%3E%3Crect x='17' y='7' width='7' height='7' fill='%231f3550'/%3E%3Crect x='7' y='17' width='7' height='7' fill='%231f3550'/%3E%3Crect x='17' y='17' width='7' height='7' fill='%232e6b8f'/%3E%3C/svg%3E">
<style>
  :root {
    --ink: #1f2430; --paper: #fafaf8; --card: #fff;
    --line: #dcdad2; --line-strong: #c3c0b6;
    --accent: #1f3550; --accent-2: #2e6b8f; --muted: #6b6a63; --err: #a3372b;
  }
  * { box-sizing: border-box; }
  body {
    font-family: "Segoe UI", Georgia, "Times New Roman", serif;
    background: var(--paper); color: var(--ink); margin: 0;
    padding: 24px 20px 100px; line-height: 1.45; user-select: none;
  }
  .wrap { max-width: 1400px; margin: 0 auto; }
  .app-header { display: flex; align-items: baseline; justify-content: space-between; gap: 1rem; flex-wrap: wrap; margin-bottom: 1.4rem; }
  .app-header h1 { font-size: 1.7rem; margin: 0 0 .2rem; }
  .app-header .sub { color: var(--muted); font-size: .88rem; margin: 0; }
  .back-link { color: var(--muted); text-decoration: none; font-size: .88rem; }
  .back-link:hover { color: var(--accent-2); }

  .tabs { display: flex; gap: .4rem; margin-bottom: 1rem; }
  .tabs button { background: #fff; color: var(--ink); border: 1px solid var(--line-strong); border-radius: 7px; padding: .5rem 1rem; font-weight: 600; cursor: pointer; }
  .tabs button.active { background: var(--accent); color: #fff; border-color: var(--accent); }
  .pane { display: none; }
  .pane.active { display: block; }

  .palette { display: flex; flex-wrap: wrap; gap: .5rem; align-items: center; margin-bottom: .8rem; padding: .8rem; background: #fff; border: 1px solid var(--line); border-radius: 10px; }
  .palette .group-label { font-size: .74rem; text-transform: uppercase; letter-spacing: .04em; color: var(--muted); margin-right: -.2rem; }
  .palette button {
    font-family: inherit; font-size: .84rem; font-weight: 600; cursor: pointer;
    background: #fff; color: var(--ink); border: 1px solid var(--line-strong);
    border-radius: 6px; padding: .35rem .7rem;
  }
  .palette button:hover { background: #eef1f4; border-color: var(--accent-2); }
  .divider { width: 1px; height: 1.6rem; background: var(--line-strong); margin: 0 .3rem; }

  button.action { font-family: inherit; font-size: .9rem; font-weight: 600; cursor: pointer; background: var(--accent); color: #fff; border: 1px solid var(--accent); border-radius: 7px; padding: .5rem 1rem; }
  button.action:hover { background: var(--accent-2); border-color: var(--accent-2); }
  button.action.secondary { background: #fff; color: var(--ink); border-color: var(--line-strong); }
  button.action.secondary:hover { background: #f1f0ea; }
  .btnrow { display: flex; gap: .6rem; margin-bottom: .8rem; }

  #board {
    position: relative; background: #fff; border: 2px dashed var(--line-strong); border-radius: 10px;
    height: 60vh; min-height: 420px; overflow: hidden;
  }
  .piece { position: absolute; cursor: grab; touch-action: none; }
  .piece:active { cursor: grabbing; }
  .piece .del { position: absolute; top: -8px; right: -8px; width: 18px; height: 18px; border-radius: 50%; background: #fff; border: 1px solid var(--line-strong); color: var(--err); font-size: 11px; line-height: 16px; text-align: center; cursor: pointer; display: none; }
  .piece:hover .del { display: block; }

  .unit-block { width: 26px; height: 26px; background: #2e6b8f; border: 1px solid #1f3550; }
  .ten-block { display: flex; gap: 1px; }
  .ten-block .seg { width: 24px; height: 24px; background: #2e6b8f; border: 1px solid #1f3550; }
  .hundred-block { display: grid; grid-template-columns: repeat(10, 1fr); gap: 1px; width: 250px; }
  .hundred-block .seg { width: 22px; height: 22px; background: #1f3550; border: 1px solid #14243a; }

  .fraction-tile { display: flex; border: 1px solid var(--ink); }
  .fraction-tile .seg { width: 26px; height: 40px; border-right: 1px solid var(--ink); display: flex; align-items: center; justify-content: center; }
  .fraction-tile .seg:last-child { border-right: none; }
  .fraction-tile .seg.filled { background: #e2a640; }

  .algebra-tile { display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: .8rem; border: 1px solid #333; color: #fff; }
  .algebra-tile.pos { background: #2c6e3f; }
  .algebra-tile.neg { background: #a3372b; }
  .algebra-tile.unit { width: 30px; height: 30px; }
  .algebra-tile.xterm { width: 30px; height: 100px; }
  .algebra-tile.x2term { width: 100px; height: 100px; }

  .nl-controls { display: flex; gap: .8rem; align-items: end; margin-bottom: 1rem; }
  .nl-controls label { display: block; font-weight: 600; font-size: .82rem; margin-bottom: .3rem; }
  .nl-controls input { width: 6rem; font-family: inherit; font-size: .9rem; padding: .4rem .5rem; border: 1px solid var(--line-strong); border-radius: 6px; }
  #numberLineWrap { background: #fff; border: 1px solid var(--line); border-radius: 10px; padding: 3rem 2rem 2rem; height: 30vh; min-height: 220px; position: relative; }
  #nlLine { position: absolute; left: 2rem; right: 2rem; top: 50%; height: 2px; background: var(--ink); }
  .nl-tick { position: absolute; top: -6px; width: 1px; height: 14px; background: var(--ink); }
  .nl-tick-label { position: absolute; top: 14px; font-size: .78rem; transform: translateX(-50%); color: var(--muted); }
  .nl-marker { position: absolute; top: -22px; transform: translateX(-50%); cursor: grab; font-size: 1.6rem; color: var(--accent); }
  .nl-marker:active { cursor: grabbing; }
  .nl-hint { color: var(--muted); font-size: .82rem; margin-bottom: .6rem; }

  .snapshot-preview { margin-top: 1rem; }
  .snapshot-preview canvas { border: 1px solid var(--line); max-width: 100%; }
</style>
</head>
<body>
<div class="wrap">
  <div class="app-header">
    <div>
      <a class="back-link" href="../index.html">&larr; Toolkit</a>
      <h1>Virtual Manipulatives Board</h1>
      <p class="sub">Drag base-ten blocks, fraction tiles, and algebra tiles to demonstrate live &mdash; snapshot the board when you're done.</p>
    </div>
  </div>

  <div class="tabs">
    <button type="button" class="tab-btn active" data-pane="blocks">Blocks &amp; Tiles</button>
    <button type="button" class="tab-btn" data-pane="numberline">Number Line</button>
  </div>

  <div class="pane active" id="pane-blocks">
    <div class="palette">
      <span class="group-label">Base-Ten</span>
      <button data-add="unit">+1</button>
      <button data-add="ten">+10</button>
      <button data-add="hundred">+100</button>
      <span class="divider"></span>
      <span class="group-label">Fraction Tiles</span>
      <button data-add-fraction="2">&frac12;</button>
      <button data-add-fraction="3">&frac13;</button>
      <button data-add-fraction="4">&frac14;</button>
      <button data-add-fraction="5">1/5</button>
      <button data-add-fraction="6">&frac16;</button>
      <button data-add-fraction="8">&frac18;</button>
      <button data-add-fraction="10">1/10</button>
      <button data-add-fraction="12">1/12</button>
      <span class="divider"></span>
      <span class="group-label">Algebra Tiles</span>
      <button data-add="alg-pos1">+1</button>
      <button data-add="alg-neg1">&minus;1</button>
      <button data-add="alg-posx">+x</button>
      <button data-add="alg-negx">&minus;x</button>
      <button data-add="alg-posx2">+x&sup2;</button>
      <button data-add="alg-negx2">&minus;x&sup2;</button>
    </div>
    <div class="btnrow">
      <button class="action secondary" id="clearBoardBtn">Clear board</button>
      <button class="action" id="snapshotBoardBtn">Snapshot board</button>
    </div>
    <div id="board"></div>
  </div>

  <div class="pane" id="pane-numberline">
    <p class="nl-hint">Click anywhere on the line to drop a marker, drag a marker to move it, click a marker to remove it.</p>
    <div class="nl-controls">
      <div><label for="nlMin">Min</label><input type="number" id="nlMin" value="-10"></div>
      <div><label for="nlMax">Max</label><input type="number" id="nlMax" value="10"></div>
      <button class="action secondary" id="rebuildLineBtn">Rebuild line</button>
      <button class="action secondary" id="clearMarkersBtn">Clear markers</button>
      <button class="action" id="snapshotLineBtn">Snapshot number line</button>
    </div>
    <div id="numberLineWrap">
      <div id="nlLine"></div>
      <div id="nlTicks"></div>
      <div id="nlMarkers"></div>
    </div>
  </div>

  <div class="snapshot-preview" id="snapshotPreview"></div>
</div>

<script>
(function () {
  'use strict';

  /* ---------- generic drag ---------- */
  function makeDraggable(el, boundsEl) {
    var startX, startY, origLeft, origTop, dragging = false;
    el.addEventListener('pointerdown', function (ev) {
      if (ev.target.classList.contains('del')) return;
      dragging = true;
      el.setPointerCapture(ev.pointerId);
      startX = ev.clientX; startY = ev.clientY;
      origLeft = parseFloat(el.style.left) || 0;
      origTop = parseFloat(el.style.top) || 0;
    });
    el.addEventListener('pointermove', function (ev) {
      if (!dragging) return;
      var dx = ev.clientX - startX, dy = ev.clientY - startY;
      var bounds = boundsEl.getBoundingClientRect();
      var w = el.offsetWidth, h = el.offsetHeight;
      var newLeft = Math.max(0, Math.min(bounds.width - w, origLeft + dx));
      var newTop = Math.max(0, Math.min(bounds.height - h, origTop + dy));
      el.style.left = newLeft + 'px';
      el.style.top = newTop + 'px';
    });
    el.addEventListener('pointerup', function () { dragging = false; });
  }

  /* ---------- blocks & tiles board ---------- */
  var board = document.getElementById('board');
  var placeCounter = 0;

  function nextPos() {
    var col = placeCounter % 6, row = Math.floor(placeCounter / 6) % 5;
    placeCounter++;
    return { left: 16 + col * 60, top: 16 + row * 60 };
  }

  function addPieceEl(inner, type, w, h) {
    var pos = nextPos();
    var piece = document.createElement('div');
    piece.className = 'piece';
    piece.style.left = pos.left + 'px';
    piece.style.top = pos.top + 'px';
    piece.setAttribute('data-piece-type', type);
    piece.innerHTML = inner + '<span class="del">&times;</span>';
    board.appendChild(piece);
    makeDraggable(piece, board);
    piece.querySelector('.del').addEventListener('pointerdown', function (ev) { ev.stopPropagation(); });
    piece.querySelector('.del').addEventListener('click', function () { piece.remove(); });
    return piece;
  }

  function addUnit() { addPieceEl('<div class="unit-block"></div>', 'unit'); }
  function addTen() {
    var segs = '';
    for (var i = 0; i < 10; i++) segs += '<div class="seg"></div>';
    addPieceEl('<div class="ten-block">' + segs + '</div>', 'ten');
  }
  function addHundred() {
    var segs = '';
    for (var i = 0; i < 100; i++) segs += '<div class="seg"></div>';
    addPieceEl('<div class="hundred-block">' + segs + '</div>', 'hundred');
  }
  function addFraction(n) {
    var segs = '<div class="seg filled"></div>';
    for (var i = 1; i < n; i++) segs += '<div class="seg"></div>';
    addPieceEl('<div class="fraction-tile">' + segs + '</div>', 'fraction-' + n);
  }
  function addAlgebra(kind) {
    var map = {
      'alg-pos1': ['algebra-tile pos unit', '+1'],
      'alg-neg1': ['algebra-tile neg unit', '&minus;1'],
      'alg-posx': ['algebra-tile pos xterm', '+x'],
      'alg-negx': ['algebra-tile neg xterm', '&minus;x'],
      'alg-posx2': ['algebra-tile pos x2term', '+x&sup2;'],
      'alg-negx2': ['algebra-tile neg x2term', '&minus;x&sup2;']
    };
    var spec = map[kind];
    addPieceEl('<div class="' + spec[0] + '">' + spec[1] + '</div>', kind);
  }

  document.querySelectorAll('[data-add]').forEach(function (btn) {
    btn.addEventListener('click', function () {
      var type = btn.getAttribute('data-add');
      if (type === 'unit') addUnit();
      else if (type === 'ten') addTen();
      else if (type === 'hundred') addHundred();
      else addAlgebra(type);
    });
  });
  document.querySelectorAll('[data-add-fraction]').forEach(function (btn) {
    btn.addEventListener('click', function () { addFraction(parseInt(btn.getAttribute('data-add-fraction'), 10)); });
  });

  document.getElementById('clearBoardBtn').addEventListener('click', function () {
    board.innerHTML = '';
    placeCounter = 0;
  });

  /* ---------- tabs ---------- */
  document.querySelectorAll('.tab-btn').forEach(function (btn) {
    btn.addEventListener('click', function () {
      document.querySelectorAll('.tab-btn').forEach(function (b) { b.classList.remove('active'); });
      btn.classList.add('active');
      var pane = btn.getAttribute('data-pane');
      document.getElementById('pane-blocks').classList.toggle('active', pane === 'blocks');
      document.getElementById('pane-numberline').classList.toggle('active', pane === 'numberline');
    });
  });

  /* ---------- number line ---------- */
  var nlLine = document.getElementById('nlLine');
  var nlTicks = document.getElementById('nlTicks');
  var nlMarkers = document.getElementById('nlMarkers');
  var nlMin = document.getElementById('nlMin');
  var nlMax = document.getElementById('nlMax');
  var markers = [];

  function nlRange() {
    var min = parseInt(nlMin.value, 10); var max = parseInt(nlMax.value, 10);
    if (isNaN(min)) min = -10; if (isNaN(max) || max <= min) max = min + 20;
    return { min: min, max: max };
  }

  function valueToPercent(v) {
    var r = nlRange();
    return (v - r.min) / (r.max - r.min) * 100;
  }
  function percentToValue(pct) {
    var r = nlRange();
    return Math.round(r.min + (pct / 100) * (r.max - r.min));
  }

  function buildTicks() {
    var r = nlRange();
    var html = '';
    for (var v = r.min; v <= r.max; v++) {
      var pct = valueToPercent(v);
      html += '<div class="nl-tick" style="left:' + pct + '%;"></div>';
      html += '<div class="nl-tick-label" style="left:' + pct + '%;">' + v + '</div>';
    }
    nlTicks.innerHTML = html;
  }

  function renderMarkers() {
    nlMarkers.innerHTML = markers.map(function (v, i) {
      return '<div class="nl-marker" data-idx="' + i + '" style="left:' + valueToPercent(v) + '%;">&#9650;</div>';
    }).join('');
    nlMarkers.querySelectorAll('.nl-marker').forEach(function (mEl) {
      var dragging = false, moved = false;
      mEl.addEventListener('pointerdown', function (ev) {
        dragging = true; moved = false;
        mEl.setPointerCapture(ev.pointerId);
      });
      mEl.addEventListener('pointermove', function (ev) {
        if (!dragging) return;
        moved = true;
        var lineRect = nlLine.getBoundingClientRect();
        var pct = Math.max(0, Math.min(100, (ev.clientX - lineRect.left) / lineRect.width * 100));
        var idx = parseInt(mEl.getAttribute('data-idx'), 10);
        markers[idx] = percentToValue(pct);
        mEl.style.left = valueToPercent(markers[idx]) + '%';
      });
      mEl.addEventListener('pointerup', function () {
        dragging = false;
        if (!moved) {
          var idx = parseInt(mEl.getAttribute('data-idx'), 10);
          markers.splice(idx, 1);
          renderMarkers();
        }
      });
    });
  }

  nlLine.addEventListener('click', function (ev) {
    var rect = nlLine.getBoundingClientRect();
    var pct = (ev.clientX - rect.left) / rect.width * 100;
    markers.push(percentToValue(pct));
    renderMarkers();
  });

  document.getElementById('rebuildLineBtn').addEventListener('click', function () {
    markers = [];
    buildTicks(); renderMarkers();
  });
  document.getElementById('clearMarkersBtn').addEventListener('click', function () {
    markers = [];
    renderMarkers();
  });

  /* ---------- snapshot ---------- */
  var COLORS = {
    unit: '#2e6b8f', ten: '#2e6b8f', hundred: '#1f3550'
  };
  function snapshotEl(containerEl, previewLabel) {
    var rect = containerEl.getBoundingClientRect();
    var canvas = document.createElement('canvas');
    canvas.width = rect.width; canvas.height = rect.height;
    var ctx = canvas.getContext('2d');
    ctx.fillStyle = '#ffffff';
    ctx.fillRect(0, 0, canvas.width, canvas.height);
    Array.prototype.forEach.call(containerEl.children, function (child) {
      var cRect = child.getBoundingClientRect();
      var x = cRect.left - rect.left, y = cRect.top - rect.top;
      if (child.classList.contains('piece') || child.classList.contains('nl-marker')) {
        ctx.fillStyle = getComputedStyle(child.firstElementChild || child).backgroundColor || '#888';
        ctx.fillRect(x, y, cRect.width, cRect.height);
        ctx.strokeStyle = '#333';
        ctx.strokeRect(x, y, cRect.width, cRect.height);
      }
    });
    ctx.strokeStyle = '#999';
    ctx.strokeRect(0, 0, canvas.width, canvas.height);
    var preview = document.getElementById('snapshotPreview');
    preview.innerHTML = '<p style="font-size:.85rem;color:var(--muted);margin:0 0 .4rem;">' + previewLabel + ' &mdash; right-click to save, or use the download link below.</p>';
    preview.appendChild(canvas);
    var link = document.createElement('a');
    link.textContent = 'Download PNG';
    link.href = canvas.toDataURL('image/png');
    link.download = 'manipulatives-snapshot.png';
    link.style.display = 'inline-block';
    link.style.marginTop = '.5rem';
    preview.appendChild(document.createElement('br'));
    preview.appendChild(link);
    preview.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
  }

  document.getElementById('snapshotBoardBtn').addEventListener('click', function () {
    snapshotEl(board, 'Board snapshot');
  });
  document.getElementById('snapshotLineBtn').addEventListener('click', function () {
    snapshotEl(document.getElementById('numberLineWrap'), 'Number line snapshot');
  });

  /* ---------- boot ---------- */
  buildTicks();
  renderMarkers();
})();
</script>
<script>
if ('serviceWorker' in navigator) {
  window.addEventListener('load', function () {
    navigator.serviceWorker.register('../sw.js').catch(function () {});
  });
}
</script>
</body>
</html>
