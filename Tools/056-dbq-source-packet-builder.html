<style>
  * { box-sizing: border-box; }
  body {
    font-family: "Segoe UI", Georgia, "Times New Roman", serif;
    background: var(--paper); color: var(--ink); margin: 0;
    padding: 24px 20px 100px; line-height: 1.45;
  }
  .wrap { max-width: 1100px; margin: 0 auto; }
  .app-header h1 { font-size: 1.7rem; margin: 0 0 .2rem; }
  .app-header .sub { color: var(--muted); font-size: .88rem; margin: 0; }
  .back-link { color: var(--muted); text-decoration: none; font-size: .88rem; }
  .back-link:hover { color: var(--accent-2); }

  .card h2 { font-size: 1rem; margin: 0 0 .7rem; }
  label { display: block; font-weight: 600; font-size: .82rem; margin-bottom: .3rem; }
  .hint { color: var(--muted); font-size: .78rem; margin: -.15rem 0 .6rem; }
  input[type="text"], textarea, select, input[type="file"] {
    width: 100%; font-family: inherit; font-size: .9rem; color: var(--ink);
    background: #fff; border: 1px solid var(--line-strong); border-radius: 6px;
    padding: .45rem .55rem; margin-bottom: .6rem;
  }
  textarea { resize: vertical; min-height: 4.5rem; }

  button {
    font-family: inherit; font-size: .92rem; font-weight: 600; cursor: pointer;
    background: var(--accent); color: #fff; border: 1px solid var(--accent);
    border-radius: 7px; padding: .55rem 1rem;
  }
  button:hover { background: var(--accent-2); border-color: var(--accent-2); }
  button.secondary { background: #fff; color: var(--ink); border-color: var(--line-strong); }
  button.secondary:hover { background: #f1f0ea; border-color: var(--muted); color: var(--ink); }
  button.danger { background: #fff; color: var(--err); border-color: var(--err); }
  button.danger:hover { background: var(--err); color: #fff; }
  button.small { padding: .2rem .5rem; font-size: .76rem; }
  .btnrow { display: flex; gap: .6rem; flex-wrap: wrap; }

  .source-block { border: 1px solid var(--line); border-radius: 8px; padding: .9rem 1rem; margin-bottom: .9rem; }
  .source-block h3 { font-size: 1.05rem; margin: 0 0 .5rem; color: var(--accent); }
  .qrow { display: flex; align-items: center; gap: .5rem; padding: .2rem 0; }
  .qrow input { margin-bottom: 0; }

  .crop-tool {
    position: relative; width: 100%; max-width: 320px; overflow: hidden;
    border: 1px solid var(--line-strong); border-radius: 4px; cursor: crosshair;
    touch-action: none; -webkit-user-select: none; user-select: none; margin-bottom: .3rem;
  }
  .crop-tool img { display: block; width: 100%; height: auto; pointer-events: none; -webkit-user-drag: none; }
  .crop-box { position: absolute; border: 2px solid var(--accent); background: rgba(31,53,80,.15); box-sizing: border-box; pointer-events: none; }
  .crop-hint { color: var(--muted); font-size: .76rem; margin: 0 0 .5rem; }
  .scale-row { display: flex; align-items: center; gap: .6rem; margin-bottom: .3rem; }
  .scale-row input[type="range"] { flex: 1; margin-bottom: 0; }
  .scale-val { font-size: .78rem; color: var(--muted); min-width: 2.6rem; text-align: right; }
  .crop-frame { position: relative; overflow: hidden; border: 1px solid var(--line-strong); border-radius: 4px; background: #f1f0ea; margin-bottom: .6rem; }
  .crop-frame img { display: block; max-width: none; }

  .print-title { font-size: 1.4rem; margin: 0 0 .2rem; }
  .print-context { font-size: .9rem; margin: .3rem 0 1rem; }
  .source-page { page-break-after: always; }
  .source-page h2 { font-size: 1.1rem; border-bottom: 1.5px solid #333; padding-bottom: .2rem; }
  .source-page .citation { font-size: .78rem; color: #555; font-style: italic; margin-bottom: .6rem; }
  .source-page .source-text { font-size: .92rem; white-space: pre-line; margin-bottom: .8rem; }
  .source-page img { max-width: 100%; margin-bottom: .8rem; }
  .source-page .crop-frame { margin-bottom: .8rem; }
  .source-page .crop-frame img { max-width: none; margin-bottom: 0; }
  .source-page .q-item { font-size: .9rem; margin-bottom: .1rem; }
  .fill-line { display: block; border-bottom: 1px solid #999; height: 1.2rem; margin: .1rem 0 .5rem; }
  .shared-q { font-size: .9rem; margin-top: 1.5rem; }

</style>
</head>
<body>
<div class="wrap">
  <div class="app-header">
    <div>
      <a class="back-link" href="../index.html">&larr; Toolkit</a>
      <h1>DBQ / Source Packet Builder</h1>
      <p class="sub">Assemble sources, add guiding questions per source, print one packet.</p>
    </div>
    <div class="btnrow">
      <button class="secondary" id="printBtn">Print packet</button>
    </div>
  </div>

  <div class="card">
    <label for="packetTitle">Packet title</label>
    <input type="text" id="packetTitle" placeholder="e.g. Causes of the American Revolution">
    <label for="packetContext">Historical context / task</label>
    <textarea id="packetContext" placeholder="Brief background and the overall question students should answer using these sources."></textarea>
    <label for="essayPrompt">Final synthesis / essay prompt (optional)</label>
    <textarea id="essayPrompt" placeholder="e.g. Using the sources above and your own knowledge, write an essay that answers the question..."></textarea>
    <p class="hint">Printed as a closing page after the last source, separate from the historical context above.</p>
  </div>

  <div class="card">
    <h2>Shared guiding questions (asked for every source)</h2>
    <div id="sharedQWrap"></div>
    <button type="button" class="secondary small" id="addSharedQBtn">+ Add shared question</button>
  </div>

  <div class="card">
    <div class="btnrow">
      <h2 style="margin:0;flex:1;">Sources</h2>
      <button id="addSourceBtn">+ Add source</button>
    </div>
    <div id="sourcesWrap"></div>
  </div>
</div>

<div id="printArea"></div>

<script>
(function () {
  'use strict';
  var STORE_KEY = 'dbq_packet_v1';

  var els = {};
  ['packetTitle', 'packetContext', 'essayPrompt', 'sharedQWrap', 'addSharedQBtn', 'sourcesWrap', 'addSourceBtn', 'printBtn', 'printArea'].forEach(function (id) {
    els[id] = document.getElementById(id);
  });

  var state = { title: '', context: '', essayPrompt: '', sharedQuestions: [], sources: [] };

  function uid() { return 'x' + Date.now().toString(36) + Math.random().toString(36).slice(2, 6); }
  function escapeHtml(s) {
    return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }
  function escapeAttr(s) { return String(s == null ? '' : s).replace(/"/g, '&quot;'); }
  var LETTERS = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ';

  function load() {
    try {
      var saved = JSON.parse(localStorage.getItem(STORE_KEY) || 'null');
      if (saved && Array.isArray(saved.sources)) state = saved;
    } catch (e) { /* ignore */ }
    if (!state.sharedQuestions.length) state.sharedQuestions = [{ id: uid(), text: 'What is the main idea of this source?' }, { id: uid(), text: 'Who created this source, and why might that matter?' }];
    if (!state.sources.length) state.sources = [{ id: uid(), title: '', type: 'text', text: '', image: null, citation: '', questions: [{ id: uid(), text: '' }] }];
    if (typeof state.essayPrompt !== 'string') state.essayPrompt = '';
    state.sources.forEach(function (s) {
      if (!s.crop || typeof s.crop.w !== 'number') s.crop = { x: 0, y: 0, w: 1, h: 1 };
      if (typeof s.widthPct !== 'number') s.widthPct = 100;
    });
  }
  function save() {
    try { localStorage.setItem(STORE_KEY, JSON.stringify(state)); } catch (e) { /* storage full/blocked, e.g. large images */ }
  }

  /* ---------- image crop/scale (non-destructive: crop+widthPct sit
     alongside the untouched original data URL in src.image/src.imgW/imgH) ---------- */
  function clamp01(n) { return Math.min(1, Math.max(0, n)); }
  function normCrop(c) {
    c = c || {};
    var w = Math.max(clamp01(typeof c.w === 'number' ? c.w : 1), 0.02);
    var h = Math.max(clamp01(typeof c.h === 'number' ? c.h : 1), 0.02);
    var x = Math.min(clamp01(typeof c.x === 'number' ? c.x : 0), 1 - w);
    var y = Math.min(clamp01(typeof c.y === 'number' ? c.y : 0), 1 - h);
    return { x: x, y: y, w: w, h: h };
  }
  /* Container style: sized to widthPct of its column, clipped to the crop's
     own aspect ratio (once natural image dimensions are known). */
  function cropFrameStyle(src) {
    var s = 'width:' + (src.widthPct || 100) + '%;';
    if (src.imgW && src.imgH) {
      var c = normCrop(src.crop);
      s += 'aspect-ratio:' + ((c.w * src.imgW) / (c.h * src.imgH)).toFixed(4) + ';';
    }
    return s;
  }
  /* Foreground <img> inside a .crop-frame, scaled/offset so only the crop
     rect shows — a real <img>, not a CSS background, so it always prints
     without needing "print background graphics" turned on. */
  function cropImgStyle(crop) {
    var c = normCrop(crop);
    var left = (-(c.x / c.w) * 100).toFixed(2), top = (-(c.y / c.h) * 100).toFixed(2), w = (100 / c.w).toFixed(2);
    return 'position:absolute;left:' + left + '%;top:' + top + '%;width:' + w + '%;height:auto;';
  }
  function cropBoxStyle(crop) {
    var c = normCrop(crop);
    return 'left:' + (c.x * 100).toFixed(2) + '%;top:' + (c.y * 100).toFixed(2) + '%;width:' + (c.w * 100).toFixed(2) + '%;height:' + (c.h * 100).toFixed(2) + '%;';
  }

  function renderSharedQ() {
    els.sharedQWrap.innerHTML = state.sharedQuestions.map(function (q) {
      return '<div class="qrow" data-id="' + q.id + '"><input type="text" data-sq="' + q.id + '" value="' + escapeAttr(q.text) + '">' +
        '<button type="button" class="danger small" data-del-sq="' + q.id + '">&times;</button></div>';
    }).join('');
  }
  els.sharedQWrap.addEventListener('input', function (ev) {
    var id = ev.target.getAttribute('data-sq');
    if (!id) return;
    var q = state.sharedQuestions.find(function (x) { return x.id === id; });
    if (q) q.text = ev.target.value;
    save();
  });
  els.sharedQWrap.addEventListener('click', function (ev) {
    var id = ev.target.getAttribute('data-del-sq');
    if (!id) return;
    state.sharedQuestions = state.sharedQuestions.filter(function (q) { return q.id !== id; });
    save(); renderSharedQ();
  });
  els.addSharedQBtn.addEventListener('click', function () {
    state.sharedQuestions.push({ id: uid(), text: '' });
    save(); renderSharedQ();
  });

  function renderSources() {
    els.sourcesWrap.innerHTML = state.sources.map(function (src, i) {
      var label = 'Source ' + LETTERS[i % 26];
      var imgPreview = '';
      if (src.type === 'image' && src.image) {
        imgPreview =
          '<label>Crop</label>' +
          '<p class="crop-hint">Drag on the photo to select the region that prints.</p>' +
          '<div class="crop-tool" data-crop-src="' + src.id + '">' +
          '<img src="' + src.image + '" alt="" draggable="false">' +
          '<div class="crop-box" style="' + cropBoxStyle(src.crop) + '"></div>' +
          '</div>' +
          '<div class="btnrow" style="margin-bottom:.6rem;">' +
          '<button type="button" class="secondary small" data-reset-crop="' + src.id + '">Reset crop</button>' +
          '</div>' +
          '<label>Print width (% of column)</label>' +
          '<div class="scale-row">' +
          '<input type="range" min="20" max="100" step="5" value="' + (src.widthPct || 100) + '" data-field="widthPct" data-src="' + src.id + '">' +
          '<span class="scale-val">' + (src.widthPct || 100) + '%</span>' +
          '</div>' +
          '<label>Preview at print size</label>' +
          '<div class="crop-frame" style="' + cropFrameStyle(src) + '"><img src="' + src.image + '" alt="" style="' + cropImgStyle(src.crop) + '"></div>';
      }
      var questions = src.questions.map(function (q) {
        return '<div class="qrow" data-src="' + src.id + '" data-q="' + q.id + '"><input type="text" data-field="qtext" value="' + escapeAttr(q.text) + '" placeholder="Source-specific question">' +
          '<button type="button" class="danger small" data-del-q="' + q.id + '" data-del-src="' + src.id + '">&times;</button></div>';
      }).join('');
      return '<div class="source-block" data-src-id="' + src.id + '">' +
        '<div class="btnrow" style="justify-content:space-between;align-items:center;">' +
        '<h3 style="margin:0;">' + label + '</h3>' +
        '<span class="btnrow">' +
        '<button type="button" class="secondary small" data-move-up="' + src.id + '"' + (i === 0 ? ' disabled' : '') + '>&uarr; Move up</button>' +
        '<button type="button" class="secondary small" data-move-down="' + src.id + '"' + (i === state.sources.length - 1 ? ' disabled' : '') + '>&darr; Move down</button>' +
        '</span></div>' +
        '<label>Source title</label><input type="text" data-field="title" data-src="' + src.id + '" value="' + escapeAttr(src.title) + '">' +
        '<label>Type</label><select data-field="type" data-src="' + src.id + '"><option value="text"' + (src.type === 'text' ? ' selected' : '') + '>Text</option><option value="image"' + (src.type === 'image' ? ' selected' : '') + '>Image</option></select>' +
        (src.type === 'text'
          ? '<label>Source text</label><textarea data-field="text" data-src="' + src.id + '">' + escapeHtml(src.text) + '</textarea>'
          : imgPreview + '<label>Upload image</label><input type="file" accept="image/*" data-field="image" data-src="' + src.id + '">') +
        '<label>Citation</label><input type="text" data-field="citation" data-src="' + src.id + '" value="' + escapeAttr(src.citation) + '" placeholder="e.g. Letter from John Adams, 1776">' +
        '<label>Source-specific questions</label>' + questions +
        '<button type="button" class="secondary small" data-add-q="' + src.id + '">+ Add question</button>' +
        '<button type="button" class="danger small" data-del-src-btn="' + src.id + '" style="margin-left:.5rem;">Remove source</button>' +
        '</div>';
    }).join('');
  }

  function findSource(id) { return state.sources.find(function (s) { return s.id === id; }); }

  els.sourcesWrap.addEventListener('input', function (ev) {
    var field = ev.target.getAttribute('data-field');
    var srcId = ev.target.getAttribute('data-src');
    if (field && srcId) {
      var src = findSource(srcId);
      if (!src) return;
      if (field === 'type') { src.type = ev.target.value; save(); renderSources(); return; }
      if (field === 'qtext') {
        var row = ev.target.closest('.qrow');
        var qId = row.getAttribute('data-q');
        var q = src.questions.find(function (x) { return x.id === qId; });
        if (q) q.text = ev.target.value;
        save();
        return;
      }
      if (field === 'widthPct') {
        // Update in place (no renderSources()) so dragging the range input
        // isn't interrupted by the innerHTML rebuild mid-drag.
        src.widthPct = parseInt(ev.target.value, 10) || 100;
        save();
        var block = ev.target.closest('.source-block');
        var frame = block && block.querySelector('.crop-frame');
        var valSpan = block && block.querySelector('.scale-val');
        if (frame) frame.style.width = src.widthPct + '%';
        if (valSpan) valSpan.textContent = src.widthPct + '%';
        return;
      }
      src[field] = ev.target.value;
      save();
    }
  });

  els.sourcesWrap.addEventListener('change', function (ev) {
    if (ev.target.getAttribute('data-field') !== 'image') return;
    var srcId = ev.target.getAttribute('data-src');
    var src = findSource(srcId);
    var file = ev.target.files && ev.target.files[0];
    if (!src || !file) return;
    var reader = new FileReader();
    reader.onload = function () {
      src.image = reader.result;
      src.imgW = 0; src.imgH = 0;
      src.crop = { x: 0, y: 0, w: 1, h: 1 };
      if (typeof src.widthPct !== 'number') src.widthPct = 100;
      save(); renderSources();
      var probe = new Image();
      probe.onload = function () {
        // A fresh upload always matches src.image at this point (no
        // re-upload race in this single-file <input>), so it's safe to store.
        src.imgW = probe.naturalWidth; src.imgH = probe.naturalHeight;
        save(); renderSources();
      };
      probe.src = src.image;
    };
    reader.readAsDataURL(file);
  });

  /* crop-box drag-to-select: pointerdown starts a rubber-band rectangle
     over the full (uncropped) thumbnail, pointerup commits it as the new
     normalized crop rect. Listeners are delegated on sourcesWrap since the
     .crop-tool elements are replaced whenever renderSources() runs. */
  var cropDrag = null;
  els.sourcesWrap.addEventListener('pointerdown', function (ev) {
    var tool = ev.target.closest('.crop-tool');
    if (!tool) return;
    ev.preventDefault();
    var rect = tool.getBoundingClientRect();
    var sx = clamp01((ev.clientX - rect.left) / rect.width);
    var sy = clamp01((ev.clientY - rect.top) / rect.height);
    cropDrag = { srcId: tool.getAttribute('data-crop-src'), box: tool.querySelector('.crop-box'), rect: rect, startX: sx, startY: sy, pending: null };
    try { tool.setPointerCapture(ev.pointerId); } catch (e) { /* ignore */ }
  });
  els.sourcesWrap.addEventListener('pointermove', function (ev) {
    if (!cropDrag) return;
    var sx = clamp01((ev.clientX - cropDrag.rect.left) / cropDrag.rect.width);
    var sy = clamp01((ev.clientY - cropDrag.rect.top) / cropDrag.rect.height);
    var x = Math.min(sx, cropDrag.startX), y = Math.min(sy, cropDrag.startY);
    var w = Math.abs(sx - cropDrag.startX), h = Math.abs(sy - cropDrag.startY);
    cropDrag.pending = { x: x, y: y, w: w, h: h };
    if (cropDrag.box) cropDrag.box.style.cssText = cropBoxStyle(cropDrag.pending);
  });
  function endCropDrag() {
    if (!cropDrag) return;
    var srcId = cropDrag.srcId, pending = cropDrag.pending;
    cropDrag = null;
    if (!pending || pending.w < 0.04 || pending.h < 0.04) return; // negligible drag: keep existing crop
    var src = findSource(srcId);
    if (src) { src.crop = normCrop(pending); save(); renderSources(); }
  }
  els.sourcesWrap.addEventListener('pointerup', endCropDrag);
  els.sourcesWrap.addEventListener('pointercancel', endCropDrag);

  els.sourcesWrap.addEventListener('click', function (ev) {
    var addQSrc = ev.target.getAttribute('data-add-q');
    var delQ = ev.target.getAttribute('data-del-q');
    var delSrcBtn = ev.target.getAttribute('data-del-src-btn');
    var moveUp = ev.target.getAttribute('data-move-up');
    var moveDown = ev.target.getAttribute('data-move-down');
    var resetCrop = ev.target.getAttribute('data-reset-crop');
    if (resetCrop) {
      var rsrc = findSource(resetCrop);
      if (rsrc) { rsrc.crop = { x: 0, y: 0, w: 1, h: 1 }; save(); renderSources(); }
      return;
    }
    if (moveUp || moveDown) {
      var id = moveUp || moveDown;
      var pos = state.sources.findIndex(function (s) { return s.id === id; });
      var swapWith = moveUp ? pos - 1 : pos + 1;
      if (pos < 0 || swapWith < 0 || swapWith >= state.sources.length) return;
      var tmp = state.sources[pos];
      state.sources[pos] = state.sources[swapWith];
      state.sources[swapWith] = tmp;
      save(); renderSources();
      return;
    }
    if (addQSrc) {
      var src = findSource(addQSrc);
      if (src) src.questions.push({ id: uid(), text: '' });
      save(); renderSources();
    } else if (delQ) {
      var delSrcId = ev.target.getAttribute('data-del-src');
      var src2 = findSource(delSrcId);
      if (src2) src2.questions = src2.questions.filter(function (q) { return q.id !== delQ; });
      save(); renderSources();
    } else if (delSrcBtn) {
      state.sources = state.sources.filter(function (s) { return s.id !== delSrcBtn; });
      save(); renderSources();
    }
  });

  els.addSourceBtn.addEventListener('click', function () {
    state.sources.push({ id: uid(), title: '', type: 'text', text: '', image: null, imgW: 0, imgH: 0, crop: { x: 0, y: 0, w: 1, h: 1 }, widthPct: 100, citation: '', questions: [{ id: uid(), text: '' }] });
    save(); renderSources();
  });

  els.packetTitle.addEventListener('input', function () { state.title = els.packetTitle.value; save(); });
  els.packetContext.addEventListener('input', function () { state.context = els.packetContext.value; save(); });
  els.essayPrompt.addEventListener('input', function () { state.essayPrompt = els.essayPrompt.value; save(); });

  els.printBtn.addEventListener('click', function () {
    if (!state.sources.length) { alert('Add at least one source first.'); return; }
    var title = state.title.trim() || 'DBQ Source Packet';
    var coverHtml = '<h1 class="print-title">' + escapeHtml(title) + '</h1>' +
      '<p class="print-context">' + escapeHtml(state.context || '') + '</p>' +
      '<p class="print-context">Name: __________________________ &nbsp; Date: __________</p>';
    var sourcesHtml = state.sources.map(function (src, i) {
      var label = 'Source ' + LETTERS[i % 26];
      var body = src.type === 'image' && src.image
        ? '<div class="crop-frame" style="' + cropFrameStyle(src) + '"><img src="' + src.image + '" alt="" style="' + cropImgStyle(src.crop) + '"></div>'
        : '<div class="source-text">' + escapeHtml(src.text || '(no text entered)') + '</div>';
      var allQuestions = src.questions.filter(function (q) { return q.text.trim(); }).concat(state.sharedQuestions.filter(function (q) { return q.text.trim(); }));
      var qHtml = allQuestions.map(function (q) {
        return '<div class="q-item">' + escapeHtml(q.text) + '</div><span class="fill-line"></span>';
      }).join('');
      return '<div class="source-page"><h2>' + label + (src.title.trim() ? ': ' + escapeHtml(src.title.trim()) : '') + '</h2>' +
        '<div class="citation">' + escapeHtml(src.citation || '') + '</div>' +
        body + qHtml + '</div>';
    }).join('');
    var essayHtml = state.essayPrompt.trim()
      ? '<div class="source-page"><h2>Synthesis / Essay Prompt</h2><div class="source-text">' + escapeHtml(state.essayPrompt.trim()) + '</div>' +
        '<span class="fill-line"></span><span class="fill-line"></span><span class="fill-line"></span><span class="fill-line"></span></div>'
      : '';
    els.printArea.innerHTML = '<div class="source-page">' + coverHtml + '</div>' + sourcesHtml + essayHtml;
    window.print();
  });

  /* ---------- boot ---------- */
  load();
  els.packetTitle.value = state.title;
  els.packetContext.value = state.context;
  els.essayPrompt.value = state.essayPrompt;
  renderSharedQ();
  renderSources();
})();
</script>
<script src="../_shared/sw-register.js" defer></script>
</body>
</html>
